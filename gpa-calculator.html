<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GPA Calculator | AUC Atlas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #171717;
    }

    .gpa-page {
      min-height: 100vh;
      padding: 126px 0 86px;
      background:
        linear-gradient(180deg, rgba(192, 154, 92, 0.14), rgba(247, 244, 238, 0) 360px),
        #f7f4ee;
    }

    .gpa-inner {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    .gpa-header {
      width: 100%;
      margin: 0 auto 38px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 28px;
      align-items: end;
      text-align: left;
    }

    .gpa-header h1 {
      max-width: 640px;
      margin: 0;
      color: #171717;
      font-size: clamp(26px, 3vw, 40px);
      font-weight: 700;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .gpa-header p {
      max-width: 420px;
      margin: 0;
      color: rgba(23, 23, 23, 0.66);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.7;
      text-align: left;
    }

    .gpa-layout {
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .gpa-panel {
      width: 100%;
      min-width: 0;
      background: transparent;
    }

    .gpa-loading {
      min-height: 130px;
      padding: 24px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: rgba(23, 23, 23, 0.56);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: none;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 12px;
    }

    .gpa-loading-spinner {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      border: 2px solid rgba(192, 154, 92, 0.2);
      border-top-color: #c09a5c;
      border-radius: 50%;
      animation: gpaLoadingSpin 0.75s linear infinite;
    }

    @keyframes gpaLoadingSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .gpa-summary {
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 70px rgba(42, 32, 20, 0.1);
    }

    .gpa-row,
    .gpa-table-head {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 104px 132px 36px;
      gap: 12px;
      align-items: center;
    }

    .gpa-row {
      position: relative;
      z-index: 1;
      padding: 10px 0;
      border-bottom: 1px solid rgba(23, 23, 23, 0.08);
      transform-origin: center top;
      transition:
        height 0.3s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.28s ease,
        transform 0.28s ease;
    }

    .gpa-row:first-child {
      padding-top: 0;
    }

    .gpa-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .gpa-row:has(.grade-dropdown.open) {
      z-index: 40;
    }

    .gpa-row > .course-name,
    .gpa-row > .course-credits,
    .gpa-row > .grade-dropdown {
      min-width: 0;
      transform-origin: right center;
      transition:
        opacity 0.26s ease,
        transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.26s ease;
    }

    .gpa-row.is-entering {
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      pointer-events: none;
    }

    .gpa-row.is-removing {
      z-index: 1;
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      pointer-events: none;
    }

    .gpa-table-head {
      margin-bottom: 12px;
      padding: 0 4px 10px;
      border-bottom: 1px solid rgba(23, 23, 23, 0.08);
      color: rgba(23, 23, 23, 0.5);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .gpa-table-head span:nth-child(2),
    .gpa-table-head span:nth-child(3) {
      text-align: left;
    }

    .gpa-semesters {
      display: grid;
      gap: 22px;
    }

    .semester-courses {
      display: block;
    }

    .gpa-semester {
      position: relative;
      padding: 22px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 70px rgba(42, 32, 20, 0.1);
      transition:
        height 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.28s ease,
        transform 0.28s ease;
    }

    .gpa-semester:has(.grade-dropdown.open) {
      z-index: 20;
    }

    .gpa-semester.is-entering,
    .gpa-semester.is-removing {
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      pointer-events: none;
    }

    .gpa-semester-header {
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    .semester-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .remove-semester {
      flex: 0 0 36px;
    }

    .semester-course-footer {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(23, 23, 23, 0.08);
      display: flex;
      justify-content: flex-start;
    }

    .gpa-action.semester-add-course {
      width: auto;
      height: 38px;
      min-height: 38px;
      padding: 0 14px;
      border-color: rgba(23, 23, 23, 0.1);
      border-radius: 999px;
      background: rgba(247, 244, 238, 0.74);
      color: rgba(23, 23, 23, 0.68);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1;
      text-transform: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: none;
    }

    .semester-add-course::before {
      content: none;
    }

    .semester-add-course::after {
      content: "Add course";
      position: static;
      width: auto;
      height: auto;
      border-radius: 0;
      background: transparent;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transform: none;
    }

    .gpa-action.semester-add-course:hover {
      border-color: rgba(192, 154, 92, 0.34);
      background: rgba(192, 154, 92, 0.12);
      color: #171717;
    }

    .semester-name {
      width: 100%;
      min-height: 44px;
      padding: 0 2px;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: #171717;
      font: inherit;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .gpa-row input,
    .prior-inputs input,
    .grade-toggle {
      width: 100%;
      min-height: 52px;
      padding: 0 18px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #171717;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .course-credits {
      text-align: center;
    }

    .semester-name:hover {
      border-bottom-color: rgba(23, 23, 23, 0.16);
    }

    .gpa-row input:hover,
    .prior-inputs input:hover,
    .grade-toggle:hover {
      border-color: rgba(23, 23, 23, 0.18);
      background: rgba(255, 255, 255, 0.88);
    }

    .semester-name:focus {
      border-bottom-color: rgba(192, 154, 92, 0.84);
    }

    .gpa-row input:focus,
    .prior-inputs input:focus,
    .grade-dropdown.open .grade-toggle {
      border-color: rgba(192, 154, 92, 0.58);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 0 0 4px rgba(192, 154, 92, 0.12);
    }

    .grade-dropdown {
      position: relative;
    }

    .grade-toggle {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
    }

    .grade-toggle:active {
      transform: translateY(1px);
    }

    .grade-chevron {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.22s ease;
    }

    .grade-dropdown.open .grade-chevron {
      transform: rotate(225deg);
    }

    .grade-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 30;
      max-height: 280px;
      padding: 8px;
      overflow-y: auto;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 22px 55px rgba(42, 32, 20, 0.16);
      display: grid;
      gap: 4px;
      transform-origin: top center;
      animation: gpaMenuIn 0.18s ease both;
    }

    .grade-menu[hidden] {
      display: none;
    }

    .grade-option {
      min-height: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: rgba(23, 23, 23, 0.72);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .grade-option:hover {
      background: rgba(192, 154, 92, 0.12);
      color: #171717;
      transform: translateX(2px);
    }

    .remove-course {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: rgba(192, 154, 92, 0.94);
      font-family: Arial, sans-serif;
      font-size: 0;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        color 0.24s ease,
        opacity 0.2s ease;
    }

    .remove-course::before {
      content: "+";
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
      transform: rotate(45deg);
      transition:
        transform 0.24s ease,
        color 0.24s ease;
    }

    .remove-course::after {
      content: none;
    }

    .remove-course:hover {
      border-color: transparent;
      background: transparent;
      color: #a67c39;
      transform: none;
    }

    .remove-course:active {
      transform: none;
    }

    .remove-course:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .gpa-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .gpa-action {
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(247, 244, 238, 0.7);
      color: #171717;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.22s ease, border-color 0.22s ease, color 0.22s ease, transform 0.22s ease;
    }

    .gpa-action:hover {
      border-color: rgba(192, 154, 92, 0.34);
      background: rgba(255, 255, 255, 0.78);
      transform: translateY(-1px);
    }

    .gpa-action:active {
      transform: translateY(1px);
    }

    .gpa-action:disabled {
      cursor: wait;
      opacity: 0.5;
      transform: none;
    }

    .gpa-action.primary {
      border-color: rgba(192, 154, 92, 0.84);
      background: rgba(192, 154, 92, 0.84);
      color: white;
    }

    .gpa-action.primary:hover:not(:disabled) {
      border-color: rgba(178, 139, 74, 0.94);
      background: rgba(178, 139, 74, 0.94);
    }

    .gpa-save-message {
      min-height: 20px;
      margin-top: 12px;
      color: rgba(23, 23, 23, 0.56);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .gpa-save-message:empty {
      display: none;
    }

    .gpa-save-message.success {
      color: #2f7d53;
    }

    .gpa-save-message.error {
      color: #9d3b3b;
    }

    .gpa-summary {
      position: static;
      top: auto;
      order: -1;
      padding: 26px;
      border-radius: 30px;
      display: grid;
      grid-template-columns: minmax(220px, 0.72fr) minmax(0, 1.28fr);
      grid-template-areas:
        "label items"
        "gpa items";
      column-gap: 32px;
      align-items: center;
    }

    .summary-label {
      grid-area: label;
      align-self: end;
      color: rgba(192, 154, 92, 0.92);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .summary-gpa {
      grid-area: gpa;
      align-self: start;
      margin: 10px 0 0;
      color: #171717;
      font-size: clamp(56px, 7vw, 76px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      transition: color 0.35s ease, text-shadow 0.35s ease;
    }

    .summary-gpa.gpa-good {
      color: #2f8f5b;
      text-shadow: 0 12px 30px rgba(47, 143, 91, 0.14);
    }

    .summary-gpa.gpa-mid {
      color: #c09a5c;
      text-shadow: 0 12px 30px rgba(192, 154, 92, 0.16);
    }

    .summary-gpa.gpa-low {
      color: #c45b4d;
      text-shadow: 0 12px 30px rgba(196, 91, 77, 0.14);
    }

    .summary-items {
      grid-area: items;
      align-self: stretch;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-left: 1px solid rgba(23, 23, 23, 0.08);
    }

    .summary-item {
      min-height: 112px;
      padding: 0 20px;
      display: grid;
      align-content: center;
      justify-content: start;
      gap: 8px;
      border-top: 0;
      color: rgba(23, 23, 23, 0.58);
    }

    .summary-item + .summary-item {
      border-left: 1px solid rgba(23, 23, 23, 0.08);
    }

    .summary-item strong {
      color: rgba(23, 23, 23, 0.5);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .summary-item span {
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: #171717;
      font-size: 22px;
      font-weight: 700;
    }

    .prior-box {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(23, 23, 23, 0.08);
    }

    .prior-box h2 {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 700;
    }

    .prior-inputs {
      display: grid;
      gap: 10px;
    }

    @keyframes gpaFadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes gpaRowIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.99);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes gpaMenuIn {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gpa-header,
      .gpa-panel,
      .gpa-summary,
      .gpa-row,
      .grade-menu {
        animation: none;
      }

      .gpa-row,
      .gpa-row input,
      .prior-inputs input,
      .grade-toggle,
      .grade-chevron,
      .grade-option,
      .remove-course,
      .gpa-action {
        transition: none;
      }
    }

    @media (max-width: 760px) {
      .gpa-header {
        grid-template-columns: 1fr;
      }

      .gpa-header p {
        max-width: 560px;
        margin: 0;
        text-align: left;
      }

      .gpa-summary {
        grid-template-columns: 1fr;
        grid-template-areas:
          "label"
          "gpa"
          "items";
      }

      .summary-items {
        margin-top: 22px;
        border-top: 1px solid rgba(23, 23, 23, 0.08);
        border-left: 0;
      }
    }

    @media (max-width: 640px) {
      .gpa-page {
        padding-top: 96px;
      }

      .gpa-inner {
        width: calc(100% - 24px);
      }

      .gpa-header {
        margin-bottom: 26px;
      }

      .gpa-semester,
      .gpa-summary {
        padding: 18px;
        border-radius: 22px;
      }

      .summary-items {
        grid-template-columns: 1fr;
      }

      .summary-item {
        min-height: 64px;
        padding: 0;
        grid-template-columns: minmax(0, 1fr) auto;
        align-content: initial;
        align-items: center;
        gap: 12px;
      }

      .summary-item + .summary-item {
        border-top: 1px solid rgba(23, 23, 23, 0.08);
        border-left: 0;
      }

      .summary-item span {
        font-size: 18px;
      }

      .gpa-semester-header {
        margin-bottom: 16px;
      }

      .gpa-table-head {
        display: none;
      }

      .gpa-row {
        grid-template-columns: minmax(0, 1fr) 104px 44px;
        grid-template-areas:
          "course course course"
          "credits grade remove";
        gap: 8px;
        padding: 12px 0;
      }

      .course-name {
        grid-area: course;
      }

      .course-credits {
        grid-area: credits;
      }

      .grade-dropdown {
        grid-area: grade;
      }

      .gpa-row > .remove-course {
        grid-area: remove;
      }

      .remove-course {
        width: 44px;
        height: 44px;
      }

      .remove-semester {
        flex: 0 0 44px;
      }

      .grade-menu {
        max-height: min(280px, 45dvh);
      }

      .grade-option {
        min-height: 44px;
      }

      .gpa-action.semester-add-course {
        height: 44px;
        min-height: 44px;
      }

      .gpa-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .gpa-action {
        width: 100%;
        padding: 0 12px;
      }
    }

    @media (max-width: 380px) {
      .gpa-actions {
        grid-template-columns: 1fr;
      }
    }

    /* GPA planner: minimal summary, flat semesters and clear actions */
    .gpa-layout {
      gap: 24px;
    }

    .gpa-summary {
      padding: 14px 0 26px;
      border: 0;
      border-bottom: 1px solid rgba(23, 23, 23, 0.12);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
      grid-template-areas:
        "label items"
        "gpa items";
      column-gap: 12px;
    }

    .summary-label {
      align-self: end;
    }

    .summary-gpa {
      margin-top: 8px;
      font-size: clamp(40px, 4vw, 50px);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .summary-items {
      margin: 0;
      padding: 0;
      border: 0;
      align-self: stretch;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .summary-item {
      min-height: 80px;
      min-width: 0;
      padding: 0;
      border: 0;
      align-content: center;
      gap: 10px;
    }

    .summary-item + .summary-item {
      border: 0;
    }

    .summary-item span {
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .gpa-semesters {
      gap: 0;
    }

    .gpa-semester {
      padding: 12px 0 26px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .gpa-semester + .gpa-semester {
      padding-top: 28px;
      border-top: 1px solid rgba(23, 23, 23, 0.12);
    }

    .gpa-semester-header {
      margin-bottom: 18px;
    }

    .semester-name {
      min-width: 0;
      font-size: 21px;
    }

    .semester-actions {
      gap: 18px;
    }

    .semester-course-count {
      color: rgba(23, 23, 23, 0.48);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .remove-semester,
    .gpa-row > .remove-course {
      color: rgba(23, 23, 23, 0.46);
    }

    .remove-semester:hover,
    .gpa-row > .remove-course:hover {
      color: #a65f4e;
    }

    .gpa-table-head {
      margin-bottom: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(23, 23, 23, 0.09);
    }

    .gpa-row {
      padding: 6px 0;
      border-bottom: 0;
    }

    .gpa-row:first-child {
      padding-top: 0;
    }

    .gpa-row:last-child {
      padding-bottom: 0;
    }

    .gpa-row input,

    .gpa-actions > .gpa-action.secondary::before {

    .gpa-actions > .gpa-action.subtle {

    .gpa-actions > .gpa-action.subtle:hover {

    @media (max-width: 760px) {
      .gpa-summary {
        grid-template-columns: 1fr;
        grid-template-areas:
          "label"
          "gpa"
          "items";
      }

      .summary-items {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid rgba(23, 23, 23, 0.1);

    }

    @media (max-width: 640px) {
      .gpa-summary {
        padding: 10px 0 20px;
        border-radius: 0;
      }

      .summary-items {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 14px;
      }

      .summary-item {
        min-height: 0;

        border: 0;

        gap: 6px;
        align-content: start;
      }

      .summary-item + .summary-item {
        border: 0;
      }

      .gpa-semester {
        padding: 10px 0 24px;
        border-radius: 0;
      }

      .gpa-semester + .gpa-semester {
        padding-top: 24px;
      }

      .gpa-row {

      }

      .semester-actions {

      .semester-course-count {

      }

      .gpa-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .gpa-actions > .gpa-action.subtle {
        width: fit-content;
      }
    }

    @media (max-width: 380px) {
      .gpa-actions {
        grid-template-columns: 1fr;
      }

      .gpa-actions > .gpa-action.subtle {
        width: 100%;
      }

    /* Shared editorial hierarchy from the Courses and Professors pages. */
    .gpa-layout {
      gap: 34px;
    }

    .gpa-panel {
      max-width: 1080px;
    }

    .gpa-section-heading {
      margin-bottom: 22px;

      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      align-items: end;

      max-width: 420px;
      margin: 0;
      color: rgba(23, 23, 23, 0.62);
      font-size: 15px;

    }

    .gpa-summary {
      padding-top: 22px;
      padding-bottom: 30px;
      border-top: 1px solid rgba(23, 23, 23, 0.09);
    }

    .summary-label {
      color: #b48a4f;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.11em;
    }

    .summary-items {
      gap: 24px;
    }

    .summary-item strong {
      color: rgba(23, 23, 23, 0.55);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.09em;
    }

    .gpa-semester {
      padding: 10px 0 28px;
    }

    .gpa-semester-header {
      margin-bottom: 22px;
    }

    .gpa-table-head {
      border-bottom: 0;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .gpa-row {
      padding: 7px 0;
    }

    .gpa-row input,
    .grade-toggle {
      min-height: 50px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.76);
    }

    .gpa-actions {
      padding-top: 4px;
    }

    @media (max-width: 760px) {
      .gpa-header,
      .gpa-section-heading {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;

      .gpa-header {

      .gpa-header p,
      .gpa-section-heading p {

      .gpa-summary {

        padding-bottom: 24px;
      }

      .summary-items {
        gap: 18px 14px;
      }

      .gpa-row {
        padding: 8px 0;
      }
    }
  </style>
</head>

<body>
  <div id="site-header-root"></div>
  <script src="site-header.js"></script>

  <main class="gpa-page">
    <div class="gpa-inner">
      <section class="gpa-header">
        <div>
          <h1>Calculate your GPA.</h1>
        </div>

        <p>
          Add your courses, credits, and grades to calculate your overall GPA across multiple semesters.
        </p>
      </section>

      <section class="gpa-layout" aria-label="GPA calculator">
        <section class="gpa-panel">
          <div class="gpa-section-heading">
            <h2>Your semesters</h2>
            <p>Organize your courses by term. Your GPA updates as you enter grades.</p>
          </div>

          <div class="gpa-semesters" id="gpa-semesters">
            <div class="gpa-loading" role="status" aria-live="polite">
              <span class="gpa-loading-spinner" aria-hidden="true"></span>
              <span>Loading GPA calculator...</span>
            </div>
          </div>

          <div class="gpa-actions">
            <button class="gpa-action primary" type="button" id="save-gpa-plan">Save GPA Plan</button>
            <button class="gpa-action secondary" type="button" id="add-semester">Add Semester</button>
            <button class="gpa-action subtle" type="button" id="reset-courses">Reset</button>
          </div>

          <p
            class="gpa-save-message"
            id="gpa-save-message"
            aria-live="polite"
          ></p>
        </section>

        <aside class="gpa-summary">
          <span class="summary-label">Overall GPA</span>
          <div class="summary-gpa" id="semester-gpa">0.00</div>

          <div class="summary-items">
            <div class="summary-item">
              <strong>Credits</strong>
              <span id="semester-credits">0</span>
            </div>
            <div class="summary-item">
              <strong>Quality Points</strong>
              <span id="quality-points">0.00</span>
            </div>
            <div class="summary-item">
              <strong>Cumulative GPA</strong>
              <span id="cumulative-gpa">0.00</span>
            </div>
          </div>
        </aside>
      </section>
    </div>
  </main>

  <script>
    const semestersRoot = document.getElementById("gpa-semesters");
    const addSemesterButton = document.getElementById("add-semester");
    const saveGpaButton = document.getElementById("save-gpa-plan");
    const resetButton = document.getElementById("reset-courses");
    const gpaSaveMessage = document.getElementById("gpa-save-message");
    const semesterGpaOutput = document.getElementById("semester-gpa");
    const semesterCreditsOutput = document.getElementById("semester-credits");
    const qualityPointsOutput = document.getElementById("quality-points");
    const cumulativeGpaOutput = document.getElementById("cumulative-gpa");

    const grades = [
      ["", "Grade"],
      ["4.0", "A"],
      ["3.7", "A-"],
      ["3.3", "B+"],
      ["3.0", "B"],
      ["2.7", "B-"],
      ["2.3", "C+"],
      ["2.0", "C"],
      ["1.7", "C-"],
      ["1.3", "D+"],
      ["1.0", "D"],
      ["0", "F"]
    ];

    function getGradeLabel(value) {
      const grade = grades.find(function (item) {
        return item[0] === value;
      });

      return grade ? grade[1] : "Grade";
    }

    function prefersReducedMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function animateSummaryNumber(element, nextValue, decimals) {
      const currentValue = Number(element.textContent) || 0;

      if (prefersReducedMotion() || Math.abs(currentValue - nextValue) < 0.01) {
        element.textContent = nextValue.toFixed(decimals);
        return;
      }

      if (element.gpaAnimationFrame) {
        cancelAnimationFrame(element.gpaAnimationFrame);
      }

      const startTime = performance.now();
      const duration = 520;

      function updateFrame(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const easedProgress = 1 - Math.pow(1 - progress, 3);
        const displayedValue = currentValue + (nextValue - currentValue) * easedProgress;

        element.textContent = displayedValue.toFixed(decimals);

        if (progress < 1) {
          element.gpaAnimationFrame = requestAnimationFrame(updateFrame);
        } else {
          element.textContent = nextValue.toFixed(decimals);
        }
      }

      element.gpaAnimationFrame = requestAnimationFrame(updateFrame);
    }

    function updateGpaColor(value, hasGrades) {
      semesterGpaOutput.classList.remove("gpa-good", "gpa-mid", "gpa-low");

      if (!hasGrades) {
        return;
      }

      if (value >= 3.4) {
        semesterGpaOutput.classList.add("gpa-good");
      } else if (value >= 2.3) {
        semesterGpaOutput.classList.add("gpa-mid");
      } else {
        semesterGpaOutput.classList.add("gpa-low");
      }
    }

    function animateCourseRowIn(row, semesterCoursesRoot) {
      if (prefersReducedMotion()) {
        semesterCoursesRoot.appendChild(row);
        calculateGpa();
        return;
      }

      row.classList.add("is-entering");
      row.style.height = "0px";
      row.style.overflow = "hidden";
      semesterCoursesRoot.appendChild(row);

      const rowHeight = row.scrollHeight;

      window.requestAnimationFrame(function () {
        row.style.height = rowHeight + "px";
        row.classList.remove("is-entering");
      });

      row.addEventListener("transitionend", function handleRowIn(event) {
        if (event.propertyName !== "height") {
          return;
        }

        row.style.height = "";
        row.style.overflow = "";
        row.removeEventListener("transitionend", handleRowIn);
      });

      calculateGpa();
    }

    function animateSemesterIn(semester) {
      if (prefersReducedMotion()) {
        semestersRoot.appendChild(semester);
        calculateGpa();
        return;
      }

      semester.classList.add("is-entering");
      semester.style.height = "0px";
      semester.style.overflow = "hidden";
      semestersRoot.appendChild(semester);

      const semesterHeight = semester.scrollHeight;

      window.requestAnimationFrame(function () {
        semester.style.height = semesterHeight + "px";
        semester.classList.remove("is-entering");
      });

      semester.addEventListener("transitionend", function handleSemesterIn(event) {
        if (event.propertyName !== "height") {
          return;
        }

        semester.style.height = "";
        semester.style.overflow = "";
        semester.removeEventListener("transitionend", handleSemesterIn);
      });

      calculateGpa();
    }

    function removeCourseRow(row, semesterCoursesRoot, removeButton) {
      if (row.classList.contains("is-removing")) {
        return;
      }

      removeButton.disabled = true;

      if (prefersReducedMotion()) {
        row.remove();

        if (!semesterCoursesRoot.children.length) {
          createCourseRow(semesterCoursesRoot);
        }

        calculateGpa();
        return;
      }

      row.style.height = row.getBoundingClientRect().height + "px";
      row.style.overflow = "hidden";
      row.offsetHeight;
      row.classList.add("is-removing");
      row.style.height = "0px";

      window.setTimeout(function () {
        row.remove();

        if (!semesterCoursesRoot.children.length) {
          createCourseRow(semesterCoursesRoot);
        }

        calculateGpa();
      }, 340);
    }

    function removeSemesterBlock(semester, removeButton) {
      if (semester.classList.contains("is-removing")) {
        return;
      }

      removeButton.disabled = true;

      if (prefersReducedMotion()) {
        semester.remove();

        if (!semestersRoot.children.length) {
          createSemesterBlock();
        }

        calculateGpa();
        return;
      }

      semester.style.height = semester.getBoundingClientRect().height + "px";
      semester.style.overflow = "hidden";
      semester.offsetHeight;
      semester.classList.add("is-removing");
      semester.style.height = "0px";

      window.setTimeout(function () {
        semester.remove();

        if (!semestersRoot.children.length) {
          createSemesterBlock();
        }

        calculateGpa();
      }, 320);
    }

    function createSemesterBlock(
      semesterName = "",
      savedCourses,
      animateSemester = true
    ) {
      const semester =
        document.createElement("section");

      const semesterNumber =
        semestersRoot.children.length + 1;

      const title =
        semesterName ||
        "Semester " + semesterNumber;

      semester.className =
        "gpa-semester";

      semester.innerHTML = `
        <div class="gpa-semester-header">
          <input class="semester-name" type="text" value="" aria-label="Semester name">
          <div class="semester-actions">
            <span class="semester-course-count">3 courses</span>
            <button class="remove-course remove-semester" type="button" aria-label="Remove semester" title="Remove semester">&times;</button>
          </div>
        </div>

        <div class="gpa-table-head">
          <span>Course</span>
          <span>Credits</span>
          <span>Grade</span>
          <span></span>
        </div>

        <div class="semester-courses"></div>

        <div class="semester-course-footer">
          <button class="gpa-action semester-add-course" type="button" aria-label="Add course" title="Add course">+</button>
        </div>
      `;

      const semesterNameInput =
        semester.querySelector(
          ".semester-name"
        );

      const semesterCoursesRoot =
        semester.querySelector(
          ".semester-courses"
        );

      semesterNameInput.value = title;

      semester
        .querySelector(
          ".semester-add-course"
        )
        .addEventListener(
          "click",
          function () {
            createCourseRow(
              semesterCoursesRoot
            );
          }
        );

      semester
        .querySelector(
          ".remove-semester"
        )
        .addEventListener(
          "click",
          function () {
            removeSemesterBlock(
              semester,
              semester.querySelector(
                ".remove-semester"
              )
            );
          }
        );

      semesterNameInput.addEventListener(
        "input",
        calculateGpa
      );

      const courses =
        Array.isArray(savedCourses) &&
        savedCourses.length
          ? savedCourses
          : [
              {
                name: "",
                credits: "3",
                grade: ""
              },
              {
                name: "",
                credits: "3",
                grade: ""
              },
              {
                name: "",
                credits: "3",
                grade: ""
              }
            ];

      courses.forEach(function (course) {
        createCourseRow(
          semesterCoursesRoot,
          "",
          "3",
          "",
          false
        );

        const row =
          semesterCoursesRoot
            .lastElementChild;

        const courseName =
          row.querySelector(
            ".course-name"
          );

        const courseCredits =
          row.querySelector(
            ".course-credits"
          );

        const courseGrade =
          row.querySelector(
            ".course-grade"
          );

        const gradeLabel =
          row.querySelector(
            ".grade-toggle-label"
          );

        courseName.value =
          String(course.name || "");

        courseCredits.value =
          String(
            course.credits == null
              ? ""
              : course.credits
          );

        courseGrade.value =
          String(course.grade || "");

        gradeLabel.textContent =
          getGradeLabel(
            courseGrade.value
          );
      });

      if (animateSemester) {
        animateSemesterIn(semester);
      } else {
        semestersRoot.appendChild(
          semester
        );

        calculateGpa();
      }
    }

    function createCourseRow(semesterCoursesRoot, courseName = "", credits = "3", grade = "", animateRow = true) {
      const row = document.createElement("div");
      row.className = "gpa-row";

      row.innerHTML = `
        <input class="course-name" type="text" placeholder="Course name" value="${courseName}">
        <input class="course-credits" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Credits" value="${credits}" aria-label="Credits">
        <div class="grade-dropdown">
          <input class="course-grade" type="hidden" value="${grade}">
          <button class="grade-toggle" type="button" aria-label="Grade">
            <span class="grade-toggle-label">${getGradeLabel(grade)}</span>
            <span class="grade-chevron"></span>
          </button>
          <div class="grade-menu" hidden>
            ${grades.map(function (item) {
              return `<button class="grade-option" type="button" data-grade-value="${item[0]}">${item[1]}</button>`;
            }).join("")}
          </div>
        </div>
        <button class="remove-course" type="button" aria-label="Remove course" title="Remove course">&times;</button>
      `;

      const creditsInput = row.querySelector(".course-credits");
      const gradeInput = row.querySelector(".course-grade");
      const gradeDropdown = row.querySelector(".grade-dropdown");
      const gradeToggle = row.querySelector(".grade-toggle");
      const gradeToggleLabel = row.querySelector(".grade-toggle-label");
      const gradeMenu = row.querySelector(".grade-menu");

      creditsInput.addEventListener("input", function () {
        creditsInput.value = creditsInput.value.replace(/[^0-9]/g, "");
        calculateGpa();
      });

      row.querySelector(".course-name").addEventListener("input", calculateGpa);

      gradeToggle.addEventListener("click", function () {
        const isOpen = !gradeMenu.hidden;

        document.querySelectorAll(".grade-menu").forEach(function (menu) {
          menu.hidden = true;
        });

        document.querySelectorAll(".grade-dropdown").forEach(function (dropdown) {
          dropdown.classList.remove("open");
        });

        gradeMenu.hidden = isOpen;
        gradeDropdown.classList.toggle("open", !isOpen);
      });

      row.querySelectorAll(".grade-option").forEach(function (option) {
        option.addEventListener("click", function () {
          gradeInput.value = option.dataset.gradeValue;
          gradeToggleLabel.textContent = option.textContent;
          gradeMenu.hidden = true;
          gradeDropdown.classList.remove("open");
          calculateGpa();
        });
      });

      row.querySelector(".remove-course").addEventListener("click", function () {
        removeCourseRow(row, semesterCoursesRoot, row.querySelector(".remove-course"));
      });

      if (animateRow) {
        animateCourseRowIn(row, semesterCoursesRoot);
      } else {
        semesterCoursesRoot.appendChild(row);
      }
    }

    function calculateGpa() {
      document.querySelectorAll(".gpa-semester").forEach(function (semester) {
        const count = semester.querySelectorAll(".gpa-row:not(.is-removing)").length;
        const courseCount = semester.querySelector(".semester-course-count");

        if (courseCount) {
          courseCount.textContent = count + (count === 1 ? " course" : " courses");
        }
      });

      let totalCredits = 0;
      let totalQualityPoints = 0;

      document.querySelectorAll(".gpa-row").forEach(function (row) {
        const credits = Number(row.querySelector(".course-credits").value || 0);
        const gradeValue = row.querySelector(".course-grade").value;

        if (gradeValue === "") {
          return;
        }

        const grade = Number(gradeValue);
        totalCredits += credits;
        totalQualityPoints += credits * grade;
      });

      const semesterGpa = totalCredits ? totalQualityPoints / totalCredits : 0;
      const cumulativeGpa = semesterGpa;

      updateGpaColor(semesterGpa, totalCredits > 0);
      animateSummaryNumber(semesterGpaOutput, semesterGpa, 2);
      animateSummaryNumber(semesterCreditsOutput, totalCredits, 0);
      animateSummaryNumber(qualityPointsOutput, totalQualityPoints, 2);
      animateSummaryNumber(cumulativeGpaOutput, cumulativeGpa, 2);
    }

    function showGpaSaveMessage(
      message,
      type
    ) {
      gpaSaveMessage.textContent =
        message;

      gpaSaveMessage.className =
        "gpa-save-message" +
        (type ? " " + type : "");
    }

    function getGpaCalculatorState() {
      return {
        semesters: Array.from(
          semestersRoot.querySelectorAll(
            ".gpa-semester"
          )
        ).map(function (semester) {
          return {
            name:
              semester.querySelector(
                ".semester-name"
              ).value.trim(),
            courses: Array.from(
              semester.querySelectorAll(
                ".gpa-row"
              )
            ).map(function (row) {
              return {
                name:
                  row.querySelector(
                    ".course-name"
                  ).value.trim(),
                credits:
                  row.querySelector(
                    ".course-credits"
                  ).value,
                grade:
                  row.querySelector(
                    ".course-grade"
                  ).value
              };
            })
          };
        })
      };
    }

    async function saveGpaCalculator() {
      saveGpaButton.disabled = true;
      saveGpaButton.textContent =
        "Saving...";
      showGpaSaveMessage("", "");

      try {
        const response = await fetch(
          "/api/academic-progress",
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              type: "gpa",
              calculator:
                getGpaCalculatorState()
            })
          }
        );

        const data = await response
          .json()
          .catch(function () {
            return {};
          });

        if (
          response.status === 401 ||
          response.status === 403
        ) {
          try {
            localStorage.setItem(
              "auc-atlas-login-redirect",
              "gpa-calculator.html"
            );
          } catch (error) {}

          window.location.href =
            "login.html";

          return;
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Could not save the GPA plan."
          );
        }

        showGpaSaveMessage(
          "GPA plan saved.",
          "success"
        );
      } catch (error) {
        showGpaSaveMessage(
          error.message ||
          "Could not save the GPA plan.",
          "error"
        );
      } finally {
        saveGpaButton.disabled = false;
        saveGpaButton.textContent =
          "Save GPA Plan";
      }
    }

    async function loadSavedGpaCalculator() {
      try {
        const response = await fetch(
          "/api/academic-progress",
          {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store",
            headers: {
              Accept: "application/json"
            }
          }
        );

        if (
          response.status === 401 ||
          response.status === 403
        ) {
          createSemesterBlock(
            "Semester 1"
          );

          return;
        }

        const data = await response
          .json()
          .catch(function () {
            return {};
          });

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Could not load the saved GPA plan."
          );
        }

        const savedCalculator =
          data.gpaCalculator;

        const savedSemesters =
          savedCalculator &&
          Array.isArray(
            savedCalculator.semesters
          )
            ? savedCalculator.semesters
            : [];

        if (!savedSemesters.length) {
          createSemesterBlock(
            "Semester 1"
          );

          return;
        }

        semestersRoot.innerHTML = "";

        savedSemesters.forEach(
          function (semester) {
            createSemesterBlock(
              semester.name,
              semester.courses,
              false
            );
          }
        );

        calculateGpa();

        showGpaSaveMessage(
          "Saved GPA plan loaded.",
          "success"
        );
      } catch (error) {
        semestersRoot.innerHTML = "";

        createSemesterBlock(
          "Semester 1"
        );

        showGpaSaveMessage(
          error.message ||
          "Could not load the saved GPA plan.",
          "error"
        );
      } finally {
        const loadingState =
          semestersRoot.querySelector(
            ".gpa-loading"
          );

        if (loadingState) {
          loadingState.remove();
        }
      }
    }

    function markGpaPlanUnsaved() {
      showGpaSaveMessage(
        "You have unsaved changes.",
        ""
      );
    }

    document.addEventListener(
      "click",
      function (event) {
        if (
          event.target.closest(
            ".grade-dropdown"
          )
        ) {
          return;
        }

        document
          .querySelectorAll(
            ".grade-menu"
          )
          .forEach(function (menu) {
            menu.hidden = true;
          });

        document
          .querySelectorAll(
            ".grade-dropdown"
          )
          .forEach(
            function (dropdown) {
              dropdown.classList.remove(
                "open"
              );
            }
          );
      }
    );

    semestersRoot.addEventListener(
      "input",
      markGpaPlanUnsaved
    );

    semestersRoot.addEventListener(
      "click",
      function (event) {
        if (
          event.target.closest(
            ".grade-option, .remove-course, .semester-add-course"
          )
        ) {
          window.setTimeout(
            markGpaPlanUnsaved,
            0
          );
        }
      }
    );

    addSemesterButton.addEventListener(
      "click",
      function () {
        createSemesterBlock();
        markGpaPlanUnsaved();
      }
    );

    saveGpaButton.addEventListener(
      "click",
      saveGpaCalculator
    );

    resetButton.addEventListener(
      "click",
      function () {
        semestersRoot.innerHTML = "";

        createSemesterBlock(
          "Semester 1"
        );

        calculateGpa();
        markGpaPlanUnsaved();
      }
    );

    loadSavedGpaCalculator();
  </script>
</body>
</html>
