<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GPA Calculator | AUC Atlas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #171717;
    }

    .gpa-page {
      min-height: 100vh;
      padding: 126px 0 86px;
      background:
        linear-gradient(180deg, rgba(192, 154, 92, 0.14), rgba(247, 244, 238, 0) 360px),
        #f7f4ee;
    }

    .gpa-inner {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .gpa-header {
      margin-bottom: 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 28px;
      align-items: end;
    }

    .gpa-kicker {
      margin-bottom: 16px;
      color: rgba(192, 154, 92, 0.84);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .gpa-header h1 {
      max-width: 650px;
      color: #171717;
      font-size: clamp(34px, 4.8vw, 58px);
      font-weight: 700;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .gpa-header p {
      color: rgba(23, 23, 23, 0.66);
      font-size: 17px;
      line-height: 1.7;
    }

    .gpa-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 22px;
      align-items: start;
    }

    .gpa-panel,
    .gpa-summary {
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 70px rgba(42, 32, 20, 0.1);
    }

    .gpa-panel {
      padding: 18px;
    }

    .gpa-row,
    .gpa-table-head {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) 110px 120px 42px;
      gap: 10px;
      align-items: center;
    }

    .gpa-table-head {
      margin-bottom: 10px;
      padding: 0;
      color: rgba(23, 23, 23, 0.54);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .gpa-table-head span:nth-child(2),
    .gpa-table-head span:nth-child(3) {
      padding-left: 14px;
      text-align: left;
    }

    .gpa-courses {
      display: grid;
      gap: 10px;
    }

    .gpa-row input,
    .prior-inputs input,
    .grade-toggle {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(247, 244, 238, 0.58);
      color: #171717;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .gpa-row input:focus,
    .prior-inputs input:focus,
    .grade-dropdown.open .grade-toggle {
      border-color: rgba(192, 154, 92, 0.58);
      box-shadow: 0 0 0 4px rgba(192, 154, 92, 0.12);
    }

    .grade-dropdown {
      position: relative;
    }

    .grade-toggle {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
    }

    .grade-chevron {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
    }

    .grade-dropdown.open .grade-chevron {
      transform: rotate(225deg);
    }

    .grade-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 30;
      padding: 8px;
      border-radius: 20px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 22px 55px rgba(42, 32, 20, 0.16);
      display: grid;
      gap: 4px;
    }

    .grade-menu[hidden] {
      display: none;
    }

    .grade-option {
      min-height: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: rgba(23, 23, 23, 0.72);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .grade-option:hover {
      background: rgba(192, 154, 92, 0.12);
      color: #171717;
    }

    .remove-course {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(23, 23, 23, 0.06);
      color: rgba(23, 23, 23, 0.62);
      font-family: inherit;
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .remove-course:hover {
      background: rgba(192, 154, 92, 0.16);
      color: #171717;
    }

    .gpa-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .gpa-action {
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(247, 244, 238, 0.7);
      color: #171717;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .gpa-action.primary {
      border-color: rgba(192, 154, 92, 0.84);
      background: rgba(192, 154, 92, 0.84);
      color: white;
    }

    .gpa-summary {
      position: sticky;
      top: 120px;
      padding: 22px;
    }

    .summary-label {
      color: rgba(192, 154, 92, 0.84);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .summary-gpa {
      margin: 12px 0 18px;
      font-size: 58px;
      font-weight: 700;
      line-height: 1;
    }

    .summary-items {
      display: grid;
      gap: 12px;
    }

    .summary-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(23, 23, 23, 0.08);
      color: rgba(23, 23, 23, 0.64);
      font-size: 13px;
      font-weight: 700;
    }

    .summary-item strong {
      color: #171717;
      font-size: 14px;
    }

    .prior-box {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(23, 23, 23, 0.08);
    }

    .prior-box h2 {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 700;
    }

    .prior-inputs {
      display: grid;
      gap: 10px;
    }

    @media (max-width: 900px) {
      .gpa-layout,
      .gpa-header {
        grid-template-columns: 1fr;
      }

      .gpa-summary {
        position: static;
      }
    }

    @media (max-width: 640px) {
      .gpa-page {
        padding-top: 96px;
      }

      .gpa-row,
      .gpa-table-head {
        grid-template-columns: 1fr;
      }

      .gpa-table-head {
        display: none;
      }

      .remove-course {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="site-header-root"></div>
  <script src="site-header.js"></script>

  <main class="gpa-page">
    <div class="gpa-inner">
      <section class="gpa-header">
        <div>
          <p class="gpa-kicker">GPA calculator</p>
          <h1>Plan your semester.</h1>
        </div>

        <p>
          Add your courses, credits, and expected grades to calculate your semester GPA and estimated cumulative GPA.
        </p>
      </section>

      <section class="gpa-layout" aria-label="GPA calculator">
        <section class="gpa-panel">
          <div class="gpa-table-head">
            <span>Course</span>
            <span>Credits</span>
            <span>Grade</span>
            <span></span>
          </div>

          <div class="gpa-courses" id="gpa-courses"></div>

          <div class="gpa-actions">
            <button class="gpa-action primary" type="button" id="add-course">Add Course</button>
            <button class="gpa-action" type="button" id="reset-courses">Reset</button>
          </div>
        </section>

        <aside class="gpa-summary">
          <span class="summary-label">Semester GPA</span>
          <div class="summary-gpa" id="semester-gpa">0.00</div>

          <div class="summary-items">
            <div class="summary-item">
              <strong>Credits</strong>
              <span id="semester-credits">0</span>
            </div>
            <div class="summary-item">
              <strong>Quality Points</strong>
              <span id="quality-points">0.00</span>
            </div>
            <div class="summary-item">
              <strong>Cumulative GPA</strong>
              <span id="cumulative-gpa">0.00</span>
            </div>
          </div>

          <div class="prior-box">
            <h2>Current record</h2>
            <div class="prior-inputs">
              <input id="current-gpa" type="number" min="0" max="4" step="0.01" placeholder="Current GPA">
              <input id="completed-credits" type="number" min="0" step="1" placeholder="Completed credits">
            </div>
          </div>
        </aside>
      </section>
    </div>
  </main>

  <script>
    const coursesRoot = document.getElementById("gpa-courses");
    const addCourseButton = document.getElementById("add-course");
    const resetButton = document.getElementById("reset-courses");
    const semesterGpaOutput = document.getElementById("semester-gpa");
    const semesterCreditsOutput = document.getElementById("semester-credits");
    const qualityPointsOutput = document.getElementById("quality-points");
    const cumulativeGpaOutput = document.getElementById("cumulative-gpa");
    const currentGpaInput = document.getElementById("current-gpa");
    const completedCreditsInput = document.getElementById("completed-credits");

    const grades = [
      ["", "Grade"],
      ["4.0", "A"],
      ["3.7", "A-"],
      ["3.3", "B+"],
      ["3.0", "B"],
      ["2.7", "B-"],
      ["2.3", "C+"],
      ["2.0", "C"],
      ["1.7", "C-"],
      ["1.3", "D+"],
      ["1.0", "D"],
      ["0", "F"]
    ];

    function getGradeLabel(value) {
      const grade = grades.find(function (item) {
        return item[0] === value;
      });

      return grade ? grade[1] : "Grade";
    }

    function createCourseRow(courseName = "", credits = "3", grade = "") {
      const row = document.createElement("div");
      row.className = "gpa-row";

      row.innerHTML = `
        <input class="course-name" type="text" placeholder="Course name" value="${courseName}">
        <input class="course-credits" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Credits" value="${credits}" aria-label="Credits">
        <div class="grade-dropdown">
          <input class="course-grade" type="hidden" value="${grade}">
          <button class="grade-toggle" type="button" aria-label="Grade">
            <span class="grade-toggle-label">${getGradeLabel(grade)}</span>
            <span class="grade-chevron"></span>
          </button>
          <div class="grade-menu" hidden>
            ${grades.map(function (item) {
              return `<button class="grade-option" type="button" data-grade-value="${item[0]}">${item[1]}</button>`;
            }).join("")}
          </div>
        </div>
        <button class="remove-course" type="button" aria-label="Remove course" title="Remove course">&times;</button>
      `;

      const creditsInput = row.querySelector(".course-credits");
      const gradeInput = row.querySelector(".course-grade");
      const gradeDropdown = row.querySelector(".grade-dropdown");
      const gradeToggle = row.querySelector(".grade-toggle");
      const gradeToggleLabel = row.querySelector(".grade-toggle-label");
      const gradeMenu = row.querySelector(".grade-menu");

      creditsInput.addEventListener("input", function () {
        creditsInput.value = creditsInput.value.replace(/[^0-9]/g, "");
        calculateGpa();
      });

      row.querySelector(".course-name").addEventListener("input", calculateGpa);

      gradeToggle.addEventListener("click", function () {
        const isOpen = !gradeMenu.hidden;

        document.querySelectorAll(".grade-menu").forEach(function (menu) {
          menu.hidden = true;
        });

        document.querySelectorAll(".grade-dropdown").forEach(function (dropdown) {
          dropdown.classList.remove("open");
        });

        gradeMenu.hidden = isOpen;
        gradeDropdown.classList.toggle("open", !isOpen);
      });

      row.querySelectorAll(".grade-option").forEach(function (option) {
        option.addEventListener("click", function () {
          gradeInput.value = option.dataset.gradeValue;
          gradeToggleLabel.textContent = option.textContent;
          gradeMenu.hidden = true;
          gradeDropdown.classList.remove("open");
          calculateGpa();
        });
      });

      row.querySelector(".remove-course").addEventListener("click", function () {
        row.remove();

        if (!coursesRoot.children.length) {
          createCourseRow();
        }

        calculateGpa();
      });

      coursesRoot.appendChild(row);
      calculateGpa();
    }

    function calculateGpa() {
      let totalCredits = 0;
      let totalQualityPoints = 0;

      document.querySelectorAll(".gpa-row").forEach(function (row) {
        const credits = Number(row.querySelector(".course-credits").value || 0);
        const gradeValue = row.querySelector(".course-grade").value;

        if (gradeValue === "") {
          return;
        }

        const grade = Number(gradeValue);
        totalCredits += credits;
        totalQualityPoints += credits * grade;
      });

      const semesterGpa = totalCredits ? totalQualityPoints / totalCredits : 0;
      const currentGpa = Number(currentGpaInput.value);
      const completedCredits = Number(completedCreditsInput.value);
      const hasCurrentRecord = currentGpaInput.value !== "" && completedCreditsInput.value !== "";
      const cumulativeGpa = hasCurrentRecord && completedCredits + totalCredits
        ? ((currentGpa * completedCredits) + totalQualityPoints) / (completedCredits + totalCredits)
        : semesterGpa;

      semesterGpaOutput.textContent = semesterGpa.toFixed(2);
      semesterCreditsOutput.textContent = totalCredits;
      qualityPointsOutput.textContent = totalQualityPoints.toFixed(2);
      cumulativeGpaOutput.textContent = cumulativeGpa.toFixed(2);
    }

    document.addEventListener("click", function (event) {
      if (event.target.closest(".grade-dropdown")) {
        return;
      }

      document.querySelectorAll(".grade-menu").forEach(function (menu) {
        menu.hidden = true;
      });

      document.querySelectorAll(".grade-dropdown").forEach(function (dropdown) {
        dropdown.classList.remove("open");
      });
    });

    addCourseButton.addEventListener("click", function () {
      createCourseRow();
    });

    resetButton.addEventListener("click", function () {
      coursesRoot.innerHTML = "";
      currentGpaInput.value = "";
      completedCreditsInput.value = "";
      createCourseRow();
      createCourseRow();
      createCourseRow();
      calculateGpa();
    });

    currentGpaInput.addEventListener("input", calculateGpa);
    completedCreditsInput.addEventListener("input", calculateGpa);

    createCourseRow();
    createCourseRow();
    createCourseRow();
  </script>
</body>
</html>
