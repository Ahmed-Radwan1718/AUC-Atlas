<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GPA Calculator | AUC Atlas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #171717;
    }

    .gpa-page {
      min-height: 100vh;
      padding: 126px 0 86px;
      background:
        linear-gradient(180deg, rgba(192, 154, 92, 0.14), rgba(247, 244, 238, 0) 360px),
        #f7f4ee;
    }

    .gpa-inner {
      width: min(1680px, calc(100% - 32px));
      margin: 0 auto;
    }

    .gpa-header {
      margin-bottom: 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 28px;
      align-items: end;
    }

    .gpa-header h1 {
      max-width: 640px;
      color: #171717;
      font-size: clamp(34px, 4.8vw, 58px);
      font-weight: 700;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .gpa-header p {
      color: rgba(23, 23, 23, 0.66);
      font-size: 17px;
      line-height: 1.7;
    }

    .gpa-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 22px;
      align-items: start;
    }

    .gpa-panel {
      width: min(100%, 820px);
      min-width: 0;
      justify-self: start;
      background: transparent;
    }

    .gpa-summary {
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 70px rgba(42, 32, 20, 0.1);
    }

    .gpa-row,
    .gpa-table-head {
      display: grid;
      grid-template-columns: minmax(280px, 480px) 92px 120px 36px;
      gap: 12px;
      align-items: center;
      justify-content: start;
    }

    .gpa-row {
      position: relative;
      z-index: 1;
      padding: 10px 0;
      border-bottom: 1px solid rgba(23, 23, 23, 0.08);
      transform-origin: center top;
      transition:
        height 0.3s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.28s ease,
        transform 0.28s ease;
      will-change: height, opacity, transform;
    }

    .gpa-row:first-child {
      padding-top: 0;
    }

    .gpa-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .gpa-row:has(.grade-dropdown.open) {
      z-index: 40;
    }

    .gpa-row > .course-name,
    .gpa-row > .course-credits,
    .gpa-row > .grade-dropdown {
      min-width: 0;
      transform-origin: right center;
      transition:
        opacity 0.26s ease,
        transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.26s ease;
    }

    .gpa-row.is-entering {
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      pointer-events: none;
    }

    .gpa-row.is-removing {
      z-index: 1;
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      pointer-events: none;
    }

    .gpa-table-head {
      margin-bottom: 12px;
      padding: 0 4px 10px;
      border-bottom: 1px solid rgba(23, 23, 23, 0.08);
      color: rgba(23, 23, 23, 0.5);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .gpa-table-head span:nth-child(2),
    .gpa-table-head span:nth-child(3) {
      text-align: left;
    }

    .gpa-semesters {
      display: grid;
      gap: 22px;
    }

    .semester-courses {
      display: block;
    }

    .gpa-semester {
      position: relative;
      padding: 22px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 70px rgba(42, 32, 20, 0.1);
      transition:
        height 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.28s ease,
        transform 0.28s ease;
      will-change: height, opacity, transform;
    }

    .gpa-semester:has(.grade-dropdown.open) {
      z-index: 20;
    }

    .gpa-semester.is-entering,
    .gpa-semester.is-removing {
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      pointer-events: none;
    }

    .gpa-semester-header {
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    .semester-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .remove-semester {
      flex: 0 0 36px;
    }

    .semester-course-footer {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(23, 23, 23, 0.08);
      display: flex;
      justify-content: flex-start;
    }

    .gpa-action.semester-add-course {
      width: auto;
      height: 38px;
      min-height: 38px;
      padding: 0 14px;
      border-color: rgba(23, 23, 23, 0.1);
      border-radius: 999px;
      background: rgba(247, 244, 238, 0.74);
      color: rgba(23, 23, 23, 0.68);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1;
      text-transform: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: none;
    }

    .semester-add-course::before {
      content: none;
    }

    .semester-add-course::after {
      content: "Add course";
      position: static;
      width: auto;
      height: auto;
      border-radius: 0;
      background: transparent;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transform: none;
    }

    .gpa-action.semester-add-course:hover {
      border-color: rgba(192, 154, 92, 0.34);
      background: rgba(192, 154, 92, 0.12);
      color: #171717;
    }

    .semester-name {
      width: 100%;
      min-height: 42px;
      padding: 0 2px;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: #171717;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .gpa-row input,
    .prior-inputs input,
    .grade-toggle {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 14px;
      background: rgba(247, 244, 238, 0.74);
      color: #171717;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .course-credits {
      text-align: center;
    }

    .semester-name:hover {
      border-bottom-color: rgba(23, 23, 23, 0.16);
    }

    .gpa-row input:hover,
    .prior-inputs input:hover,
    .grade-toggle:hover {
      border-color: rgba(23, 23, 23, 0.18);
      background: rgba(255, 255, 255, 0.88);
    }

    .semester-name:focus {
      border-bottom-color: rgba(192, 154, 92, 0.84);
    }

    .gpa-row input:focus,
    .prior-inputs input:focus,
    .grade-dropdown.open .grade-toggle {
      border-color: rgba(192, 154, 92, 0.58);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 0 0 4px rgba(192, 154, 92, 0.12);
    }

    .grade-dropdown {
      position: relative;
    }

    .grade-toggle {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
    }

    .grade-toggle:active {
      transform: translateY(1px);
    }

    .grade-chevron {
      width: 8px;
      height: 8px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.22s ease;
    }

    .grade-dropdown.open .grade-chevron {
      transform: rotate(225deg);
    }

    .grade-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 30;
      max-height: 280px;
      padding: 8px;
      overflow-y: auto;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 22px 55px rgba(42, 32, 20, 0.16);
      display: grid;
      gap: 4px;
      transform-origin: top center;
      animation: gpaMenuIn 0.18s ease both;
    }

    .grade-menu[hidden] {
      display: none;
    }

    .grade-option {
      min-height: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: rgba(23, 23, 23, 0.72);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .grade-option:hover {
      background: rgba(192, 154, 92, 0.12);
      color: #171717;
      transform: translateX(2px);
    }

    .remove-course {
      width: 36px;
      height: 36px;
      padding: 0 0 2px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 999px;
      background: transparent;
      color: rgba(23, 23, 23, 0.4);
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        color 0.2s ease,
        transform 0.2s ease,
        opacity 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .remove-course::before,
    .remove-course::after {
      content: none;
    }

    .remove-course:hover {
      border-color: rgba(196, 91, 77, 0.28);
      background: rgba(196, 91, 77, 0.08);
      color: #ad4d42;
      transform: translateY(-1px);
    }

    .remove-course:active {
      transform: translateY(1px) scale(0.96);
    }

    .remove-course:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .gpa-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .gpa-action {
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(247, 244, 238, 0.7);
      color: #171717;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.22s ease, border-color 0.22s ease, color 0.22s ease, transform 0.22s ease;
    }

    .gpa-action:hover {
      border-color: rgba(192, 154, 92, 0.34);
      background: rgba(255, 255, 255, 0.78);
      transform: translateY(-1px);
    }

    .gpa-action:active {
      transform: translateY(1px);
    }

    .gpa-action.primary {
      border-color: rgba(192, 154, 92, 0.84);
      background: rgba(192, 154, 92, 0.84);
      color: white;
    }

    .gpa-action.primary:hover {
      border-color: rgba(178, 139, 74, 0.94);
      background: rgba(178, 139, 74, 0.94);
    }

    .gpa-summary {
      position: sticky;
      top: 120px;
      padding: 24px;
    }

    .summary-label {
      color: rgba(23, 23, 23, 0.5);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .summary-gpa {
      margin: 14px 0 26px;
      color: #171717;
      font-size: clamp(52px, 5vw, 68px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      transition: color 0.35s ease, text-shadow 0.35s ease;
    }

    .summary-gpa.gpa-good {
      color: #2f8f5b;
      text-shadow: 0 12px 30px rgba(47, 143, 91, 0.14);
    }

    .summary-gpa.gpa-mid {
      color: #c09a5c;
      text-shadow: 0 12px 30px rgba(192, 154, 92, 0.16);
    }

    .summary-gpa.gpa-low {
      color: #c45b4d;
      text-shadow: 0 12px 30px rgba(196, 91, 77, 0.14);
    }

    .summary-items {
      display: grid;
    }

    .summary-item {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid rgba(23, 23, 23, 0.08);
      color: rgba(23, 23, 23, 0.58);
      font-size: 12px;
      font-weight: 500;
    }

    .summary-item strong {
      color: #171717;
      font-size: 13px;
      font-weight: 600;
    }

    .summary-item span {
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(247, 244, 238, 0.74);
      color: rgba(23, 23, 23, 0.64);
      font-size: 11px;
      font-weight: 800;
    }

    .prior-box {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(23, 23, 23, 0.08);
    }

    .prior-box h2 {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 700;
    }

    .prior-inputs {
      display: grid;
      gap: 10px;
    }

    @keyframes gpaFadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes gpaRowIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.99);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes gpaMenuIn {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gpa-header,
      .gpa-panel,
      .gpa-summary,
      .gpa-row,
      .grade-menu {
        animation: none;
      }

      .gpa-row,
      .gpa-row input,
      .prior-inputs input,
      .grade-toggle,
      .grade-chevron,
      .grade-option,
      .remove-course,
      .gpa-action {
        transition: none;
      }
    }

    @media (max-width: 1040px) {
      .gpa-layout,
      .gpa-header {
        grid-template-columns: 1fr;
      }

      .gpa-summary {
        position: static;
      }
    }

    @media (max-width: 640px) {
      .gpa-page {
        padding-top: 96px;
      }

      .gpa-inner {
        width: min(100% - 24px, 1680px);
      }

      .gpa-header {
        margin-bottom: 26px;
      }

      .gpa-semester,
      .gpa-summary {
        padding: 18px;
        border-radius: 22px;
      }

      .gpa-semester-header {
        margin-bottom: 16px;
      }

      .gpa-table-head {
        display: none;
      }

      .gpa-row {
        grid-template-columns: minmax(0, 1fr) 104px 44px;
        grid-template-areas:
          "course course course"
          "credits grade remove";
        gap: 8px;
        padding: 12px 0;
      }

      .course-name {
        grid-area: course;
      }

      .course-credits {
        grid-area: credits;
      }

      .grade-dropdown {
        grid-area: grade;
      }

      .gpa-row > .remove-course {
        grid-area: remove;
      }

      .remove-course {
        width: 44px;
        height: 44px;
      }

      .remove-semester {
        flex: 0 0 44px;
      }

      .grade-menu {
        max-height: min(280px, 45dvh);
      }

      .grade-option {
        min-height: 44px;
      }

      .gpa-action.semester-add-course {
        height: 44px;
        min-height: 44px;
      }

      .gpa-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .gpa-action {
        width: 100%;
        padding: 0 12px;
      }
    }

    @media (max-width: 380px) {
      .gpa-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="site-header-root"></div>
  <script src="site-header.js"></script>

  <main class="gpa-page">
    <div class="gpa-inner">
      <section class="gpa-header">
        <div>
          <h1>Calculate your GPA.</h1>
        </div>

        <p>
          Add your courses, credits, and grades to calculate your overall GPA across multiple semesters.
        </p>
      </section>

      <section class="gpa-layout" aria-label="GPA calculator">
        <section class="gpa-panel">
          <div class="gpa-semesters" id="gpa-semesters"></div>

          <div class="gpa-actions">
            <button class="gpa-action primary" type="button" id="add-semester">Add Semester</button>
            <button class="gpa-action" type="button" id="reset-courses">Reset</button>
          </div>
        </section>

        <aside class="gpa-summary">
          <span class="summary-label">Overall GPA</span>
          <div class="summary-gpa" id="semester-gpa">0.00</div>

          <div class="summary-items">
            <div class="summary-item">
              <strong>Credits</strong>
              <span id="semester-credits">0</span>
            </div>
            <div class="summary-item">
              <strong>Quality Points</strong>
              <span id="quality-points">0.00</span>
            </div>
            <div class="summary-item">
              <strong>Cumulative GPA</strong>
              <span id="cumulative-gpa">0.00</span>
            </div>
          </div>
        </aside>
      </section>
    </div>
  </main>

  <script>
    const semestersRoot = document.getElementById("gpa-semesters");
    const addSemesterButton = document.getElementById("add-semester");
    const resetButton = document.getElementById("reset-courses");
    const semesterGpaOutput = document.getElementById("semester-gpa");
    const semesterCreditsOutput = document.getElementById("semester-credits");
    const qualityPointsOutput = document.getElementById("quality-points");
    const cumulativeGpaOutput = document.getElementById("cumulative-gpa");

    const grades = [
      ["", "Grade"],
      ["4.0", "A"],
      ["3.7", "A-"],
      ["3.3", "B+"],
      ["3.0", "B"],
      ["2.7", "B-"],
      ["2.3", "C+"],
      ["2.0", "C"],
      ["1.7", "C-"],
      ["1.3", "D+"],
      ["1.0", "D"],
      ["0", "F"]
    ];

    function getGradeLabel(value) {
      const grade = grades.find(function (item) {
        return item[0] === value;
      });

      return grade ? grade[1] : "Grade";
    }

    function prefersReducedMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function animateSummaryNumber(element, nextValue, decimals) {
      const currentValue = Number(element.textContent) || 0;

      if (prefersReducedMotion() || Math.abs(currentValue - nextValue) < 0.01) {
        element.textContent = nextValue.toFixed(decimals);
        return;
      }

      if (element.gpaAnimationFrame) {
        cancelAnimationFrame(element.gpaAnimationFrame);
      }

      const startTime = performance.now();
      const duration = 520;

      function updateFrame(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const easedProgress = 1 - Math.pow(1 - progress, 3);
        const displayedValue = currentValue + (nextValue - currentValue) * easedProgress;

        element.textContent = displayedValue.toFixed(decimals);

        if (progress < 1) {
          element.gpaAnimationFrame = requestAnimationFrame(updateFrame);
        } else {
          element.textContent = nextValue.toFixed(decimals);
        }
      }

      element.gpaAnimationFrame = requestAnimationFrame(updateFrame);
    }

    function updateGpaColor(value, hasGrades) {
      semesterGpaOutput.classList.remove("gpa-good", "gpa-mid", "gpa-low");

      if (!hasGrades) {
        return;
      }

      if (value >= 3.4) {
        semesterGpaOutput.classList.add("gpa-good");
      } else if (value >= 2.3) {
        semesterGpaOutput.classList.add("gpa-mid");
      } else {
        semesterGpaOutput.classList.add("gpa-low");
      }
    }

    function animateCourseRowIn(row, semesterCoursesRoot) {
      if (prefersReducedMotion()) {
        semesterCoursesRoot.appendChild(row);
        calculateGpa();
        return;
      }

      row.classList.add("is-entering");
      row.style.height = "0px";
      row.style.overflow = "hidden";
      semesterCoursesRoot.appendChild(row);

      const rowHeight = row.scrollHeight;

      window.requestAnimationFrame(function () {
        row.style.height = rowHeight + "px";
        row.classList.remove("is-entering");
      });

      row.addEventListener("transitionend", function handleRowIn(event) {
        if (event.propertyName !== "height") {
          return;
        }

        row.style.height = "";
        row.style.overflow = "";
        row.removeEventListener("transitionend", handleRowIn);
      });

      calculateGpa();
    }

    function animateSemesterIn(semester) {
      if (prefersReducedMotion()) {
        semestersRoot.appendChild(semester);
        calculateGpa();
        return;
      }

      semester.classList.add("is-entering");
      semester.style.height = "0px";
      semester.style.overflow = "hidden";
      semestersRoot.appendChild(semester);

      const semesterHeight = semester.scrollHeight;

      window.requestAnimationFrame(function () {
        semester.style.height = semesterHeight + "px";
        semester.classList.remove("is-entering");
      });

      semester.addEventListener("transitionend", function handleSemesterIn(event) {
        if (event.propertyName !== "height") {
          return;
        }

        semester.style.height = "";
        semester.style.overflow = "";
        semester.removeEventListener("transitionend", handleSemesterIn);
      });

      calculateGpa();
    }

    function removeCourseRow(row, semesterCoursesRoot, removeButton) {
      if (row.classList.contains("is-removing")) {
        return;
      }

      removeButton.disabled = true;

      if (prefersReducedMotion()) {
        row.remove();

        if (!semesterCoursesRoot.children.length) {
          createCourseRow(semesterCoursesRoot);
        }

        calculateGpa();
        return;
      }

      row.style.height = row.getBoundingClientRect().height + "px";
      row.style.overflow = "hidden";
      row.offsetHeight;
      row.classList.add("is-removing");
      row.style.height = "0px";

      window.setTimeout(function () {
        row.remove();

        if (!semesterCoursesRoot.children.length) {
          createCourseRow(semesterCoursesRoot);
        }

        calculateGpa();
      }, 340);
    }

    function removeSemesterBlock(semester, removeButton) {
      if (semester.classList.contains("is-removing")) {
        return;
      }

      removeButton.disabled = true;

      if (prefersReducedMotion()) {
        semester.remove();

        if (!semestersRoot.children.length) {
          createSemesterBlock();
        }

        calculateGpa();
        return;
      }

      semester.style.height = semester.getBoundingClientRect().height + "px";
      semester.style.overflow = "hidden";
      semester.offsetHeight;
      semester.classList.add("is-removing");
      semester.style.height = "0px";

      window.setTimeout(function () {
        semester.remove();

        if (!semestersRoot.children.length) {
          createSemesterBlock();
        }

        calculateGpa();
      }, 320);
    }

    function createSemesterBlock(semesterName = "") {
      const semester = document.createElement("section");
      const semesterNumber = semestersRoot.children.length + 1;
      const title = semesterName || "Semester " + semesterNumber;

      semester.className = "gpa-semester";
      semester.innerHTML = `
        <div class="gpa-semester-header">
          <input class="semester-name" type="text" value="${title}" aria-label="Semester name">
          <div class="semester-actions">
            <button class="remove-course remove-semester" type="button" aria-label="Remove semester" title="Remove semester">&times;</button>
          </div>
        </div>

        <div class="gpa-table-head">
          <span>Course</span>
          <span>Credits</span>
          <span>Grade</span>
          <span></span>
        </div>

        <div class="semester-courses"></div>

        <div class="semester-course-footer">
          <button class="gpa-action semester-add-course" type="button" aria-label="Add course" title="Add course">+</button>
        </div>
      `;

      const semesterCoursesRoot = semester.querySelector(".semester-courses");

      semester.querySelector(".semester-add-course").addEventListener("click", function () {
        createCourseRow(semesterCoursesRoot);
      });

      semester.querySelector(".remove-semester").addEventListener("click", function () {
        removeSemesterBlock(semester, semester.querySelector(".remove-semester"));
      });

      semester.querySelector(".semester-name").addEventListener("input", calculateGpa);

      createCourseRow(semesterCoursesRoot, "", "3", "", false);
      createCourseRow(semesterCoursesRoot, "", "3", "", false);
      createCourseRow(semesterCoursesRoot, "", "3", "", false);
      animateSemesterIn(semester);
    }

    function createCourseRow(semesterCoursesRoot, courseName = "", credits = "3", grade = "", animateRow = true) {
      const row = document.createElement("div");
      row.className = "gpa-row";

      row.innerHTML = `
        <input class="course-name" type="text" placeholder="Course name" value="${courseName}">
        <input class="course-credits" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Credits" value="${credits}" aria-label="Credits">
        <div class="grade-dropdown">
          <input class="course-grade" type="hidden" value="${grade}">
          <button class="grade-toggle" type="button" aria-label="Grade">
            <span class="grade-toggle-label">${getGradeLabel(grade)}</span>
            <span class="grade-chevron"></span>
          </button>
          <div class="grade-menu" hidden>
            ${grades.map(function (item) {
              return `<button class="grade-option" type="button" data-grade-value="${item[0]}">${item[1]}</button>`;
            }).join("")}
          </div>
        </div>
        <button class="remove-course" type="button" aria-label="Remove course" title="Remove course">&times;</button>
      `;

      const creditsInput = row.querySelector(".course-credits");
      const gradeInput = row.querySelector(".course-grade");
      const gradeDropdown = row.querySelector(".grade-dropdown");
      const gradeToggle = row.querySelector(".grade-toggle");
      const gradeToggleLabel = row.querySelector(".grade-toggle-label");
      const gradeMenu = row.querySelector(".grade-menu");

      creditsInput.addEventListener("input", function () {
        creditsInput.value = creditsInput.value.replace(/[^0-9]/g, "");
        calculateGpa();
      });

      row.querySelector(".course-name").addEventListener("input", calculateGpa);

      gradeToggle.addEventListener("click", function () {
        const isOpen = !gradeMenu.hidden;

        document.querySelectorAll(".grade-menu").forEach(function (menu) {
          menu.hidden = true;
        });

        document.querySelectorAll(".grade-dropdown").forEach(function (dropdown) {
          dropdown.classList.remove("open");
        });

        gradeMenu.hidden = isOpen;
        gradeDropdown.classList.toggle("open", !isOpen);
      });

      row.querySelectorAll(".grade-option").forEach(function (option) {
        option.addEventListener("click", function () {
          gradeInput.value = option.dataset.gradeValue;
          gradeToggleLabel.textContent = option.textContent;
          gradeMenu.hidden = true;
          gradeDropdown.classList.remove("open");
          calculateGpa();
        });
      });

      row.querySelector(".remove-course").addEventListener("click", function () {
        removeCourseRow(row, semesterCoursesRoot, row.querySelector(".remove-course"));
      });

      if (animateRow) {
        animateCourseRowIn(row, semesterCoursesRoot);
      } else {
        semesterCoursesRoot.appendChild(row);
      }
    }

    function calculateGpa() {
      let totalCredits = 0;
      let totalQualityPoints = 0;

      document.querySelectorAll(".gpa-row").forEach(function (row) {
        const credits = Number(row.querySelector(".course-credits").value || 0);
        const gradeValue = row.querySelector(".course-grade").value;

        if (gradeValue === "") {
          return;
        }

        const grade = Number(gradeValue);
        totalCredits += credits;
        totalQualityPoints += credits * grade;
      });

      const semesterGpa = totalCredits ? totalQualityPoints / totalCredits : 0;
      const cumulativeGpa = semesterGpa;

      updateGpaColor(semesterGpa, totalCredits > 0);
      animateSummaryNumber(semesterGpaOutput, semesterGpa, 2);
      animateSummaryNumber(semesterCreditsOutput, totalCredits, 0);
      animateSummaryNumber(qualityPointsOutput, totalQualityPoints, 2);
      animateSummaryNumber(cumulativeGpaOutput, cumulativeGpa, 2);
    }

    document.addEventListener("click", function (event) {
      if (event.target.closest(".grade-dropdown")) {
        return;
      }

      document.querySelectorAll(".grade-menu").forEach(function (menu) {
        menu.hidden = true;
      });

      document.querySelectorAll(".grade-dropdown").forEach(function (dropdown) {
        dropdown.classList.remove("open");
      });
    });

    addSemesterButton.addEventListener("click", function () {
      createSemesterBlock();
    });

    resetButton.addEventListener("click", function () {
      semestersRoot.innerHTML = "";
      createSemesterBlock("Semester 1");
      calculateGpa();
    });

    createSemesterBlock("Semester 1");
  </script>
</body>
</html>
