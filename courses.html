<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Courses | AUC Atlas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #171717;
    }

    .courses-page {
      min-height: 100vh;
      padding: 126px 0 86px;
      background:
        linear-gradient(180deg, rgba(192, 154, 92, 0.14), rgba(247, 244, 238, 0) 360px),
        #f7f4ee;
    }

    .courses-inner {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .courses-header {
      margin-bottom: 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 28px;
      align-items: end;
    }

    .courses-kicker {
      margin-bottom: 16px;
      color: rgba(192, 154, 92, 0.84);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .courses-header h1 {
      max-width: 650px;
      color: #171717;
      font-size: clamp(34px, 4.8vw, 58px);
      font-weight: 700;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .courses-header p {
      color: rgba(23, 23, 23, 0.66);
      font-size: 17px;
      line-height: 1.7;
    }

    .courses-browser {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .courses-filters {
      position: sticky;
      top: 120px;
      padding: 14px;
      border-radius: 26px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 22px 55px rgba(42, 32, 20, 0.1);
      display: grid;
      gap: 10px;
    }

    .courses-filters h2 {
      padding: 10px 14px 6px;
      color: rgba(192, 154, 92, 0.84);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .course-filter-list {
      display: grid;
      gap: 6px;
    }

    .course-filter-pill input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .course-filter-pill span {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      color: rgba(23, 23, 23, 0.62);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .course-filter-pill:hover span,
    .course-filter-pill:has(input:checked) span {
      background: rgba(192, 154, 92, 0.12);
      color: #171717;
    }

    .courses-search-box {
      margin-bottom: 18px;
    }

    .courses-search-box input {
      width: 100%;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(255, 255, 255, 0.78);
      color: #171717;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      outline: none;
    }

    .courses-search-box input:focus {
      border-color: rgba(192, 154, 92, 0.58);
      box-shadow: 0 0 0 4px rgba(192, 154, 92, 0.12);
    }

    .courses-result-count {
      margin-bottom: 18px;
      color: rgba(23, 23, 23, 0.58);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .course-card,
    .courses-empty {
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 70px rgba(42, 32, 20, 0.1);
    }

    .course-card {
      min-height: 190px;
      padding: 22px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease;
    }

    .course-card:hover {
      border-color: rgba(192, 154, 92, 0.32);
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-2px);
    }

    .course-code {
      margin-bottom: 14px;
      color: rgba(192, 154, 92, 0.92);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
    }

    .course-card h2 {
      color: #171717;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.18;
    }

    .course-card-meta {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .course-card-meta span {
      padding: 7px 9px;
      border-radius: 999px;
      border: 1px solid rgba(23, 23, 23, 0.08);
      background: rgba(247, 244, 238, 0.74);
      color: rgba(23, 23, 23, 0.62);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .courses-empty {
      grid-column: 1 / -1;
      padding: 28px;
      border-radius: 24px;
      color: rgba(23, 23, 23, 0.62);
      font-size: 15px;
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .courses-header,
      .courses-browser {
        grid-template-columns: 1fr;
      }

      .courses-filters {
        position: static;
      }

      .courses-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .courses-page {
        padding-top: 96px;
      }

      .courses-grid {
        grid-template-columns: 1fr;
      }

      .course-card {
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>
  <div id="site-header-root"></div>
  <script src="site-header.js"></script>

  <main class="courses-page">
    <div class="courses-inner">
      <section class="courses-header">
        <div>
          <p class="courses-kicker">Course atlas</p>
          <h1>Browse AUC courses.</h1>
        </div>

        <p>
          Search courses by code, title, subject, or department.
        </p>
      </section>

      <section class="courses-browser" aria-label="Course filters and results">
        <aside class="courses-filters">
          <h2>Subjects</h2>
          <div class="course-filter-list" id="course-subject-filters"></div>
        </aside>

        <section class="courses-results">
          <div class="courses-search-box">
            <input id="course-search-input" type="search" placeholder="Search courses..." aria-label="Search courses">
          </div>

          <div class="courses-result-count" id="courses-result-count">0 courses</div>
          <section class="courses-grid" id="courses-grid" aria-label="Course list"></section>
        </section>
      </section>
    </div>
  </main>

  <script src="data/courses.js"></script>
</body>
</html>
