<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses | AUC Atlas</title>
  <meta name="description" content="Browse AUC Atlas courses by department, code, recorded professor context, and materials." />
  <link rel="stylesheet" href="style.css" />

  <style>
    .courses-page {
      padding: 128px 0 90px;
    }

    .courses-hero {
      margin-bottom: 42px;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(320px, 0.45fr);
      gap: 34px;
      align-items: end;
    }

    .courses-hero h1 {
      margin: 0;
      max-width: 660px;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      line-height: 1.12;
      text-transform: uppercase;
    }

    .courses-hero > p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .courses-toolbar {
      max-width: 720px;
      margin-bottom: 24px;
      display: block;
    }

    .course-search {
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      display: grid;
      gap: 9px;
    }

    .course-search span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .course-search input {
      width: 100%;
      min-height: 48px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink);
      outline: 0;
    }

    .course-search input:focus {
      border-color: var(--gold);
      background: var(--surface);
    }

    .courses-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 26px;
      align-items: start;
    }

    .course-filter-panel {
      position: sticky;
      top: 120px;
      align-self: start;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 14px;
      border-radius: 26px;
      border: 1px solid rgba(29, 31, 31, 0.08);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 22px 55px rgba(29, 31, 31, 0.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: grid;
      gap: 8px;
      scrollbar-color: rgba(192, 154, 92, 0.58) rgba(255, 255, 255, 0.72);
      scrollbar-width: thin;
    }

    .course-filter-heading {
      margin: 0;
      padding: 10px 14px 6px;
      color: rgba(192, 154, 92, 0.84);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .filter-item {
      border: 0;
    }

    .filter-item:last-child {
      border-bottom: 0;
    }

    .filter-toggle {
      width: 100%;
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(29, 31, 31, 0.62);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.2;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .filter-toggle:hover,
    .filter-item.open .filter-toggle {
      background: rgba(192, 154, 92, 0.1);
      color: rgba(192, 154, 92, 0.92);
    }

    .chevron {
      width: 9px;
      height: 9px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.2s ease;
      flex-shrink: 0;
      margin-right: 4px;
      font-size: 0;
    }

    .filter-content {
      display: grid;
      gap: 8px;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px);
      padding: 0 8px;
      transition: max-height 0.42s ease, opacity 0.28s ease, padding 0.42s ease;
    }

    .filter-item.open .filter-content {
      max-height: 560px;
      opacity: 1;
      transform: translateY(0);
      overflow-y: auto;
      padding: 10px 8px 12px;
      scrollbar-color: rgba(192, 154, 92, 0.5) transparent;
      scrollbar-width: thin;
    }

    .filter-item.open .chevron {
      transform: rotate(225deg);
    }

    .filter-content label {
      position: relative;
      min-height: 40px;
      margin: 0;
      padding: 0 12px 0 22px;
      border-radius: 14px;
      color: rgba(29, 31, 31, 0.62);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      transition: color 0.24s ease, background 0.24s ease, transform 0.24s ease;
    }

    .filter-content label::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      border-radius: 999px;
      background: rgba(192, 154, 92, 0.92);
      opacity: 0;
      transform: scaleY(0.35);
      transform-origin: center;
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    .filter-content input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .filter-content label:hover {
      color: var(--ink);
      background: rgba(29, 31, 31, 0.045);
    }

    .filter-content label:has(input:checked) {
      color: rgba(192, 154, 92, 0.92);
      background: rgba(192, 154, 92, 0.1);
      transform: translateX(2px);
    }

    .filter-content label:has(input:checked)::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .courses-list-panel {
      min-width: 0;
    }

    .courses-list-heading {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .courses-list-heading span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .courses-page.detail-mode .courses-hero,
    .courses-page.detail-mode .courses-toolbar,
    .courses-page.detail-mode .courses-layout {
      display: none;
    }

    .course-detail-view[hidden] {
      display: none;
    }

    .atlas-course-card,
    .atlas-course-card:visited {
      width: 100%;
      min-height: 282px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      text-align: left;
      text-decoration: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .atlas-course-card:hover,
    .atlas-course-card.active {
      border-color: var(--gold);
      box-shadow: 0 18px 48px rgba(29, 31, 31, 0.1);
      transform: translateY(-3px);
    }

    .atlas-course-card.active {
      background: var(--surface);
    }

    .course-card-visual {
      min-height: 132px;
      padding: 18px;
      background:
        linear-gradient(145deg, rgba(139, 30, 63, 0.92), rgba(29, 31, 31, 0.96));
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .course-card-visual span {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .course-card-visual strong {
      font-size: clamp(1.55rem, 2.4vw, 2.2rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .course-card-body {
      padding: 18px;
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    .course-card-body h2 {
      margin: 0 0 10px;
      font-size: 19px;
      line-height: 1.16;
    }

    .course-card-body p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.55;
    }

    .course-card-meta {
      margin-top: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .course-card-meta span,
    .course-detail-stat span,
    .course-material-request {
      padding: 7px 9px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 900;
    }

    .course-detail-panel {
      position: sticky;
      top: 106px;
      min-width: 0;
    }

    .course-detail-shell {
      border-top: 1px solid var(--line-strong);
      padding-top: 22px;
      display: grid;
      gap: 18px;
    }

    .course-detail-header {
      display: grid;
      gap: 14px;
    }

    .course-detail-header-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: start;
    }

    .course-detail-header h2 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.04;
      text-transform: uppercase;
    }

    .course-detail-code {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .course-detail-summary {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .course-detail-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .course-detail-stat {
      min-height: 78px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      display: grid;
      align-content: center;
      gap: 7px;
    }

    .course-detail-stat strong {
      color: var(--ink);
      font-size: 18px;
      line-height: 1.2;
    }

    .course-detail-section {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .course-detail-section h3 {
      margin: 0 0 6px;
      font-size: 18px;
      text-transform: uppercase;
    }

    .course-detail-note,
    .course-section-label {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .course-section-label {
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .course-professor-list,
    .course-material-list {
      display: grid;
      gap: 10px;
    }

    .course-professor-row,
    .course-material-row {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .course-professor-row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .course-professor-avatar {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      overflow: hidden;
    }

    .course-professor-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .course-professor-meta h4,
    .course-material-row h4 {
      margin: 0 0 6px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.22;
    }

    .course-professor-meta p,
    .course-material-row p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .course-professor-link,
    .course-professor-link:visited {
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .course-professor-link:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .course-professor-action,
    .course-professor-action:visited,
    .course-review-action,
    .course-review-submit {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: white;
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .course-review-action:disabled,
    .course-review-submit:disabled {
      cursor: not-allowed;
      opacity: 0.54;
    }

    .course-review-section-header {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
    }

    .course-review-summary-grid,
    .course-review-professor-grid,
    .course-review-filters,
    .course-review-form-grid {
      display: grid;
      gap: 10px;
    }

    .course-review-summary-grid {
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      margin-bottom: 16px;
    }

    .course-review-summary-card,
    .course-review-professor-card,
    .course-review-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .course-review-summary-card {
      display: grid;
      gap: 7px;
      align-content: center;
    }

    .course-review-summary-card span,
    .course-review-filter,
    .course-review-form label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .course-review-summary-card strong {
      color: var(--ink);
      font-size: 18px;
      line-height: 1.2;
    }

    .course-review-professor-grid {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-bottom: 16px;
    }

    .course-review-professor-card,
    .course-review-professor-card:visited {
      color: inherit;
      text-decoration: none;
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .course-review-professor-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .course-review-professor-photo {
      width: 52px;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      overflow: hidden;
    }

    .course-review-professor-photo img,
    .course-review-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .course-review-professor-card h4,
    .course-review-card h4 {
      margin: 0 0 6px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.2;
    }

    .course-review-professor-card p,
    .course-review-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .course-review-filters {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin: 16px 0;
    }

    .course-review-filter {
      display: grid;
      gap: 6px;
    }

    .course-review-list {
      display: grid;
      gap: 12px;
    }

    .course-review-card-header {
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .course-review-avatar {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--ink);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font-weight: 900;
    }

    .course-review-tags {
      margin: 0 0 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .course-review-tags span,
    .course-review-legacy-tag {
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 900;
    }

    .course-review-legacy-tag {
      background: var(--surface);
      color: var(--muted);
    }

    .course-review-modal[hidden] {
      display: none;
    }

    .course-review-modal {
      position: fixed;
      inset: 0;
      z-index: 220;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .course-review-modal-backdrop {
      position: absolute;
      inset: 0;
      border: 0;
      background: rgba(29, 31, 31, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .course-review-modal-card {
      position: relative;
      z-index: 1;
      width: min(540px, 100%);
      max-height: min(760px, calc(100vh - 48px));
      overflow: auto;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .course-review-modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }

    .course-review-form {
      display: grid;
      gap: 12px;
    }

    .course-review-form-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .course-review-form label {
      display: grid;
      gap: 7px;
    }

    .course-review-form textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-soft);
      color: var(--ink);
      font: inherit;
      resize: vertical;
      outline: 0;
    }

    .course-review-custom-dropdown {
      position: relative;
      width: 100%;
    }

    .course-review-custom-dropdown .custom-select-trigger {
      width: 100%;
      min-height: 54px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-soft);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      text-align: left;
    }

    .course-review-custom-dropdown.invalid .custom-select-trigger {
      border-color: rgba(192, 154, 92, 0.72);
    }

    .course-review-custom-dropdown .custom-select-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 10px);
      z-index: 80;
      max-height: 260px;
      overflow-y: auto;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 22px 55px rgba(29, 31, 31, 0.13);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.24s ease, transform 0.24s ease, visibility 0.24s ease;
    }

    .course-review-custom-dropdown.open .custom-select-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .course-review-custom-dropdown .custom-select-option {
      position: relative;
      width: 100%;
      margin-bottom: 6px;
      padding: 12px 14px 12px 24px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: rgba(29, 31, 31, 0.62);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      text-align: left;
      cursor: pointer;
    }

    .course-review-custom-dropdown .custom-select-option.active,
    .course-review-custom-dropdown .custom-select-option:hover {
      color: var(--ink);
      background: rgba(192, 154, 92, 0.14);
    }

    .course-review-form-message {
      min-height: 20px;
      margin: 0;
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }

    .course-empty-state {
      padding: 18px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      line-height: 1.6;
    }

    .material-request-list {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .site-footer {
      margin-top: 0;
    }

    @media (max-width: 1080px) {
      .courses-layout {
        grid-template-columns: 1fr;
      }

      .course-filter-panel,
      .course-detail-panel {
        position: static;
      }

      .course-filter-panel {
        max-height: 360px;
      }

      .courses-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .courses-hero,
      .course-detail-stats {
        grid-template-columns: 1fr;
      }

      .courses-page {
        padding-top: 112px;
      }

      .courses-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .course-detail-header-top,
      .course-professor-row,
      .course-review-section-header,
      .course-review-filters,
      .course-review-form-grid {
        display: grid;
        grid-template-columns: 1fr;
      }

      .course-professor-action {

    <script>

        ["MENG 4239", "Advanced Manufacturing Processes"], ["MENG 4440", "Engineering Operations Research"], ["MENG 4441", "Decision Support in Engineering Systems"], ["MENG 4442", "Reliability Engineering and Risk Analysis"],
        ["MENG 4443", "Systems Simulation"], ["MENG 4444", "Work Analysis and Design"], ["MENG 4445", "Production and Inventory Control"], ["MENG 4448", "Facilities Planning"],
        ["MENG 4449", "Maintenance Management Systems"], ["MENG 4477", "Manufacturing System Automation"], ["MENG 4507", "Mechanical Design II"], ["MENG 4551", "Design for Additive Manufacturing"],
        ["MENG 4553", "Finite Element Method and Applications in Design"], ["MENG 4555", "Applied Vibration Measurements, Analysis and Control"], ["MENG 4558", "Integrated Design"], ["MENG 4565", "Design of Engineering Systems"],
        ["MENG 4606", "Heat Transfer"], ["MENG 4661", "Turbo-Machinery"], ["MENG 4662", "Power Plant Technology"], ["MENG 4663", "Design of Renewable Energy Systems"],
        ["MENG 4665", "Internal Combustion Engines"], ["MENG 4666", "Design of Heating, Ventilation, and Air Conditioning Systems"], ["MENG 4667", "Refrigeration and Air-conditioning"], ["MENG 4756", "Automatic Control Systems"],
        ["MENG 4757", "Robotics: Design, Analysis and Control"], ["MENG 4778", "Microcontrollers and Mechatronics Systems"], ["MENG 4779", "Integrated Design of Electromechanical Systems"], ["MENG 4930", "Selected Topics in Industrial Engineering"],
        ["MENG 4931", "Selected Topics in Design"], ["MENG 4932", "Selected Topics in Materials and Manufacturing"], ["MENG 4936", "Selected Topics in Power Engineering"], ["MENG 4937", "Selected Topics in Mechatronics"],
        ["MENG 4950", "Industrial Training"], ["MENG 4980", "Senior Project I"], ["MENG 4981", "Senior Project II"], ["MENG 5168", "Nuclear Power Plant Engineering"],
        ["PHYS 1011", "Physics 1: Classical Mechanics, Sound and Heat"], ["PHYS 1012", "General Physics Laboratory I"], ["PHYS 1021", "Physics 2: Electricity and Magnetism"], ["PHYS 1022", "General Physics Laboratory II"],
        ["PHYS 2216", "Fundamentals of Circuits and Electronics"], ["PHYS 2217", "Fundamentals of Circuits and Electronics Lab"]
      ];

      function getCoursePageDepartment(code) {
        const subject = code.split(" ")[0];

        return {
          BADM: "Business",
          CHEM: "Chemistry",
          CSCE: "Computer Science",
          ECON: "Economics",
          ENGR: "Engineering",
          ENTR: "Entrepreneurship",
          MACT: "Mathematics",
          MENG: "Mechanical Engineering",
          PHYS: "Physics",
          RHET: "Rhetoric"
        }[subject] || "Course";
      }

      const courseDetailsByCode = window.AUC_ATLAS_COURSE_DETAILS || {};
      const professorDirectory = window.AUC_ATLAS_PROFESSORS || [];
      const professorsById = Object.create(null);
      const reviewSemesterOptions = [
        { value: "fall-2024", label: "Fall 2024" },
        { value: "spring-2025", label: "Spring 2025" },
        { value: "summer-2025", label: "Summer 2025" },
        { value: "fall-2025", label: "Fall 2025" },
        { value: "spring-2026", label: "Spring 2026" },
        { value: "summer-2026", label: "Summer 2026" },
        { value: "fall-2026", label: "Fall 2026" },
        { value: "spring-2027", label: "Spring 2027" },
        { value: "summer-2027", label: "Summer 2027" }
      ];
      const courseReviewsByCode = Object.create(null);
      const courseReviewStatusByCode = Object.create(null);
      const courseReviewErrorByCode = Object.create(null);
      const courseReviewFiltersByCode = Object.create(null);

      professorDirectory.forEach(function (professor) {
        professorsById[professor.id] = professor;
      });

      function getCourseLevel(code) {
        const courseNumber = String(code || "").split(" ")[1] || "";
        const firstDigit = courseNumber.charAt(0);

        return firstDigit ? firstDigit + "000 Level" : "Level pending";
      }

      const courseRecords = coursesPageCourses.map(function (courseItem) {
        const code = courseItem[0];
        const title = courseItem[1];
        const department = getCoursePageDepartment(code);
        const details = courseDetailsByCode[code] || {};
        const level = getCourseLevel(code);

        return Object.assign({
          code,
          title,
          department,
          level,
          summary: title + " in the " + department + " catalogue.",
          professors: [],
          materials: [],
          materialRequests: []
        }, details, {
          code,
          title,
          department: details.department || department,
          level: details.level || level
        });
      });

      const coursesPage = document.querySelector(".courses-page");
      const coursesGrid = document.getElementById("coursesGrid");
      const coursesCount = document.getElementById("coursesCount");
      const courseSearch = document.getElementById("courseSearch");
      const departmentFilter = document.getElementById("courseDepartmentFilter");
      const courseLevelFilter = document.getElementById("courseLevelFilter");
      const courseDetailView = document.getElementById("courseDetailView");

      const state = {
        query: "",
        departments: [],
        levels: [],
        selectedCourseCode: ""
      };

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[character];
        });
      }

      function getInitialCourseCode() {
        const requestedCourse = new URLSearchParams(window.location.search).get("course");
        const course = getCourseByCode(requestedCourse);

        return course ? course.code : "";
      }

      function getCourseByCode(code) {
        const requestedKey = normalizeCourseKey(code);

        if (!requestedKey) {
          return null;
        }

        return courseRecords.find(function (course) {
          return normalizeCourseKey(course.code) === requestedKey;
        }) || null;
      }

      function normalizeCourseKey(value) {
        return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      function getShareableCourseCode(course) {
        return normalizeCourseKey(course.code).toUpperCase();
      }

      function getCourseUrl(course) {
        return "courses.html?course=" + encodeURIComponent(getShareableCourseCode(course));
      }

      function formatCount(count, label) {
        return count + " " + label + (count === 1 ? "" : "s");
      }

      function getCourseProfessors(course) {
        return (Array.isArray(course.professors) ? course.professors : []).map(function (entry) {
          const professorEntry = typeof entry === "string" ? { id: entry } : entry || {};
          const directoryProfessor = professorsById[professorEntry.id] || {};

          return Object.assign({}, directoryProfessor, professorEntry, {
            id: professorEntry.id || directoryProfessor.id || "",
            name: professorEntry.name || directoryProfessor.name || "Professor profile",
            image: professorEntry.image || directoryProfessor.image || "user.png",
            department: professorEntry.department || directoryProfessor.department || course.department
          });
        }).filter(function (professor) {
          return professor.id || professor.name;
        });
      }

      function getCourseStats(course) {
        return {
          professorCount: getCourseProfessors(course).length,
          materialCount: Array.isArray(course.materials) ? course.materials.length : 0
        };
      }

      function getDepartments() {
        const departments = courseRecords.map(function (course) {
          return course.department;
        }).filter(Boolean);

        return ["All"].concat(Array.from(new Set(departments)).sort(function (a, b) {
          return a.localeCompare(b);
        }));
      }

      function courseMatchesSearch(course) {
        const query = state.query.trim().toLowerCase();

        if (!query) {
          return true;
        }

        const professorNames = getCourseProfessors(course).map(function (professor) {
          return professor.name;
        }).join(" ");

        const materialNames = (course.materials || []).map(function (material) {
          return material.title;
        }).join(" ");

        const requestedMaterials = (course.materialRequests || []).join(" ");

        return [
          course.code,
          course.title,
          course.department,
          course.summary,
          professorNames,
          materialNames,
          requestedMaterials
        ].join(" ").toLowerCase().includes(query);
      }

      function getCourseLevels() {
        return Array.from(new Set(courseRecords.map(function (course) {
          return course.level;
        }).filter(Boolean))).sort(function (a, b) {
          return a.localeCompare(b);
        });
      }

      function getFilteredCourses() {
        return courseRecords.filter(function (course) {
          const matchesDepartment = !state.departments.length || state.departments.includes(course.department);
          const matchesLevel = !state.levels.length || state.levels.includes(course.level);

          return matchesDepartment && matchesLevel && courseMatchesSearch(course);
        });
      }

      function renderFilterCheckboxes(container, values, selectedValues, onChange) {
        container.innerHTML = values.map(function (value) {
          return `
            <label>
              <input type="checkbox" value="${escapeHtml(value)}"${selectedValues.includes(value) ? " checked" : ""}>
              ${escapeHtml(value)}
            </label>
          `;
        }).join("");

        container.querySelectorAll("input[type='checkbox']").forEach(function (checkbox) {
          checkbox.addEventListener("change", function () {
            onChange(checkbox.value, checkbox.checked);
            render();
          });
        });
      }

      function renderDepartmentFilters() {
        renderFilterCheckboxes(departmentFilter, getDepartments().filter(function (department) {
          return department !== "All";
        }), state.departments, function (department, checked) {
          state.departments = checked
            ? state.departments.concat(department)
            : state.departments.filter(function (item) {
                return item !== department;
              });
        });
      }

      function renderCourseLevelFilters() {
        renderFilterCheckboxes(courseLevelFilter, getCourseLevels(), state.levels, function (level, checked) {
          state.levels = checked
            ? state.levels.concat(level)
            : state.levels.filter(function (item) {
                return item !== level;
              });
        });
      }

      function renderCourses(filteredCourses) {
        coursesCount.textContent = formatCount(filteredCourses.length, "course");

        if (!filteredCourses.length) {
          coursesGrid.innerHTML = '<div class="course-empty-state">No courses match this search yet.</div>';
          return;
        }

        coursesGrid.innerHTML = filteredCourses.map(function (course) {
          const stats = getCourseStats(course);

          return `
            <a class="atlas-course-card" href="${escapeHtml(getCourseUrl(course))}" data-course-code="${escapeHtml(course.code)}">
              <div class="course-card-visual">
                <span>${escapeHtml(course.department)}</span>
                <strong>${escapeHtml(course.code)}</strong>
              </div>

              <div class="course-card-body">
                <h2>${escapeHtml(course.title)}</h2>
                <p>${escapeHtml(course.summary)}</p>

                <div class="course-card-meta">
                  <span>${escapeHtml(course.level)}</span>
                  <span>${escapeHtml(formatCount(stats.professorCount, "professor"))}</span>
                  <span>${escapeHtml(formatCount(stats.materialCount, "material"))}</span>
                </div>
              </div>
            </a>
          `;
        }).join("");
      }

      function getMaterialTerm(material) {
        return material.semester || material.term || material.semesterLabel || "";
      }

      function getMaterialUploader(material) {
        if (!material.uploader) {
          return material.uploaderName || "";
        }

        if (typeof material.uploader === "string") {
          return material.uploader;
        }

        return material.uploader.name || material.uploader.displayName || "";
      }

      function renderProfessorRows(course) {
        const professors = getCourseProfessors(course);

        if (!professors.length) {
          return '<div class="course-empty-state">No recorded professors are linked to this course yet.</div>';
        }

        return `<div class="course-professor-list">` + professors.map(function (professor) {
          const note = professor.courseNote ? `<p>${escapeHtml(professor.courseNote)}</p>` : "";

          return `
            <a class="course-professor-row course-professor-link" href="professors.html?professor=${encodeURIComponent(professor.id)}">
              <div class="course-professor-avatar">
                <img src="${escapeHtml(professor.image || "user.png")}" alt="${escapeHtml(professor.name)}">
              </div>

              <div class="course-professor-meta">
                <h4>${escapeHtml(professor.name)}</h4>
                <p>${escapeHtml(professor.department || "Department unavailable")}</p>
                ${note}
              </div>

              <span class="course-professor-action">Open Profile</span>
            </a>
          `;
        }).join("") + `</div>`;
      }

      function renderMaterialRows(course) {
        const materials = Array.isArray(course.materials) ? course.materials : [];

        if (!materials.length) {
          return '<div class="course-empty-state">No materials are attached to this course yet.</div>';
        }

        return `<div class="course-material-list">` + materials.map(function (material) {
          const metadata = [
            material.type,
            getMaterialTerm(material),
            getMaterialUploader(material)
          ].filter(Boolean).join(" - ");

          return `
            <article class="course-material-row">
              <h4>${escapeHtml(material.title || "Untitled material")}</h4>
              <p>${escapeHtml(metadata || "Material metadata unavailable")}</p>
            </article>
          `;
        }).join("") + `</div>`;
      }

      function getCourseLabel(course) {
        return [course.code, course.title].filter(Boolean).join(" - ");
      }

      function getCourseReviewKey(course) {
        return normalizeCourseKey(course && course.code);
      }

      function getSemesterOption(value) {
        const normalizedValue = String(value || "").trim().toLowerCase();

        return reviewSemesterOptions.find(function (semester) {
          return semester.value === normalizedValue || semester.label.toLowerCase() === normalizedValue;
        }) || null;
      }

      function getReviewRating(review, key) {
        const rating = Number(review && review[key]);

        return Number.isFinite(rating) && rating >= 1 && rating <= 5 ? rating : null;
      }

      function getAverageReviewMetric(reviews, key) {
        const ratings = reviews.map(function (review) {
          return getReviewRating(review, key);
        }).filter(function (rating) {
          return rating !== null;
        });

        if (!ratings.length) {
          return null;
        }

        return ratings.reduce(function (sum, rating) {
          return sum + rating;
        }, 0) / ratings.length;
      }

      function formatAverageReviewMetric(reviews, key) {
        const average = getAverageReviewMetric(reviews, key);
        return average === null ? "No data" : average.toFixed(1) + " / 5";
      }

      function formatWouldTakeAgain(reviews) {
        const responses = reviews.map(function (review) {
          return String(review.takeAgain || "").trim().toLowerCase();
        }).filter(function (value) {
          return value === "yes" || value === "no";
        });

        if (!responses.length) {
          return "Not enough data";
        }

        const yesCount = responses.filter(function (value) {
          return value === "yes";
        }).length;

        return Math.round((yesCount / responses.length) * 100) + "%";
      }

      function getReviewCourseLabel(review) {
        if (review.courseCode) {
          return [review.courseCode, review.courseTitle].filter(Boolean).join(" - ");
        }

        return String(review.course || "").trim();
      }

      function getReviewSemesterLabel(review) {
        return String(review.semesterLabel || review.term || "").trim();
      }

      function getReviewProfessor(review) {
        return professorsById[review.professorId] || {
          id: review.professorId || "",
          name: review.professorName || "Professor",
          image: "user.png",
          department: ""
        };
      }

      function getReviewDateLabel(value) {
        const date = new Date(value || "");

        if (Number.isNaN(date.getTime())) {
          return "";
        }

        return date.toLocaleDateString("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric"
        });
      }

      function legacyCourseMatchesExactly(reviewCourseText, course) {
        const reviewCourse = String(reviewCourseText || "").trim().toLowerCase().replace(/\s+/g, " ");
        const courseCode = String(course.code || "").trim().toLowerCase().replace(/\s+/g, " ");
        const courseTitle = String(course.title || "").trim().toLowerCase().replace(/\s+/g, " ");

        return Boolean(reviewCourse && (reviewCourse === courseCode || reviewCourse === courseTitle));
      }

      function reviewBelongsToCourse(review, course) {
        if (review.courseCode) {
          return normalizeCourseKey(review.courseCode) === normalizeCourseKey(course.code);
        }

        return legacyCourseMatchesExactly(review.course, course);
      }

      function dedupeReviews(reviews) {
        const seen = Object.create(null);
        const uniqueReviews = [];

        reviews.forEach(function (review) {
          const key = review.id || [
            review.professorId,
            review.reviewerUid,
            review.courseCode || review.course,
            review.semester || review.term,
            review.createdAt
          ].join("|");

          if (!seen[key]) {
            seen[key] = true;
            uniqueReviews.push(review);
          }
        });

        return uniqueReviews;
      }

      function getCourseReviewFilters(course) {
        const key = getCourseReviewKey(course);

        if (!courseReviewFiltersByCode[key]) {
          courseReviewFiltersByCode[key] = {
            professor: "all",
            semester: "all",
            rating: "all",
            sort: "newest"
          };
        }

        return courseReviewFiltersByCode[key];
      }

      function getLoadedCourseReviews(course) {
        return Array.isArray(courseReviewsByCode[getCourseReviewKey(course)])
          ? courseReviewsByCode[getCourseReviewKey(course)]
          : [];
      }

      async function getCurrentReviewUser() {
        try {
          const response = await fetch("/api/me", {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store",
            headers: {
              Accept: "application/json"
            }
          });

          const data = await response.json().catch(function () {
            return {};
          });

          if (response.ok && (data.loggedIn || data.signedIn || data.authenticated) && data.user) {
            return data.user;
          }
        } catch (error) {}

        return null;
      }

      async function loadCourseReviews(course) {
        const key = getCourseReviewKey(course);

        if (!key || courseReviewStatusByCode[key] === "loading") {
          return;
        }

        courseReviewStatusByCode[key] = "loading";
        courseReviewErrorByCode[key] = "";

        try {
          const response = await fetch("/api/professor-reviews?courseCode=" + encodeURIComponent(course.code), {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store",
            headers: {
              Accept: "application/json"
            }
          });

          const data = await response.json().catch(function () {
            return {};
          });

          if (!response.ok || !data.success || !Array.isArray(data.reviews)) {
            throw new Error(data.error || "Could not load course reviews.");
          }

          courseReviewsByCode[key] = dedupeReviews(data.reviews.filter(function (review) {
            return reviewBelongsToCourse(review, course);
          }));
          courseReviewStatusByCode[key] = "loaded";
        } catch (error) {
          courseReviewsByCode[key] = [];
          courseReviewStatusByCode[key] = "error";
          courseReviewErrorByCode[key] = error.message || "Could not load course reviews.";
        }

        if (normalizeCourseKey(state.selectedCourseCode) === normalizeCourseKey(course.code)) {
          render();
        }
      }

      function renderCourseReviewSummary(reviews) {
        if (!reviews.length) {
          return '<div class="course-empty-state">No professor reviews have been recorded for this course yet.</div>';
        }

        const summaryItems = [
          { label: "Overall average", value: formatAverageReviewMetric(reviews, "rating") },
          { label: "Total reviews", value: formatCount(reviews.length, "review") },
          { label: "Clarity", value: formatAverageReviewMetric(reviews, "clarityRating") },
          { label: "Grading fairness", value: formatAverageReviewMetric(reviews, "gradingRating") },
          { label: "Workload", value: formatAverageReviewMetric(reviews, "workloadRating") },
          { label: "Attendance strictness", value: formatAverageReviewMetric(reviews, "attendanceRating") },
          { label: "Would take again", value: formatWouldTakeAgain(reviews) }
        ];

        return `
          <p class="course-detail-note">These numbers describe reviews for this course only, not each professor's complete teaching record.</p>
          <div class="course-review-summary-grid">
            ${summaryItems.map(function (item) {
              return `
                <article class="course-review-summary-card">
                  <span>${escapeHtml(item.label)}</span>
                  <strong>${escapeHtml(item.value)}</strong>
                </article>
              `;
            }).join("")}
          </div>
        `;
      }

      function renderCourseProfessorBreakdown(course, reviews) {
        const groups = Object.create(null);

        reviews.forEach(function (review) {
          const professor = getReviewProfessor(review);
          const professorId = professor.id || review.professorId || "unknown-professor";

          groups[professorId] = groups[professorId] || {
            professor,
            reviews: []
          };

          groups[professorId].reviews.push(review);
        });

        const professorGroups = Object.keys(groups).map(function (professorId) {
          return groups[professorId];
        }).sort(function (first, second) {
          return first.professor.name.localeCompare(second.professor.name);
        });

        if (!professorGroups.length) {
          return "";
        }

        return `
          <div class="course-review-professor-grid">
            ${professorGroups.map(function (group) {
              const professor = group.professor;
              const semesters = Array.from(new Set(group.reviews.map(getReviewSemesterLabel).filter(Boolean))).sort();

              return `
                <a class="course-review-professor-card" href="professors.html?professor=${encodeURIComponent(professor.id || "")}">
                  <div class="course-review-professor-photo">
                    <img src="${escapeHtml(professor.image || "user.png")}" alt="${escapeHtml(professor.name)}">
                  </div>

                  <div>
                    <h4>${escapeHtml(professor.name)}</h4>
                    <p>${escapeHtml(formatAverageReviewMetric(group.reviews, "rating"))} · ${escapeHtml(formatCount(group.reviews.length, "review"))}</p>
                    <p>${escapeHtml(semesters.length ? semesters.join(", ") : "Semester not listed")}</p>
                    <p>${escapeHtml(formatWouldTakeAgain(group.reviews))} would take again</p>
                  </div>
                </a>
              `;
            }).join("")}
          </div>
        `;
      }

      function getCourseReviewFilterValues(reviews, getValue) {
        const seen = Object.create(null);
        const values = [];

        reviews.forEach(function (review) {
          const value = String(getValue(review) || "").trim();
          const lookup = value.toLowerCase();

          if (value && !seen[lookup]) {
            seen[lookup] = true;
            values.push(value);
          }
        });

        return values.sort(function (a, b) {
          return a.localeCompare(b);
        });
      }

      function renderReviewFilterOptions(values, selectedValue, fallbackLabel) {
        return [`<option value="all"${selectedValue === "all" ? " selected" : ""}>${escapeHtml(fallbackLabel)}</option>`].concat(values.map(function (value) {
          return `<option value="${escapeHtml(value)}"${selectedValue === value ? " selected" : ""}>${escapeHtml(value)}</option>`;
        })).join("");
      }

      function renderCustomReviewFilterOptions(values, selectedValue, fallbackLabel) {
        return [`<button class="custom-select-option${selectedValue === "all" ? " active" : ""}" type="button" data-value="all">${escapeHtml(fallbackLabel)}</button>`].concat(values.map(function (value) {
          return `<button class="custom-select-option${selectedValue === value ? " active" : ""}" type="button" data-value="${escapeHtml(value)}">${escapeHtml(value)}</button>`;
        })).join("");
      }

      function getFilteredCourseReviews(course, reviews) {
        const filters = getCourseReviewFilters(course);

        return reviews.filter(function (review) {
          const professor = getReviewProfessor(review);
          const professorName = professor.name || review.professorName || "Professor";
          const semester = getReviewSemesterLabel(review);
          const rating = getReviewRating(review, "rating");

          if (filters.professor !== "all" && professorName !== filters.professor) {
            return false;
          }

          if (filters.semester !== "all" && semester !== filters.semester) {
            return false;
          }

          if (filters.rating !== "all" && String(Math.round(rating || 0)) !== filters.rating) {
            return false;
          }

          return true;
        }).slice().sort(function (first, second) {
          const firstRating = getReviewRating(first, "rating") || 0;
          const secondRating = getReviewRating(second, "rating") || 0;
          const firstTime = new Date(first.createdAt || 0).getTime() || 0;
          const secondTime = new Date(second.createdAt || 0).getTime() || 0;

          if (filters.sort === "rating-high") {
            return secondRating - firstRating;
          }

          if (filters.sort === "rating-low") {
            return firstRating - secondRating;
          }

          return secondTime - firstTime;
        });
      }

      function renderCourseReviewTags(review) {
        const tags = [
          { key: "clarityRating", label: "Clarity" },
          { key: "gradingRating", label: "Grading" },
          { key: "workloadRating", label: "Workload" },
          { key: "attendanceRating", label: "Attendance" }
        ].map(function (metric) {
          const rating = getReviewRating(review, metric.key);
          return rating === null ? "" : metric.label + " " + rating + "/5";
        }).filter(Boolean);

        const takeAgain = String(review.takeAgain || "").trim().toLowerCase();

        if (takeAgain === "yes") {
          tags.push("Would take again");
        } else if (takeAgain === "no") {
          tags.push("Would not take again");
        }

        return tags.map(function (tag) {
          return `<span>${escapeHtml(tag)}</span>`;
        }).join("");
      }

      function setCourseDropdownOpen(dropdown, open) {
        const trigger = dropdown ? dropdown.querySelector(".custom-select-trigger") : null;

        if (!dropdown || !trigger) {
          return;
        }

        dropdown.classList.toggle("open", Boolean(open));
        trigger.setAttribute("aria-expanded", String(Boolean(open)));
      }

      function initializeCourseDropdowns(course) {
        const dropdowns = Array.from(courseDetailView.querySelectorAll(".course-review-custom-dropdown"));

        dropdowns.forEach(function (dropdown) {
          const selectName = dropdown.dataset.selectName || "";
          const filterName = dropdown.dataset.filterSelect || "";
          const select = selectName
            ? courseDetailView.querySelector('select[name="' + selectName + '"]')
            : courseDetailView.querySelector('select[data-course-review-filter="' + filterName + '"]');
          const trigger = dropdown.querySelector(".custom-select-trigger");
          const value = dropdown.querySelector(".custom-select-value");
          const options = Array.from(dropdown.querySelectorAll(".custom-select-option"));

          if (!select || !trigger || !value) {
            return;
          }

          trigger.addEventListener("click", function (event) {
            event.preventDefault();

            dropdowns.forEach(function (otherDropdown) {
              if (otherDropdown !== dropdown) {
                setCourseDropdownOpen(otherDropdown, false);
              }
            });

            setCourseDropdownOpen(dropdown, !dropdown.classList.contains("open"));
          });

          options.forEach(function (option) {
            option.addEventListener("click", function (event) {
              event.preventDefault();

              select.value = option.dataset.value || "";
              value.textContent = option.textContent.trim();

              options.forEach(function (item) {
                item.classList.toggle("active", item === option);
              });

              dropdown.classList.remove("invalid");
              setCourseDropdownOpen(dropdown, false);

              if (filterName) {
                const filters = getCourseReviewFilters(course);
                filters[filterName] = select.value || (filterName === "sort" ? "newest" : "all");
                renderCourseDetail(course);
              }
            });
          });
        });
      }

      async function submitCourseReview(course, reviewForm, reviewMessage) {
        const formData = new FormData(reviewForm);
        const professors = getCourseProfessors(course);
        const professorId = String(formData.get("professorId") || "").trim();
        const professor = professors.find(function (item) {
          return item.id === professorId;
        }) || null;
        const semester = getSemesterOption(formData.get("semester"));
        const reviewText = String(formData.get("review") || "").trim();
        const rating = Number(formData.get("rating"));
        const clarityRating = Number(formData.get("clarityRating"));
        const gradingRating = Number(formData.get("gradingRating"));
        const workloadRating = Number(formData.get("workloadRating"));
        const attendanceRating = Number(formData.get("attendanceRating"));
        const takeAgain = String(formData.get("takeAgain") || "").trim().toLowerCase();

        if (!professor) {
          reviewMessage.textContent = "Select one of the recorded professors before submitting.";
          return;
        }

        if (!semester) {
          reviewMessage.textContent = "Select a standard semester before submitting.";
          return;
        }

        if (!rating || !clarityRating || !gradingRating || !workloadRating || !attendanceRating || (takeAgain !== "yes" && takeAgain !== "no") || !reviewText) {
          reviewMessage.textContent = "Fill out every field before submitting.";
          return;
        }

        const currentUser = await getCurrentReviewUser();

        if (!currentUser) {
          reviewMessage.innerHTML = '<a href="login.html">Log in</a> with your verified AUC account to submit a review.';
          return;
        }

        reviewMessage.textContent = "Submitting review...";

        try {
          const response = await fetch("/api/professor-reviews", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json"
            },
            body: JSON.stringify({
              professorId: professor.id,
              professorName: professor.name,
              courseCode: course.code,
              courseTitle: course.title,
              course: getCourseLabel(course),
              semester: semester.value,
              semesterLabel: semester.label,
              term: semester.label,
              rating,
              clarityRating,
              gradingRating,
              workloadRating,
              attendanceRating,
              takeAgain,
              text: reviewText
            })
          });

          const data = await response.json().catch(function () {
            return {};
          });

          if (!response.ok || !data.success || !data.review) {
            reviewMessage.textContent = data.error || "Could not save this review.";
            return;
          }

          const key = getCourseReviewKey(course);
          courseReviewsByCode[key] = dedupeReviews([data.review].concat(getLoadedCourseReviews(course)));
          courseReviewStatusByCode[key] = "loaded";
          renderCourseDetail(course);

          const reviewList = courseDetailView.querySelector(".course-review-list");

          if (reviewList) {
            reviewList.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        } catch (error) {
          reviewMessage.textContent = "Could not save this review.";
        }
      }

      function initializeCourseReviewUi(course) {
        initializeCourseDropdowns(course);

        const reviewOpenButton = document.getElementById("course-review-open-button");
        const reviewModal = document.getElementById("course-review-modal");
        const reviewBackdrop = document.getElementById("course-review-modal-backdrop");
        const reviewClose = document.getElementById("course-review-modal-close");
        const reviewForm = document.getElementById("course-review-form");
        const reviewMessage = document.getElementById("course-review-form-message");

        function setModalOpen(open) {
          if (!reviewModal) {
            return;
          }

          reviewModal.hidden = !open;
          document.body.style.overflow = open ? "hidden" : "";
        }

        if (reviewOpenButton && !reviewOpenButton.disabled) {
          reviewOpenButton.addEventListener("click", function () {
            setModalOpen(true);
          });
        }

        [reviewBackdrop, reviewClose].forEach(function (element) {
          if (element) {
            element.addEventListener("click", function () {
              setModalOpen(false);
            });
          }
        });

        if (reviewForm && reviewMessage) {
          reviewForm.addEventListener("submit", function (event) {
            event.preventDefault();
            submitCourseReview(course, reviewForm, reviewMessage);
          });
        }
      }

      function updateCourseHistory(course, replace) {
        const url = course ? getCourseUrl(course) : "courses.html";
        const method = replace ? "replaceState" : "pushState";

        window.history[method]({
          courseCode: course ? course.code : ""
        }, "", url);
      }

      function showCatalogue(pushHistory) {
        state.selectedCourseCode = "";

        if (pushHistory) {
          updateCourseHistory(null, false);
        }

        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function openCourseDetail(courseCode, pushHistory) {
        const course = getCourseByCode(courseCode);

        if (!course) {
          return;
        }

        state.selectedCourseCode = course.code;

        if (pushHistory) {
          updateCourseHistory(course, false);
        }

        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderCourseDetail(course) {
        const stats = getCourseStats(course);

        courseDetailView.innerHTML = `
          <article class="course-detail-shell">
            <header class="course-detail-header">
              <div class="course-detail-header-top">
                <div>
                  <p class="course-detail-code">${escapeHtml(course.code)}</p>
                  <h2>${escapeHtml(course.title)}</h2>
                </div>

                <a id="courseCatalogueBack" class="course-professor-action" href="courses.html">Course Catalogue</a>
              </div>

              <p class="course-detail-summary">${escapeHtml(course.summary)}</p>

              <div class="course-detail-stats">
                <div class="course-detail-stat">
                  <span>Department</span>
                  <strong>${escapeHtml(course.department)}</strong>
                </div>
                <div class="course-detail-stat">
                  <span>Course Level</span>
                  <strong>${escapeHtml(course.level)}</strong>
                </div>
                <div class="course-detail-stat">
                  <span>Recorded Professors</span>
                  <strong>${escapeHtml(String(stats.professorCount))}</strong>
                </div>
                <div class="course-detail-stat">
                  <span>Materials</span>
                  <strong>${escapeHtml(String(stats.materialCount))}</strong>
                </div>
              </div>
            </header>

            <section class="course-detail-section">
              <p class="course-section-label">Professors recorded as having taught this course</p>
              <h3>Recorded Professors</h3>
              <p class="course-detail-note">This is historical, student-maintained information and does not indicate current or future course availability.</p>
              ${renderProfessorRows(course)}
            </section>

            <section class="course-detail-section">
              <h3>Materials</h3>
              ${renderMaterialRows(course)}
            </section>

            ${renderCourseReviewSection(course)}
          </article>
        `;

        const backLink = document.getElementById("courseCatalogueBack");

        if (backLink) {
          backLink.addEventListener("click", function (event) {
            event.preventDefault();
            showCatalogue(true);
          });
        }

        initializeCourseReviewUi(course);
      }

      function render() {
        const selectedCourse = getCourseByCode(state.selectedCourseCode);

        coursesPage.classList.toggle("detail-mode", Boolean(selectedCourse));
        courseDetailView.hidden = !selectedCourse;

        if (selectedCourse) {
          document.title = selectedCourse.code + " | AUC Atlas";
          renderCourseDetail(selectedCourse);
          return;
        }

        document.title = "Courses | AUC Atlas";
        courseDetailView.innerHTML = "";
        renderDepartmentFilters();
        renderCourseLevelFilters();

        const filteredCourses = getFilteredCourses();
        renderCourses(filteredCourses);
      }

      document.querySelectorAll(".filter-toggle").forEach(function (button) {
        button.addEventListener("click", function () {
          button.closest(".filter-item").classList.toggle("open");
        });
      });

      courseSearch.addEventListener("input", function () {
        state.query = courseSearch.value;
        render();
      });

      window.addEventListener("popstate", function () {
        state.selectedCourseCode = getInitialCourseCode();
        render();
      });

      state.selectedCourseCode = getInitialCourseCode();
      render();
    </script>
  </main>

  <div id="site-footer-root"></div>
  <script src="footer.js"></script>
</body>
</html>
