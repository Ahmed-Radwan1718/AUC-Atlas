<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses | AUC Atlas</title>
  <meta name="description" content="Browse AUC Atlas courses by department, code, professor context, materials, and reviews." />
  <link rel="stylesheet" href="style.css" />

  <style>
    .courses-page {
      padding: 128px 0 90px;
    }

    .courses-hero {
      margin-bottom: 42px;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(320px, 0.45fr);
      gap: 34px;
      align-items: end;
    }

    .courses-hero h1 {
      margin: 0;
      max-width: 660px;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      line-height: 1.12;
      text-transform: uppercase;
    }

    .courses-hero > p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .courses-toolbar {
      max-width: 720px;
      margin-bottom: 24px;
      display: block;
    }

    .course-search {
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      display: grid;
      gap: 9px;
    }

    .course-search span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .course-search input {
      width: 100%;
      min-height: 48px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink);
      outline: 0;
    }

    .course-search input:focus {
      border-color: var(--gold);
      background: var(--surface);
    }

    .courses-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 26px;
      align-items: start;
    }

    .course-filter-panel {
      position: sticky;
      top: 106px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }

    .course-filter-heading {
      padding: 0 2px 10px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .filter-item {
      border-top: 1px solid var(--line);
    }

    .filter-toggle {
      width: 100%;
      min-height: 48px;
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
    }

    .filter-toggle span:first-child {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .chevron {
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .filter-item.open .chevron {
      transform: rotate(180deg);
    }

    .filter-content {
      display: none;
      gap: 9px;
      padding: 0 0 14px;
    }

    .filter-item.open .filter-content {
      display: grid;
    }

    .filter-content label {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.25;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .filter-content label:hover {
      border-color: var(--gold);
      color: var(--ink);
      transform: translateX(2px);
    }

    .filter-content input {
      width: 15px;
      height: 15px;
      accent-color: var(--gold);
      flex: 0 0 auto;
    }

    .filter-content label:has(input:checked) {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }

    .courses-list-panel {
      min-width: 0;
    }

    .courses-list-heading {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .courses-list-heading span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .atlas-course-card,
    .atlas-course-card:visited {
      width: 100%;
      min-height: 282px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      text-align: left;
      text-decoration: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: default;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .atlas-course-card:hover,
    .atlas-course-card.active {
      border-color: var(--gold);
      box-shadow: 0 18px 48px rgba(29, 31, 31, 0.1);
      transform: translateY(-3px);
    }

    .atlas-course-card.active {
      background: var(--surface);
    }

    .course-card-visual {
      min-height: 132px;
      padding: 18px;
      background:
        linear-gradient(145deg, rgba(139, 30, 63, 0.92), rgba(29, 31, 31, 0.96));
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .course-card-visual span {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .course-card-visual strong {
      font-size: clamp(1.55rem, 2.4vw, 2.2rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .course-card-body {
      padding: 18px;
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    .course-card-body h2 {
      margin: 0 0 10px;
      font-size: 19px;
      line-height: 1.16;
    }

    .course-card-body p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.55;
    }

    .course-card-meta {
      margin-top: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .course-card-meta span,
    .course-detail-stat span,
    .course-material-request {
      padding: 7px 9px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 900;
    }

    .course-detail-panel {
      position: sticky;
      top: 106px;
      min-width: 0;
    }

    .course-detail-shell {
      border-top: 1px solid var(--line-strong);
      padding-top: 22px;
      display: grid;
      gap: 18px;
    }

    .course-detail-header {
      display: grid;
      gap: 14px;
    }

    .course-detail-header-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: start;
    }

    .course-detail-header h2 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.04;
      text-transform: uppercase;
    }

    .course-detail-code {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .course-detail-summary {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .course-detail-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .course-detail-stat {
      min-height: 78px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      display: grid;
      align-content: center;
      gap: 7px;
    }

    .course-detail-stat strong {
      color: var(--ink);
      font-size: 18px;
      line-height: 1.2;
    }

    .course-detail-section {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .course-detail-section h3 {
      margin: 0 0 14px;
      font-size: 18px;
      text-transform: uppercase;
    }

    .course-professor-list,
    .course-material-list,
    .course-review-list {
      display: grid;
      gap: 10px;
    }

    .course-professor-row,
    .course-material-row,
    .course-review-row {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .course-professor-row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .course-professor-avatar {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      overflow: hidden;
    }

    .course-professor-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .course-professor-meta h4,
    .course-material-row h4,
    .course-review-row h4 {
      margin: 0 0 6px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.22;
    }

    .course-professor-meta p,
    .course-material-row p,
    .course-review-row p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .course-professor-action,
    .course-professor-action:visited {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: white;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .course-empty-state {
      padding: 18px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      line-height: 1.6;
    }

    .material-request-list {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .site-footer {
      margin-top: 0;
    }

    @media (max-width: 1080px) {
      .courses-layout {
        grid-template-columns: 1fr;
      }

      .course-filter-panel,
      .course-detail-panel {
        position: static;
      }

      .filter-item.open .filter-content {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .courses-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .courses-hero,
      .course-detail-stats {
        grid-template-columns: 1fr;
      }

      .courses-page {
        padding-top: 112px;
      }

      .filter-item.open .filter-content {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .courses-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .course-detail-header-top,
      .course-professor-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      .course-professor-action {
        width: 100%;
      }
    }

    @media (max-width: 620px) {
      .courses-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="site-header-root"></div>
  <script src="siteheader.js"></script>
  <script src="professors-data.js"></script>
  <script src="courses-data.js"></script>

  <main class="courses-page">
    <section class="courses-hero">
      <div>
        <p class="kicker">Course catalogue</p>
        <h1>Browse Courses</h1>
      </div>
      <p>
        Start with the class, then compare professors, materials, and course-specific reviews in the Atlas.
      </p>
    </section>

    <section class="courses-toolbar" aria-label="Course search">
      <label class="course-search" for="courseSearch">
        <span>Search courses</span>
        <input id="courseSearch" type="search" placeholder="Search RHET 1020, chemistry, professor, notes...">
      </label>
    </section>

    <section class="courses-layout">
      <aside class="course-filter-panel" aria-label="Course filters">
        <div class="course-filter-heading">Filter Courses</div>

        <div class="filter-item open">
          <button class="filter-toggle" type="button"><span>Department</span><span class="chevron">⌄</span></button>
          <div id="courseDepartmentFilter" class="filter-content" aria-label="Department filter"></div>
        </div>

        <div class="filter-item open">
          <button class="filter-toggle" type="button"><span>Course Level</span><span class="chevron">⌄</span></button>
          <div id="courseLevelFilter" class="filter-content" aria-label="Course level filter"></div>
        </div>
      </aside>

      <section class="courses-list-panel" aria-label="AUC courses">
        <div class="courses-list-heading">
          <span id="coursesCount">0 courses</span>
        </div>

        <div id="coursesGrid" class="courses-grid"></div>
      </section>
    </section>

    <script>
      const coursesPageCourses = [
        ["CHEM 1005", "General Chemistry I"], ["CSCE 1101", "Introduction to Computer Science"], ["RHET 1020", "Research Writing"], ["ECON 2011", "Introduction to Macroeconomics"],
        ["CHEM 1006", "General Chemistry II"], ["CHEM 1016", "General Chemistry II-Laboratory"], ["CHEM 2003", "Organic Chemistry I"], ["CHEM 2006", "Analytical Chemistry I"],
        ["CHEM 2013", "Organic Chemistry I Laboratory"], ["CHEM 2016", "Volumetric and Gravimetric Analysis"], ["CHEM 3003", "Thermodynamics"], ["CHEM 3004", "Physical Chemistry I"],
        ["CHEM 3005", "Principles of Chemical Modeling"], ["CHEM 3006", "Organic Chemistry II"], ["CHEM 3009", "Inorganic Chemistry I"], ["CHEM 3011", "Analytical Chemistry II"],
        ["CHEM 3012", "Analytical Chemistry II Laboratory"], ["CHEM 3013", "Thermodynamics Laboratory"], ["CHEM 3014", "Physical Chemistry I Laboratory"], ["CHEM 3015", "Biochemistry"],
        ["CHEM 3016", "Organic Chemistry II Laboratory"], ["CHEM 3018", "Inorganic Chemistry Laboratory"], ["CHEM 3940", "Seminar in Science and Technology"], ["CHEM 4003", "Physical Chemistry II"],
        ["CHEM 4004", "Physical Chemistry III"], ["CHEM 4006", "Organic Chemistry III"], ["CHEM 4008", "Inorganic Chemistry II"], ["CHEM 4013", "Physical Chemistry II Laboratory"],
        ["CHEM 4016", "Organic Syntheses"], ["CHEM 4980", "Senior Thesis I"], ["CHEM 4981", "Senior Thesis II"], ["BADM 2001", "Introduction to Business"],
        ["CSCE 1001", "Fundamentals of Computing I"], ["ENTR 3102", "Entrepreneurship and Innovation"], ["MACT 1121", "Calculus I"], ["CHEM 3522", "Production Basics for Chemical Industries"],
        ["CHEM 3523", "Chemistry of Petrochemical Processes"], ["CHEM 4524", "Polymer Chemistry and Technology"], ["CHEM 2020", "Introduction to Food Science and Technology"], ["CHEM 3020", "Food Chemistry"],
        ["CHEM 4007", "Food Processing and Preservation"], ["CHEM 3002", "Archaeological Chemistry I"], ["CHEM 3910", "Guided Studies in Environmental Sciences"], ["CHEM 4910", "Independent Study"],
        ["CHEM 4930", "Selected Topics in Chemistry"], ["CHEM 4005", "Industrial Chemistry"], ["CHEM 4900", "Chemistry Practical Internship"], ["CHEM 1015", "General Chemistry I-Laboratory"],
        ["ENGR 1005", "Descriptive Geometry and Engineering Drawing"], ["ENGR 2102", "Engineering Mechanics I (Statics)"], ["ENGR 2104", "Engineering Mechanics II (Dynamics)"], ["ENGR 3202", "Engineering Analysis and Computation I"],
        ["ENGR 3212", "General Electrical Engineering"], ["ENGR 3222", "Engineering Economy"], ["MACT 1122", "Calculus II"], ["MACT 2123", "Calculus III"],
        ["MACT 2141", "Differential Equations"], ["MACT 3224", "Probability and Statistics"], ["MENG 2112", "Strength of Materials"], ["MENG 2202", "Introduction to Computational Thinking and Programming for Engineers Lab"],
        ["MENG 2505", "Mechanical Engineering Drawing"], ["MENG 2601", "Fluid Mechanics Fundamentals"], ["MENG 3207", "Engineering Materials"], ["MENG 3209", "Fundamentals of Manufacturing Processes"],
        ["MENG 3217", "Mechanical and Structural Behavior of Engineering Materials Lab"], ["MENG 3402", "Quality and Process Control"], ["MENG 3446", "Engineering and Project Management"], ["MENG 3502", "Mechanical Systems"],
        ["MENG 3505", "Mechanics of Materials"], ["MENG 3506", "Mechanical Design I"], ["MENG 3601", "Fundamentals of Thermodynamics"], ["MENG 3602", "Applied Fluid Mechanics"],
        ["MENG 3605", "Applied Thermodynamics"], ["MENG 3705", "System Dynamics"], ["MENG 4208", "Selection of Materials and Processes for Design"], ["MENG 4221", "Composites: Design, Materials, and Manufacturing"],
        ["MENG 4226", "Metals, Alloys and Composites"], ["MENG 4227", "Failure of Mechanical Components"], ["MENG 4229", "Nanostructured Materials"], ["MENG 4232", "Materials, Processing, and Design"],
        ["MENG 4239", "Advanced Manufacturing Processes"], ["MENG 4440", "Engineering Operations Research"], ["MENG 4441", "Decision Support in Engineering Systems"], ["MENG 4442", "Reliability Engineering and Risk Analysis"],
        ["MENG 4443", "Systems Simulation"], ["MENG 4444", "Work Analysis and Design"], ["MENG 4445", "Production and Inventory Control"], ["MENG 4448", "Facilities Planning"],
        ["MENG 4449", "Maintenance Management Systems"], ["MENG 4477", "Manufacturing System Automation"], ["MENG 4507", "Mechanical Design II"], ["MENG 4551", "Design for Additive Manufacturing"],
        ["MENG 4553", "Finite Element Method and Applications in Design"], ["MENG 4555", "Applied Vibration Measurements, Analysis and Control"], ["MENG 4558", "Integrated Design"], ["MENG 4565", "Design of Engineering Systems"],
        ["MENG 4606", "Heat Transfer"], ["MENG 4661", "Turbo-Machinery"], ["MENG 4662", "Power Plant Technology"], ["MENG 4663", "Design of Renewable Energy Systems"],
        ["MENG 4665", "Internal Combustion Engines"], ["MENG 4666", "Design of Heating, Ventilation, and Air Conditioning Systems"], ["MENG 4667", "Refrigeration and Air-conditioning"], ["MENG 4756", "Automatic Control Systems"],
        ["MENG 4757", "Robotics: Design, Analysis and Control"], ["MENG 4778", "Microcontrollers and Mechatronics Systems"], ["MENG 4779", "Integrated Design of Electromechanical Systems"], ["MENG 4930", "Selected Topics in Industrial Engineering"],
        ["MENG 4931", "Selected Topics in Design"], ["MENG 4932", "Selected Topics in Materials and Manufacturing"], ["MENG 4936", "Selected Topics in Power Engineering"], ["MENG 4937", "Selected Topics in Mechatronics"],
        ["MENG 4950", "Industrial Training"], ["MENG 4980", "Senior Project I"], ["MENG 4981", "Senior Project II"], ["MENG 5168", "Nuclear Power Plant Engineering"],
        ["PHYS 1011", "Physics 1: Classical Mechanics, Sound and Heat"], ["PHYS 1012", "General Physics Laboratory I"], ["PHYS 1021", "Physics 2: Electricity and Magnetism"], ["PHYS 1022", "General Physics Laboratory II"],
        ["PHYS 2216", "Fundamentals of Circuits and Electronics"], ["PHYS 2217", "Fundamentals of Circuits and Electronics Lab"]
      ];

      function getCoursePageDepartment(code) {
        const subject = code.split(" ")[0];

        return {
          BADM: "Business",
          CHEM: "Chemistry",
          CSCE: "Computer Science",
          ECON: "Economics",
          ENGR: "Engineering",
          ENTR: "Entrepreneurship",
          MACT: "Mathematics",
          MENG: "Mechanical Engineering",
          PHYS: "Physics",
          RHET: "Rhetoric"
        }[subject] || "Course";
      }

      const courseDetailsByCode = window.AUC_ATLAS_COURSE_DETAILS || {};
      const professorDirectory = window.AUC_ATLAS_PROFESSORS || [];
      const professorsById = Object.create(null);
      const courseReviewsByCode = Object.create(null);
      const courseReviewStatusByCode = Object.create(null);

      professorDirectory.forEach(function (professor) {
        professorsById[professor.id] = professor;
      });

      function getCourseLevel(code) {
        const courseNumber = String(code || "").split(" ")[1] || "";
        const firstDigit = courseNumber.charAt(0);

        return firstDigit ? firstDigit + "000 Level" : "Level pending";
      }

      const courseRecords = coursesPageCourses.map(function (courseItem) {
        const code = courseItem[0];
        const title = courseItem[1];
        const department = getCoursePageDepartment(code);
        const details = courseDetailsByCode[code] || {};
        const level = getCourseLevel(code);

        return Object.assign({
          code,
          title,
          department,
          level,
          summary: title + " in the " + department + " catalogue.",
          professors: [],
          materials: [],
          materialRequests: []
        }, details, {
          code,
          title,
          department: details.department || department,
          level: details.level || level
        });
      });

      const coursesGrid = document.getElementById("coursesGrid");
      const coursesCount = document.getElementById("coursesCount");
      const courseSearch = document.getElementById("courseSearch");
      const departmentFilter = document.getElementById("courseDepartmentFilter");
      const courseLevelFilter = document.getElementById("courseLevelFilter");
      const courseDetailPanel = document.getElementById("courseDetailPanel");

      const state = {
        query: "",
        departments: [],
        levels: []
      };

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[character];
        });
      }

      function getInitialCourseCode() {
        const requestedCourse = new URLSearchParams(window.location.search).get("course");

        if (requestedCourse && coursesPageCourses.some(function (course) {
          return course[0] === requestedCourse;
        })) {
          return requestedCourse;
        }

        return courseDetailsByCode["RHET 1020"] ? "RHET 1020" : coursesPageCourses[0][0];
      }

      function getCourseByCode(code) {
        return courseRecords.find(function (course) {
          return course.code === code;
        }) || null;
      }

      function normalizeCourseKey(value) {
        return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      function formatCount(count, label) {
        return count + " " + label + (count === 1 ? "" : "s");
      }

      function getCourseProfessors(course) {
        return (Array.isArray(course.professors) ? course.professors : []).map(function (entry) {
          const professorEntry = typeof entry === "string" ? { id: entry } : entry || {};
          const directoryProfessor = professorsById[professorEntry.id] || {};

          return Object.assign({}, directoryProfessor, professorEntry, {
            id: professorEntry.id || directoryProfessor.id || "",
            name: professorEntry.name || directoryProfessor.name || "Professor profile",
            image: professorEntry.image || directoryProfessor.image || "user.png",
            department: professorEntry.department || directoryProfessor.department || course.department
          });
        }).filter(function (professor) {
          return professor.id || professor.name;
        });
      }

      function getCourseReviews(course) {
        const loadedReviews = courseReviewsByCode[course.code] || [];
        const starterReviews = Array.isArray(course.reviews) ? course.reviews : [];

        return loadedReviews.concat(starterReviews);
      }

      function getCourseStats(course) {
        return {
          professorCount: getCourseProfessors(course).length,
          materialCount: Array.isArray(course.materials) ? course.materials.length : 0,
          reviewCount: getCourseReviews(course).length
        };
      }

      function getDepartments() {
        const departments = courseRecords.map(function (course) {
          return course.department;
        }).filter(Boolean);

        return ["All"].concat(Array.from(new Set(departments)).sort(function (a, b) {
          return a.localeCompare(b);
        }));
      }

      function courseMatchesSearch(course) {
        const query = state.query.trim().toLowerCase();

        if (!query) {
          return true;
        }

        const professorNames = getCourseProfessors(course).map(function (professor) {
          return professor.name;
        }).join(" ");

        const materialNames = (course.materials || []).map(function (material) {
          return material.title;
        }).join(" ");

        const requestedMaterials = (course.materialRequests || []).join(" ");

        return [
          course.code,
          course.title,
          course.department,
          course.summary,
          professorNames,
          materialNames,
          requestedMaterials
        ].join(" ").toLowerCase().includes(query);
      }

      function getCourseLevels() {
        return Array.from(new Set(courseRecords.map(function (course) {
          return course.level;
        }).filter(Boolean))).sort(function (a, b) {
          return a.localeCompare(b);
        });
      }

      function getFilteredCourses() {
        return courseRecords.filter(function (course) {
          const matchesDepartment = !state.departments.length || state.departments.includes(course.department);
          const matchesLevel = !state.levels.length || state.levels.includes(course.level);

          return matchesDepartment && matchesLevel && courseMatchesSearch(course);
        });
      }

      function renderFilterCheckboxes(container, values, selectedValues, onChange) {
        container.innerHTML = values.map(function (value) {
          return `
            <label>
              <input type="checkbox" value="${escapeHtml(value)}"${selectedValues.includes(value) ? " checked" : ""}>
              ${escapeHtml(value)}
            </label>
          `;
        }).join("");

        container.querySelectorAll("input[type='checkbox']").forEach(function (checkbox) {
          checkbox.addEventListener("change", function () {
            onChange(checkbox.value, checkbox.checked);
            render();
          });
        });
      }

      function renderDepartmentFilters() {
        renderFilterCheckboxes(departmentFilter, getDepartments().filter(function (department) {
          return department !== "All";
        }), state.departments, function (department, checked) {
          state.departments = checked
            ? state.departments.concat(department)
            : state.departments.filter(function (item) {
                return item !== department;
              });
        });
      }

      function renderCourseLevelFilters() {
        renderFilterCheckboxes(courseLevelFilter, getCourseLevels(), state.levels, function (level, checked) {
          state.levels = checked
            ? state.levels.concat(level)
            : state.levels.filter(function (item) {
                return item !== level;
              });
        });
      }

      function renderCourses(filteredCourses) {
        coursesCount.textContent = formatCount(filteredCourses.length, "course");

        if (!filteredCourses.length) {
          coursesGrid.innerHTML = '<div class="course-empty-state">No courses match this search yet.</div>';
          return;
        }

        coursesGrid.innerHTML = filteredCourses.map(function (course) {
          const stats = getCourseStats(course);

          return `
            <article class="atlas-course-card">
              <div class="course-card-visual">
                <span>${escapeHtml(course.department)}</span>
                <strong>${escapeHtml(course.code)}</strong>
              </div>

              <div class="course-card-body">
                <h2>${escapeHtml(course.title)}</h2>
                <p>${escapeHtml(course.summary)}</p>

                <div class="course-card-meta">
                  <span>${escapeHtml(formatCount(stats.professorCount, "professor"))}</span>
                  <span>${escapeHtml(formatCount(stats.materialCount, "material"))}</span>
                  <span>${escapeHtml(formatCount(stats.reviewCount, "review"))}</span>
                </div>
              </div>
            </article>
          `;
        }).join("");
      }

      function getAverageRating(reviews) {
        const ratings = reviews.map(function (review) {
          return Number(review.rating);
        }).filter(function (rating) {
          return Number.isFinite(rating) && rating >= 1 && rating <= 5;
        });

        if (!ratings.length) {
          return null;
        }

        return ratings.reduce(function (sum, rating) {
          return sum + rating;
        }, 0) / ratings.length;
      }

      function formatAverageRating(reviews) {
        const average = getAverageRating(reviews);
        return average === null ? "Not rated yet" : average.toFixed(1) + " out of 5";
      }

      function getTakeAgainLabel(reviews) {
        const responses = reviews.map(function (review) {
          return String(review.takeAgain || "").trim().toLowerCase();
        }).filter(function (value) {
          return value === "yes" || value === "no";
        });

        if (!responses.length) {
          return "Not enough data";
        }

        const yesCount = responses.filter(function (value) {
          return value === "yes";
        }).length;

        return Math.round((yesCount / responses.length) * 100) + "% would take again";
      }

      function renderProfessorRows(course) {
        const professors = getCourseProfessors(course);
        const reviews = getCourseReviews(course);

        if (!professors.length) {
          return '<div class="course-empty-state">No professors are linked to this course yet.</div>';
        }

        return `<div class="course-professor-list">` + professors.map(function (professor) {
          const professorReviews = reviews.filter(function (review) {
            return review.professorId === professor.id;
          });

          return `
            <article class="course-professor-row">
              <div class="course-professor-avatar">
                <img src="${escapeHtml(professor.image || "user.png")}" alt="${escapeHtml(professor.name)}">
              </div>

              <div class="course-professor-meta">
                <h4>${escapeHtml(professor.name)}</h4>
                <p>${escapeHtml(professor.courseNote || professor.bio || "Course-specific context will appear as reviews come in.")}</p>
                <p>${escapeHtml(formatAverageRating(professorReviews))} - ${escapeHtml(getTakeAgainLabel(professorReviews))}</p>
              </div>

              <a class="course-professor-action" href="professors.html?professor=${encodeURIComponent(professor.id)}">Open Profile</a>
            </article>
          `;
        }).join("") + `</div>`;
      }

      function renderMaterialRows(course) {
        const materials = Array.isArray(course.materials) ? course.materials : [];

        if (!materials.length) {
          const requests = (course.materialRequests || []).map(function (request) {
            return `<span class="course-material-request">${escapeHtml(request)}</span>`;
          }).join("");

          return `
            <div class="course-empty-state">
              No materials uploaded yet.
              ${requests ? `<div class="material-request-list">${requests}</div>` : ""}
            </div>
          `;
        }

        return `<div class="course-material-list">` + materials.map(function (material) {
          return `
            <article class="course-material-row">
              <h4>${escapeHtml(material.title)}</h4>
              <p>${escapeHtml([material.type, material.term, material.uploader].filter(Boolean).join(" - "))}</p>
            </article>
          `;
        }).join("") + `</div>`;
      }

      function getProfessorDisplayName(professorId) {
        return professorsById[professorId] && professorsById[professorId].name
          ? professorsById[professorId].name
          : "Professor";
      }

      function renderReviewRows(course) {
        const reviews = getCourseReviews(course).slice().sort(function (a, b) {
          return new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime();
        });

        if (courseReviewStatusByCode[course.code] === "loading") {
          return '<div class="course-empty-state">Loading course-specific reviews...</div>';
        }

        if (!reviews.length) {
          return '<div class="course-empty-state">No course-specific reviews yet.</div>';
        }

        return `<div class="course-review-list">` + reviews.slice(0, 12).map(function (review) {
          const rating = Number(review.rating);
          const ratingLabel = Number.isFinite(rating) ? Math.round(rating) + " out of 5" : "Not rated";

          return `
            <article class="course-review-row">
              <h4>${escapeHtml(getProfessorDisplayName(review.professorId))} - ${escapeHtml(ratingLabel)}</h4>
              <p>${escapeHtml(review.text || "")}</p>
              <p>${escapeHtml([review.term, review.reviewerName || "AUC student"].filter(Boolean).join(" - "))}</p>
            </article>
          `;
        }).join("") + `</div>`;
      }

      function renderCourseDetail() {
        const course = getCourseByCode(state.selectedCourseCode);

        if (!course) {
          courseDetailPanel.innerHTML = '<div class="course-empty-state">Select a course to view its hub.</div>';
          return;
        }

        if (!courseReviewStatusByCode[course.code]) {
          loadCourseReviews(course);
        }

        const stats = getCourseStats(course);

        courseDetailPanel.innerHTML = `
          <article class="course-detail-shell">
            <header class="course-detail-header">
              <div class="course-detail-header-top">
                <div>
                  <p class="course-detail-code">${escapeHtml(course.code)}</p>
                  <h2>${escapeHtml(course.title)}</h2>
                </div>
                <span class="course-material-request">${escapeHtml(course.department)}</span>
              </div>

              <p class="course-detail-summary">${escapeHtml(course.summary)}</p>

              <div class="course-detail-stats">
                <div class="course-detail-stat">
                  <span>Professors</span>
                  <strong>${escapeHtml(String(stats.professorCount))}</strong>
                </div>
                <div class="course-detail-stat">
                  <span>Materials</span>
                  <strong>${escapeHtml(String(stats.materialCount))}</strong>
                </div>
                <div class="course-detail-stat">
                  <span>Reviews</span>
                  <strong>${escapeHtml(String(stats.reviewCount))}</strong>
                </div>
              </div>
            </header>

            <section class="course-detail-section">
              <h3>Professor Context</h3>
              ${renderProfessorRows(course)}
            </section>

            <section class="course-detail-section">
              <h3>Materials Hub</h3>
              ${renderMaterialRows(course)}
            </section>

            <section class="course-detail-section">
              <h3>Course-Specific Reviews</h3>
              ${renderReviewRows(course)}
            </section>
          </article>
        `;
      }

      function reviewMatchesCourse(review, course) {
        const reviewCourse = normalizeCourseKey(review.course);
        const courseCode = normalizeCourseKey(course.code);
        const courseTitle = normalizeCourseKey(course.title);

        if (!reviewCourse) {
          return false;
        }

        return reviewCourse === courseCode ||
          reviewCourse === courseTitle ||
          reviewCourse.includes(courseCode) ||
          courseTitle.includes(reviewCourse);
      }

      async function fetchProfessorReviews(professorId) {
        if (!professorId) {
          return [];
        }

        try {
          const response = await fetch("/api/professor-reviews?professorId=" + encodeURIComponent(professorId), {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store",
            headers: {
              Accept: "application/json"
            }
          });

          const data = await response.json().catch(function () {
            return {};
          });

          return response.ok && Array.isArray(data.reviews) ? data.reviews : [];
        } catch (error) {
          return [];
        }
      }

      async function loadCourseReviews(course) {
        const professors = getCourseProfessors(course);

        courseReviewStatusByCode[course.code] = "loading";

        const reviewGroups = await Promise.all(professors.map(function (professor) {
          return fetchProfessorReviews(professor.id);
        }));

        const reviews = [];

        reviewGroups.forEach(function (group) {
          group.forEach(function (review) {
            if (reviewMatchesCourse(review, course)) {
              reviews.push(review);
            }
          });
        });

        courseReviewsByCode[course.code] = reviews;
        courseReviewStatusByCode[course.code] = "loaded";
        render();
      }

      function render() {
        renderDepartmentFilters();
        renderCourseLevelFilters();

        const filteredCourses = getFilteredCourses();
        renderCourses(filteredCourses);
      }

      document.querySelectorAll(".filter-toggle").forEach(function (button) {
        button.addEventListener("click", function () {
          button.closest(".filter-item").classList.toggle("open");
        });
      });

      courseSearch.addEventListener("input", function () {
        state.query = courseSearch.value;
        render();
      });

      render();
    </script>
  </main>

  <div id="site-footer-root"></div>
  <script src="footer.js"></script>
</body>
</html>
