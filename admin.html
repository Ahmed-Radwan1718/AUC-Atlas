<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | AUC Atlas</title>
  <meta name="description" content="Manage AUC Atlas professor reviews." />
  <link rel="stylesheet" href="style.css" />

  <style>
    .admin-page {
      padding: 128px 0 90px;
    }

    .admin-hero {
      margin-bottom: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: end;
    }

    .admin-hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
      text-transform: uppercase;
    }

    .admin-hero p {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .admin-toolbar {
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
    }

    .admin-toolbar input {
      width: 100%;
      min-height: 46px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink);
      outline: 0;
    }

    .admin-button,
    .admin-danger-button {
      min-height: 46px;
      padding: 0 17px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .admin-button {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
    }

    .admin-danger-button {
      border: 1px solid rgba(218, 58, 58, .34);
      background: rgba(218, 58, 58, .08);
      color: rgb(178, 42, 42);
    }

    .admin-review-list {
      display: grid;
      gap: 14px;
    }

    .admin-review-card,
    .admin-empty-state,
    .admin-loading {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .admin-review-card {
      display: grid;
      gap: 12px;
    }

    .admin-review-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: start;
    }

    .admin-review-top h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .admin-review-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.6;
    }

    .admin-review-rating {
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .admin-review-card p {
      margin: 0;
      color: var(--ink-soft);
      line-height: 1.7;
    }

    .admin-message {
      min-height: 22px;
      margin-top: 14px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.6;
    }

    .admin-material-heading {
      margin-top: 38px;
    }

    .admin-empty-state {
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 760px) {
      .admin-page {
        padding-top: 112px;
      }

      .admin-hero,
      .admin-toolbar,
      .admin-review-top {
        grid-template-columns: 1fr;
      }

      .admin-review-top {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div id="site-header-root"></div>
  <script src="siteheader.js"></script>

  <main class="admin-page">
    <section class="admin-hero">
      <div>
        <p class="kicker">Admin</p>
        <h1>Review Dashboard</h1>
        <p>Delete professor reviews that should not remain on AUC Atlas.</p>
      </div>

      <button class="admin-button" type="button" id="admin-refresh-button">Refresh</button>
    </section>

    <section class="admin-toolbar" aria-label="Review filters">
      <input type="search" id="admin-review-search" placeholder="Search professor, reviewer, course, or review text">
      <button class="admin-button" type="button" id="admin-clear-search">Clear</button>
    </section>

    <div class="admin-loading" id="admin-loading">Loading reviews...</div>
    <div class="admin-review-list" id="admin-review-list"></div>
    <div class="admin-empty-state" id="admin-empty-state" hidden>No reviews found.</div>
    <p class="admin-message" id="admin-message" aria-live="polite"></p>

    <section class="admin-hero admin-material-heading">
      <div>
        <p class="kicker">Materials</p>
        <h1>Material Dashboard</h1>
        <p>Download or delete uploaded course materials stored for verified AUC students.</p>
      </div>

      <button class="admin-button" type="button" id="admin-material-refresh-button">Refresh Materials</button>
    </section>

    <div class="admin-loading" id="admin-material-loading">Loading materials...</div>
    <div class="admin-review-list" id="admin-material-list"></div>
    <div class="admin-empty-state" id="admin-material-empty-state" hidden>No materials found.</div>
    <p class="admin-message" id="admin-material-message" aria-live="polite"></p>
  </main>

  <div id="site-footer-root"></div>
  <script src="footer.js"></script>
  <script src="professors-data.js"></script>

  <script>
    const reviewList = document.getElementById("admin-review-list");
    const loadingState = document.getElementById("admin-loading");
    const emptyState = document.getElementById("admin-empty-state");
    const message = document.getElementById("admin-message");
    const materialList = document.getElementById("admin-material-list");
    const materialLoadingState = document.getElementById("admin-material-loading");
    const materialEmptyState = document.getElementById("admin-material-empty-state");
    const materialMessage = document.getElementById("admin-material-message");
    const searchInput = document.getElementById("admin-review-search");
    const refreshButton = document.getElementById("admin-refresh-button");
    const materialRefreshButton = document.getElementById("admin-material-refresh-button");
    const clearSearchButton = document.getElementById("admin-clear-search");
    const professors = window.AUC_ATLAS_PROFESSORS || [];
    let reviews = [];
    let materials = [];

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function setMessage(value) {
      if (message) {
        message.textContent = value || "";
      }
    }

    function getProfessorName(review) {
      const professor = professors.find(function (item) {
        return item.id === review.professorId;
      });

      return professor ? professor.name : (review.professorName || review.professorId || "Professor");
    }

    function formatDate(value) {
      if (!value) {
        return "Date not listed";
      }

      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "Date not listed" : date.toLocaleString();
    }

    function formatRating(rating) {
      const cleanRating = Math.max(0, Math.min(5, Math.round(Number(rating || 0))));
      return "★".repeat(cleanRating) + "☆".repeat(5 - cleanRating) + " " + cleanRating + ".0";
    }

    function getReviewCourseLabel(review) {
      if (review.courseCode) {
        return [review.courseCode, review.courseTitle].filter(Boolean).join(" - ");
      }

      return review.course || "";
    }

    function getReviewSemesterLabel(review) {
      return review.semesterLabel || review.term || "";
    }

    function getSearchQuery() {
      return String(searchInput && searchInput.value ? searchInput.value : "").trim().toLowerCase();
    }

    function getFilteredReviews() {
      const query = getSearchQuery();

      if (!query) {
        return reviews;
      }

      return reviews.filter(function (review) {
        return [
          getProfessorName(review),
          review.reviewerName,
          review.reviewerEmail,
          getReviewCourseLabel(review),
          getReviewSemesterLabel(review),
          review.courseCode,
          review.courseTitle,
          review.semester,
          review.text
        ].join(" ").toLowerCase().includes(query);
      });
    }

    function getMaterialCourseLabel(material) {
      return [material.courseCode, material.courseTitle].filter(Boolean).join(" - ");
    }

    function formatFileSize(bytes) {
      const size = Number(bytes || 0);

      if (!Number.isFinite(size) || size <= 0) {
        return "Size not listed";
      }

      if (size >= 1024 * 1024) {
        return (size / (1024 * 1024)).toFixed(1) + " MB";
      }

      return Math.max(1, Math.round(size / 1024)) + " KB";
    }

    function getFilteredMaterials() {
      const query = getSearchQuery();

      if (!query) {
        return materials;
      }

      return materials.filter(function (material) {
        return [
          material.title,
          getMaterialCourseLabel(material),
          material.professorName,
          material.semesterLabel,
          material.materialTypeLabel,
          material.uploaderDisplayLabel,
          material.uploaderEmail,
          material.originalFilename,
          material.description
        ].join(" ").toLowerCase().includes(query);
      });
    }

    function renderReviews() {
      const filteredReviews = getFilteredReviews();

      if (!reviewList || !emptyState) {
        return;
      }

      emptyState.hidden = filteredReviews.length > 0;
      reviewList.innerHTML = filteredReviews.map(function (review) {
        return `
          <article class="admin-review-card">
            <div class="admin-review-top">
              <div>
                <h2>${escapeHtml(getProfessorName(review))}</h2>
                <div class="admin-review-meta">
                  ${escapeHtml(getReviewCourseLabel(review) || "Course not listed")} · ${escapeHtml(getReviewSemesterLabel(review) || "Semester not listed")}<br>
                  ${escapeHtml(review.reviewerName || "AUC student")} · ${escapeHtml(review.reviewerEmail || "Email not listed")}<br>
                  ${escapeHtml(formatDate(review.createdAt))}
                </div>
              </div>

              <button class="admin-danger-button" type="button" data-delete-review="${escapeHtml(review.id)}">
                Delete
              </button>
            </div>

            <div class="admin-review-rating">${escapeHtml(formatRating(review.rating))}</div>
            <p>${escapeHtml(review.text || "")}</p>
          </article>
        `;
      }).join("");

      reviewList.querySelectorAll("[data-delete-review]").forEach(function (button) {
        button.addEventListener("click", function () {
          deleteReview(button.getAttribute("data-delete-review"));
        });
      });
    }

    function renderMaterials() {
      const filteredMaterials = getFilteredMaterials();

      if (!materialList || !materialEmptyState) {
        return;
      }

      materialEmptyState.hidden = filteredMaterials.length > 0;
      materialList.innerHTML = filteredMaterials.map(function (material) {
        return `
          <article class="admin-review-card">
            <div class="admin-review-top">
              <div>
                <h2>${escapeHtml(material.title || "Untitled material")}</h2>
                <div class="admin-review-meta">
                  ${escapeHtml(getMaterialCourseLabel(material) || "Course not listed")} · ${escapeHtml(material.professorName || "Professor not listed")} · ${escapeHtml(material.semesterLabel || "Semester not listed")}<br>
                  ${escapeHtml(material.materialTypeLabel || "Material")} · ${escapeHtml((material.fileExtension || material.fileType || "File").toUpperCase())} · ${escapeHtml(formatFileSize(material.fileSize))}<br>
                  ${escapeHtml(material.uploaderDisplayLabel || "Anonymous AUC student")} · ${escapeHtml(material.uploaderEmail || "Email not listed")} · ${escapeHtml(formatDate(material.createdAt))}
                </div>
              </div>

              <div>
                <button class="admin-button" type="button" data-download-material="${escapeHtml(material.id)}">Download</button>
                <button class="admin-danger-button" type="button" data-delete-material="${escapeHtml(material.id)}">Delete</button>
              </div>
            </div>

            <p>${escapeHtml(material.description || material.originalFilename || "")}</p>
          </article>
        `;
      }).join("");

      materialList.querySelectorAll("[data-download-material]").forEach(function (button) {
        button.addEventListener("click", function () {
          downloadMaterial(button.getAttribute("data-download-material"));
        });
      });

      materialList.querySelectorAll("[data-delete-material]").forEach(function (button) {
        button.addEventListener("click", function () {
          deleteMaterial(button.getAttribute("data-delete-material"));
        });
      });
    }

    async function loadReviews() {
      if (loadingState) {
        loadingState.hidden = false;
      }

      setMessage("");

      try {
        const response = await fetch("/api/professor-reviews?scope=admin", {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            Accept: "application/json"
          }
        });

        const data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok) {
          throw new Error(data.error || "Could not load reviews.");
        }

        reviews = Array.isArray(data.reviews) ? data.reviews : [];
        renderReviews();
      } catch (error) {
        reviews = [];
        renderReviews();
        setMessage(error.message || "Could not load reviews.");
      } finally {
        if (loadingState) {
          loadingState.hidden = true;
        }
      }
    }

    async function loadMaterials() {
      if (materialLoadingState) {
        materialLoadingState.hidden = false;
      }

      if (materialMessage) {
        materialMessage.textContent = "";
      }

      try {
        const response = await fetch("/api/course-materials?scope=admin", {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            Accept: "application/json"
          }
        });

        const data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok) {
          throw new Error(data.error || "Could not load materials.");
        }

        materials = Array.isArray(data.materials) ? data.materials : [];
        renderMaterials();
      } catch (error) {
        materials = [];
        renderMaterials();

        if (materialMessage) {
          materialMessage.textContent = error.message || "Could not load materials.";
        }
      } finally {
        if (materialLoadingState) {
          materialLoadingState.hidden = true;
        }
      }
    }

    async function deleteReview(reviewId) {
      const review = reviews.find(function (item) {
        return item.id === reviewId;
      });

      if (!review || !window.confirm("Delete this review? This cannot be undone.")) {
        return;
      }

      setMessage("Deleting review...");

      try {
        const response = await fetch("/api/professor-reviews", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify({
            action: "delete",
            reviewId
          })
        });

        const data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Could not delete review.");
        }

        reviews = reviews.filter(function (item) {
          return item.id !== reviewId;
        });

        renderReviews();
        setMessage("Review deleted.");
      } catch (error) {
        setMessage(error.message || "Could not delete review.");
      }
    }

    async function downloadMaterial(materialId) {
      if (materialMessage) {
        materialMessage.textContent = "Preparing secure download...";
      }

      try {
        const response = await fetch("/api/course-materials", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify({
            action: "download",
            materialId
          })
        });

        const data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok || !data.success || !data.downloadUrl) {
          throw new Error(data.error || "Could not prepare download.");
        }

        if (materialMessage) {
          materialMessage.textContent = "";
        }

        window.location.href = data.downloadUrl;
      } catch (error) {
        if (materialMessage) {
          materialMessage.textContent = error.message || "Could not prepare download.";
        }
      }
    }

    async function deleteMaterial(materialId) {
      const material = materials.find(function (item) {
        return item.id === materialId;
      });

      if (!material || !window.confirm("Delete this material? This removes the uploaded file and cannot be undone.")) {
        return;
      }

      if (materialMessage) {
        materialMessage.textContent = "Deleting material...";
      }

      try {
        const response = await fetch("/api/course-materials", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify({
            action: "delete",
            materialId
          })
        });

        const data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Could not delete material.");
        }

        materials = materials.filter(function (item) {
          return item.id !== materialId;
        });

        renderMaterials();

        if (materialMessage) {
          materialMessage.textContent = "Material deleted.";
        }
      } catch (error) {
        if (materialMessage) {
          materialMessage.textContent = error.message || "Could not delete material.";
        }
      }
    }

    if (searchInput) {
      searchInput.addEventListener("input", function () {
        renderReviews();
        renderMaterials();
      });
    }

    if (refreshButton) {
      refreshButton.addEventListener("click", function () {
        loadReviews();
        loadMaterials();
      });
    }

    if (materialRefreshButton) {
      materialRefreshButton.addEventListener("click", loadMaterials);
    }

    if (clearSearchButton && searchInput) {
      clearSearchButton.addEventListener("click", function () {
        searchInput.value = "";
        renderReviews();
        renderMaterials();
      });
    }

    loadReviews();
    loadMaterials();
  </script>
</body>
</html>
