<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | AUC Atlas</title>
  <meta name="description" content="Log in to your AUC Atlas account." />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-page {
      padding: 128px 0 90px;
    }

    .auth-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(340px, 0.5fr);
      gap: 34px;
      align-items: start;
    }

    .auth-copy h1 {
      max-width: 720px;
      margin: 0 0 18px;
      font-size: clamp(2.2rem, 4vw, 4rem);
      font-weight: 700;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .auth-copy p:last-child {
      max-width: 620px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .auth-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .auth-panel h2 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.12;
    }

    .auth-panel-intro {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }

    .auth-password-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .auth-password-toggle,
    .auth-link-button {
      min-height: 46px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .auth-password-toggle {
      width: 88px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
    }

    .auth-panel-footer {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-panel-footer a {
      color: var(--gold);
      font-weight: 800;
      text-decoration: none;
    }

    .auth-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .auth-entry-page {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      margin: 0;
      padding: 104px 0 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(245, 246, 242, 0.94)),
        var(--bg);
    }

    .auth-entry-page .auth-layout {
      width: min(500px, calc(100% - 40px));
      min-height: calc(100vh - 104px);
      margin: 0 auto;
      padding: 92px 0 104px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 32px;
    }

    .auth-entry-page .auth-copy .kicker {
      margin-bottom: 14px;
      color: var(--gold);
    }

    .auth-entry-page .auth-copy h1 {
      max-width: none;
      margin: 0 0 18px;
      color: var(--ink);
      font-size: 48px;
      font-weight: 700;
      line-height: 1.06;
    }

    .auth-entry-page .auth-copy p:last-child {
      max-width: none;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
    }

    .auth-entry-page .auth-panel {
      padding: 30px;
      border-radius: 26px;
      border: 1px solid rgba(29, 31, 31, 0.08);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 24px 70px rgba(29, 31, 31, 0.11);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .auth-entry-page .auth-panel > h2,
    .auth-entry-page .auth-panel > .auth-panel-intro {
      display: none;
    }

    .auth-entry-page .auth-form {
      display: grid;
      gap: 18px;
    }

    .auth-entry-page .auth-field {
      display: grid;
      gap: 10px;
    }

    .auth-entry-page .auth-field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .auth-entry-page .auth-field input {
      min-height: 52px;
      padding: 0 18px;
      border-radius: 22px;
      border-color: var(--line);
      background: rgba(250, 250, 247, 0.9);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
    }

    .auth-entry-page .auth-field input:focus {
      border-color: var(--gold);
      background: white;
      box-shadow: 0 0 0 4px rgba(192, 154, 92, 0.14);
    }

    .auth-entry-page .auth-password-wrap {
      position: relative;
      display: block;
    }

    .auth-entry-page .auth-password-wrap input {
      padding-right: 72px;
    }

    .auth-entry-page .auth-password-toggle {
      position: absolute;
      top: 50%;
      right: 18px;
      width: auto;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--gold);
      font-size: 11px;
      transform: translateY(-50%);
    }

    .auth-entry-page .auth-button,
    .auth-entry-page .auth-secondary-button,
    .auth-entry-page .auth-link-button {
      width: 100%;
      min-height: 52px;
      margin-top: 4px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      font-size: 13px;
      font-weight: 800;
    }

    .auth-entry-page .auth-button:hover,
    .auth-entry-page .auth-secondary-button:hover,
    .auth-entry-page .auth-link-button:hover {
      border-color: var(--gold);
      background: var(--gold);
    }

    .auth-entry-page .auth-note,
    .auth-entry-page .auth-message {
      color: var(--muted);
    }

    .auth-entry-page .auth-message.success {
      color: var(--green);
    }

    .auth-entry-page .auth-message.error {
      color: var(--gold);
    }

    .auth-entry-page .auth-panel-footer {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      align-items: center;
      font-size: 14px;
      font-weight: 400;
    }

    .auth-entry-page .auth-panel-footer + .auth-panel-footer {
      margin-top: 0;
      padding-top: 12px;
      border-top: 0;
    }

    .auth-entry-page .auth-panel-footer a,
    .auth-entry-page .auth-panel-footer a:visited {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 0;
      text-transform: none;
    }

    @media (max-width: 860px) {
      .auth-layout {
        grid-template-columns: 1fr;
      }

      .auth-page {
        padding-top: 112px;
      }

      .auth-entry-page {
        padding-top: 88px;
      }

      .auth-entry-page .auth-layout {
        width: min(100% - 40px, 500px);
        min-height: calc(100vh - 88px);
        padding: 54px 0 72px;
      }

      .auth-entry-page .auth-copy h1 {
        font-size: 34px;
      }

      .auth-entry-page .auth-copy p:last-child {
        font-size: 15px;
      }

      .auth-entry-page .auth-panel {
        padding: 22px;
        border-radius: 22px;
      }

      .auth-entry-page .auth-panel-footer {
        justify-content: center;
        text-align: center;
      }
    }

    main.auth-page {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      margin: 0;
      padding-top: 104px;
      background: #2a2b2a;
    }

    .auth-page .auth-section {
      min-height: calc(100vh - 104px);
      padding: 92px 44px 104px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-page .auth-section-inner {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .auth-page .auth-section-header {
      margin-bottom: 34px;
      text-align: left;
    }

    .auth-page .auth-section-title {
      max-width: 620px;
      margin-bottom: 22px;
      color: white;
      font-size: 52px;
      font-weight: bold;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .auth-page .auth-section-intro {
      max-width: 560px;
      margin: 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.8;
    }

    .auth-page .auth-panel {
      padding: 30px;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(24, 25, 24, 0.56);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.22);
    }

    .auth-page .auth-form,
    .auth-two-factor-panel .auth-form {
      display: grid;
      gap: 18px;
    }

    .auth-page .auth-field,
    .auth-two-factor-panel .auth-field {
      display: grid;
      gap: 10px;
    }

    .auth-page .auth-field label,
    .auth-two-factor-panel .auth-field label {
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .auth-page .auth-field input,
    .auth-two-factor-panel .auth-field input {
      width: 100%;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.065);
      color: white;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .auth-page .auth-field input:focus,
    .auth-two-factor-panel .auth-field input:focus {
      background: rgba(255, 255, 255, 0.095);
      border-color: rgba(255, 255, 255, 0.32);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.055);
    }

    .auth-page .auth-password-input-wrap {
      position: relative;
    }

    .auth-page .auth-password-input-wrap input {
      padding-right: 54px;
    }

    .auth-page .auth-password-visibility-toggle {
      position: absolute;
      top: 50%;
      right: 16px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: translateY(-50%);
      transition: opacity 0.2s ease;
    }

    .auth-page .auth-password-visibility-toggle:hover {
      opacity: 0.72;
    }

    .auth-page .auth-password-visibility-toggle svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      display: block;
    }

    .auth-page .auth-password-visibility-toggle::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 12px;
      width: 23px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0;
      transform: rotate(-42deg);
      transform-origin: center;
      transition: opacity 0.18s ease;
    }

    .auth-page .auth-password-visibility-toggle.password-hidden::after {
      opacity: 0.95;
    }

    .auth-page .auth-button,
    .auth-two-factor-panel .auth-button {
      width: 100%;
      min-height: 52px;
      margin-top: 4px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: #d8d7d7;
      color: #111111;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .auth-page .auth-button:hover,
    .auth-two-factor-panel .auth-button:hover {
      background: #cfcfcf;
      border-color: rgba(255, 255, 255, 0.22);
      opacity: 1;
    }

    .auth-page .auth-message,
    .auth-two-factor-panel .auth-message {
      min-height: 22px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }

    .auth-page .auth-message.success,
    .auth-two-factor-panel .auth-message.success {
      color: rgba(185, 255, 202, 0.9);
    }

    .auth-page .auth-message.error,
    .auth-two-factor-panel .auth-message.error {
      color: rgba(255, 156, 156, 0.95);
    }

    .auth-page .auth-panel-footer {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.105);
      color: rgba(255, 255, 255, 0.58);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 14px;
      font-weight: 400;
    }

    .auth-page .auth-panel-footer + .auth-panel-footer {
      margin-top: 0;
      padding-top: 12px;
      border-top: 0;
    }

    .auth-page .auth-panel-footer a,
    .auth-page .auth-panel-footer a:visited {
      color: white;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      text-decoration: none;
    }

    @media (max-width: 900px) {
      main.auth-page {
        padding-top: 88px;
      }

      .auth-page .auth-section {
        min-height: calc(100vh - 88px);
        padding: 54px 20px 72px;
      }

      .auth-page .auth-section-title {
        font-size: 34px;
      }

      .auth-page .auth-section-intro {
        font-size: 15px;
      }

      .auth-page .auth-panel {
        padding: 22px;
        border-radius: 22px;
      }

      .auth-page .auth-panel-footer {
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div id="site-header-root"></div>
  <script src="siteheader.js"></script>

  <main class="auth-page">
    <section class="auth-section">
      <div class="auth-section-inner">
        <div class="auth-section-header">
          <h1 class="auth-section-title">Log In</h1>
          <p class="auth-section-intro">
            Log in to manage your AUC Atlas account, verification, profile, and academic context.
          </p>
        </div>

        <div class="auth-panel">
          <form class="auth-form" id="login-form">
            <div class="auth-field">
              <label for="login-email">Email Address</label>
              <input type="email" id="login-email" autocomplete="email" required>
            </div>

            <div class="auth-field auth-password-field">
              <label for="login-password">Password</label>

              <div class="auth-password-input-wrap">
                <input type="password" id="login-password" autocomplete="current-password" required>

                <button class="auth-password-visibility-toggle password-hidden" type="button" data-target="login-password" aria-label="Show password">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 5C6 5 2.1 9.6 1 12c1.1 2.4 5 7 11 7s9.9-4.6 11-7c-1.1-2.4-5-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2.2a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Z"/>
                  </svg>
                </button>
              </div>
            </div>

            <button class="auth-button" type="submit" id="login-submit">
              Log In
            </button>

            <p class="auth-message" id="login-message" aria-live="polite"></p>
          </form>

          <div class="auth-panel-footer">
            <span>Forgot your password?</span>
            <a href="forgot-password.html">Reset Password</a>
          </div>

          <div class="auth-panel-footer">
            <span>Do not have an account?</span>
            <a href="signup.html">Create Account</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll(".auth-password-visibility-toggle").forEach(function (toggleButton) {
      const targetInput = document.getElementById(toggleButton.getAttribute("data-target"));

      if (!targetInput) {
        return;
      }

      toggleButton.addEventListener("click", function () {
        if (targetInput.type === "password") {
          targetInput.type = "text";
          toggleButton.classList.remove("password-hidden");
          toggleButton.classList.add("password-visible");
          toggleButton.setAttribute("aria-label", "Hide password");
        } else {
          targetInput.type = "password";
          toggleButton.classList.add("password-hidden");
          toggleButton.classList.remove("password-visible");
          toggleButton.setAttribute("aria-label", "Show password");
        }
      });
    });
  </script>
</body>
</html>
