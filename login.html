<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Log In - AUC Atlas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #171717;
    }

    .auth-page {
      min-height: 100vh;
      padding-top: 104px;
      background:
        linear-gradient(180deg, rgba(192, 154, 92, 0.14), rgba(247, 244, 238, 0) 360px),
        #f7f4ee;
    }

    .auth-section {
      min-height: calc(100vh - 104px);
      padding: 92px 44px 104px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-section-inner {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .auth-section-header {
      margin-bottom: 34px;
      text-align: left;
    }

    .auth-section-title {
      max-width: 620px;
      margin-bottom: 22px;
      color: #171717;
      font-size: 52px;
      font-weight: bold;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .auth-section-intro {
      max-width: 560px;
      margin: 0;
      color: rgba(23, 23, 23, 0.66);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.8;
    }

    .auth-panel {
      padding: 30px;
      border-radius: 26px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(255, 255, 255, 0.74);
      box-shadow: 0 22px 55px rgba(42, 32, 20, 0.12);
    }

    .auth-form {
      display: grid;
      gap: 18px;
    }

    .auth-login-options {
      display: grid;
      gap: 12px;
    }

    .auth-field {
      display: grid;
      gap: 10px;
    }

    .auth-field label {
      color: rgba(23, 23, 23, 0.58);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .auth-field input {
      width: 100%;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(23, 23, 23, 0.12);
      background: rgba(255, 255, 255, 0.82);
      color: #171717;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .auth-field input:focus {
      background: white;
      border-color: rgba(192, 154, 92, 0.84);
      box-shadow: 0 0 0 4px rgba(192, 154, 92, 0.13);
    }

    .auth-password-input-wrap {
      position: relative;
    }

    .auth-password-input-wrap input {
      padding-right: 54px;
    }

    .auth-password-visibility-toggle {
      position: absolute;
      top: 50%;
      right: 16px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #6f6f6f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: translateY(-50%);
      transition: opacity 0.2s ease;
    }

    .auth-password-visibility-toggle:hover {
      opacity: 0.72;
    }

    .auth-password-visibility-toggle svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      opacity: 1;
      display: block;
    }

    .auth-password-visibility-toggle::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 12px;
      width: 23px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0;
      transform: rotate(-42deg);
      transform-origin: center;
      transition: opacity 0.18s ease;
    }

    .auth-password-visibility-toggle.password-hidden::after {
      opacity: 1;
    }

    .auth-password-visibility-toggle.password-visible::after {
      opacity: 0;
    }

    .auth-button {
      width: 100%;
      min-height: 52px;
      margin-top: 4px;
      border: 1px solid rgba(192, 154, 92, 0.84);
      border-radius: 999px;
      background: rgba(192, 154, 92, 0.84);
      color: white;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .auth-button:hover {
      background: rgba(171, 132, 70, 0.92);
      border-color: rgba(171, 132, 70, 0.92);
      opacity: 1;
    }

    .auth-button:active {
      transform: translateY(1px);
    }

    .auth-passwordless-button {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(23, 23, 23, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      color: #171717;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        opacity 0.2s ease;
    }

    .auth-passwordless-button:hover {
      background: white;
      border-color: rgba(192, 154, 92, 0.38);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      color: rgba(23, 23, 23, 0.48);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(23, 23, 23, 0.12);
    }

    .auth-message {
      min-height: 22px;
      color: rgba(23, 23, 23, 0.62);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }

    .auth-message.error {
      color: #9d3b3b;
    }

    .auth-panel-footer {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(23, 23, 23, 0.09);
      color: rgba(23, 23, 23, 0.58);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 14px;
      font-weight: 400;
    }

    .auth-panel-footer + .auth-panel-footer {
      margin-top: 0;
      padding-top: 12px;
      border-top: 0;
    }

    .auth-panel-footer a,
    .auth-panel-footer a:visited {
      color: rgba(192, 154, 92, 0.95);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      text-decoration: none;
    }

    .auth-panel-footer a:hover {
      opacity: 0.76;
    }

    @media (max-width: 900px) {
      .auth-page {
        padding-top: 88px;
      }

      .auth-section {
        min-height: calc(100vh - 88px);
        padding: 54px 20px 72px;
      }

      .auth-section-title {
        margin-left: 0;
        margin-right: 0;
        font-size: 34px;
      }

      .auth-section-intro {
        margin: 0;
        font-size: 15px;
      }

      .auth-panel {
        padding: 22px;
        border-radius: 22px;
      }

      .auth-panel-footer {
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div id="site-header-root"></div>
  <script src="site-header.js"></script>

  <main class="auth-page">
    <section class="auth-section">
      <div class="auth-section-inner">
        <div class="auth-section-header">
          <h1 class="auth-section-title">Log In</h1>
          <p class="auth-section-intro">
            Log in to manage your AUC Atlas profile, saved professors, course materials, and student reviews.
          </p>
        </div>

        <div class="auth-panel">
          <form class="auth-form" id="login-form">
            <div class="auth-field">
              <label for="login-email">Email Address</label>
              <input type="email" id="login-email" autocomplete="email">
            </div>

            <div class="auth-field auth-password-field">
              <label for="login-password">Password</label>

              <div class="auth-password-input-wrap">
                <input type="password" id="login-password" autocomplete="current-password">

                <button class="auth-password-visibility-toggle password-hidden" type="button" data-target="login-password" aria-label="Show password">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 5C6 5 2.1 9.6 1 12c1.1 2.4 5 7 11 7s9.9-4.6 11-7c-1.1-2.4-5-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2.2a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Z"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="auth-login-options">
              <button class="auth-button" type="submit" id="login-submit">
                Log In
              </button>

              <div class="auth-divider"><span>or</span></div>

              <button class="auth-passwordless-button" type="button" id="login-passwordless-button">
                Email Me a Sign-In Code
              </button>
            </div>

            <p class="auth-message" id="login-message" aria-live="polite"></p>
          </form>

          <div class="auth-panel-footer">
            <span>Forgot your password?</span>
            <a href="forgot-password.html">Reset Password</a>
          </div>

          <div class="auth-panel-footer">
            <span>Do not have an account?</span>
            <a href="signup.html">Create Account</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const loginForm = document.getElementById("login-form");
    const loginButton = document.getElementById("login-submit");
    const loginMessage = document.getElementById("login-message");
    const passwordVisibilityToggles = document.querySelectorAll(".auth-password-visibility-toggle");
    const passwordlessLoginButton = document.getElementById("login-passwordless-button");
    const loginOptions = loginForm.querySelector(".auth-login-options");
    const loginDivider = loginForm.querySelector(".auth-divider");
    const credentialFields = Array.from(loginForm.querySelectorAll(".auth-field"));

    let awaitingAuthenticatorCode = false;
    let authenticatorCodeField = null;
    let authenticatorCodeInput = null;

    function showMessage(message, type) {
      loginMessage.textContent = message;
      loginMessage.className = "auth-message";

      if (type) {
        loginMessage.classList.add(type);
      }
    }

    function clearLocalSignedInState() {
      try {
        localStorage.removeItem("auc-atlas-signed-in");
        localStorage.removeItem("aucAtlasSignedIn");
      } catch (error) {}

      window.aucAtlasCurrentUser = null;
    }

    function markLocalSignedIn(user) {
      try {
        localStorage.setItem("auc-atlas-signed-in", "1");
        localStorage.setItem("aucAtlasSignedIn", "true");
      } catch (error) {}

      window.aucAtlasCurrentUser = user || null;
    }

    function getLoginRedirectTarget() {
      const savedRedirect = localStorage.getItem("auc-atlas-login-redirect");

      if (savedRedirect) {
        localStorage.removeItem("auc-atlas-login-redirect");
        return savedRedirect;
      }

      return "accounts.html";
    }

    function finishLogin(user) {
      markLocalSignedIn(user);
      showMessage("Logged in successfully.", "success");

      setTimeout(function () {
        window.location.href = getLoginRedirectTarget();
      }, 700);
    }

    function ensureAuthenticatorCodeField() {
      if (authenticatorCodeField) {
        return;
      }

      authenticatorCodeField = document.createElement("div");
      authenticatorCodeField.className = "auth-field";
      authenticatorCodeField.hidden = true;
      authenticatorCodeField.innerHTML = [
        "<label for=\"login-authenticator-code\">Authenticator Code</label>",
        "<input type=\"text\" id=\"login-authenticator-code\" inputmode=\"numeric\" autocomplete=\"one-time-code\" maxlength=\"6\" placeholder=\"Enter 6-digit code\">"
      ].join("");

      loginForm.insertBefore(authenticatorCodeField, loginOptions);
      authenticatorCodeInput = document.getElementById("login-authenticator-code");

      authenticatorCodeInput.addEventListener("input", function () {
        authenticatorCodeInput.value = authenticatorCodeInput.value.replace(/\D/g, "").slice(0, 6);
      });
    }

    function setCredentialFieldsHidden(hidden) {
      credentialFields.forEach(function (field) {
        field.hidden = hidden;

        field.querySelectorAll("input, button").forEach(function (control) {
          control.disabled = hidden;
        });
      });
    }

    function showAuthenticatorStep() {
      clearLocalSignedInState();
      ensureAuthenticatorCodeField();

      awaitingAuthenticatorCode = true;
      setCredentialFieldsHidden(true);

      authenticatorCodeField.hidden = false;
      authenticatorCodeInput.disabled = false;
      authenticatorCodeInput.value = "";

      if (loginDivider) {
        loginDivider.hidden = true;
      }

      if (passwordlessLoginButton) {
        passwordlessLoginButton.disabled = false;
        passwordlessLoginButton.textContent = "Cancel Sign In";
      }

      loginButton.disabled = false;
      loginButton.textContent = "Verify Code";
      showMessage("Enter the 6-digit code from your authenticator app.", "");

      setTimeout(function () {
        authenticatorCodeInput.focus();
      }, 50);
    }

    function resetAuthenticatorStep(message) {
      awaitingAuthenticatorCode = false;
      setCredentialFieldsHidden(false);

      if (authenticatorCodeField) {
        authenticatorCodeField.hidden = true;
        authenticatorCodeInput.disabled = true;
        authenticatorCodeInput.value = "";
      }

      if (loginDivider) {
        loginDivider.hidden = false;
      }

      if (passwordlessLoginButton) {
        passwordlessLoginButton.disabled = false;
        passwordlessLoginButton.textContent = "Email Me a Sign-In Code";
      }

      loginButton.disabled = false;
      loginButton.textContent = "Log In";
      showMessage(message || "", message ? "error" : "");
    }

    async function verifyAuthenticatorLogin() {
      const code = authenticatorCodeInput ? authenticatorCodeInput.value.trim() : "";

      if (!/^\d{6}$/.test(code)) {
        showMessage("Please enter your 6-digit authenticator code.", "error");
        authenticatorCodeInput.focus();
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Verifying...";
      showMessage("", "");

      try {
        const response = await fetch("/api/verify-login-authenticator", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            code: code
          })
        });

        const data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Invalid authenticator code.");
        }

        awaitingAuthenticatorCode = false;
        finishLogin(data.user || null);
      } catch (error) {
        showMessage(error.message || "The authenticator code is incorrect.", "error");
        authenticatorCodeInput.value = "";
        authenticatorCodeInput.focus();
      } finally {
        if (awaitingAuthenticatorCode) {
          loginButton.disabled = false;
          loginButton.textContent = "Verify Code";
        }
      }
    }

    passwordVisibilityToggles.forEach(function (toggleButton) {
      const targetId = toggleButton.getAttribute("data-target");
      const targetInput = document.getElementById(targetId);

      toggleButton.addEventListener("click", function () {
        if (!targetInput) {
          return;
        }

        if (targetInput.type === "password") {
          targetInput.type = "text";
          toggleButton.classList.remove("password-hidden");
          toggleButton.classList.add("password-visible");
          toggleButton.setAttribute("aria-label", "Hide password");
        } else {
          targetInput.type = "password";
          toggleButton.classList.add("password-hidden");
          toggleButton.classList.remove("password-visible");
          toggleButton.setAttribute("aria-label", "Show password");
        }
      });
    });

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (awaitingAuthenticatorCode) {
        await verifyAuthenticatorLogin();
        return;
      }

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Logging In...";
      showMessage("", "");

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });

        const data = await response.json().catch(function () {
          return {};
        });

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Incorrect email or password.");
        }

        if (data.requiresTwoFactor) {
          showAuthenticatorStep();
          return;
        }

        finishLogin(data.user || null);
      } catch (error) {
        clearLocalSignedInState();
        showMessage(error.message || "Something went wrong. Please try again.", "error");
      } finally {
        if (!awaitingAuthenticatorCode) {
          loginButton.disabled = false;
          loginButton.textContent = "Log In";
        }
      }
    });

    passwordlessLoginButton.addEventListener("click", function () {
      if (awaitingAuthenticatorCode) {
        resetAuthenticatorStep("Sign in cancelled.");
        return;
      }

      showMessage("Email sign-in codes are not connected yet.", "error");
    });
  </script>
</body>
</html>
