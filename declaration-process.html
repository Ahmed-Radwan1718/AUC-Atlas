<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Major Declaration Process | AUC Atlas</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f7f4ee;color:#171717}.declaration-page{min-height:100vh;padding:126px 0 86px;background:linear-gradient(180deg,rgba(192,154,92,.14),rgba(247,244,238,0) 360px),#f7f4ee}.declaration-inner{width:min(1180px,calc(100% - 32px));margin:0 auto}.declaration-header{margin-bottom:34px;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,420px);gap:28px;align-items:end}.declaration-kicker{margin-bottom:16px;color:rgba(192,154,92,.84);font-size:12px;font-weight:800;letter-spacing:.14em;line-height:1.4;text-transform:uppercase}.declaration-header h1{max-width:760px;color:#171717;font-size:clamp(34px,4.8vw,58px);font-weight:700;line-height:1.08;text-transform:uppercase}.declaration-header p{color:rgba(23,23,23,.66);font-size:17px;line-height:1.7}.declaration-tools{margin-bottom:18px;padding:14px;border:1px solid rgba(23,23,23,.1);border-radius:24px;background:rgba(255,255,255,.76);box-shadow:0 20px 54px rgba(42,32,20,.1);display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;overflow:visible}.declaration-tools input{min-height:48px;width:100%;padding:0 16px;border:1px solid rgba(23,23,23,.1);border-radius:999px;background:rgba(247,244,238,.74);color:#171717;font:inherit;font-size:14px;font-weight:700;outline:none}.declaration-tools input:focus{border-color:rgba(192,154,92,.58);background:#fff;box-shadow:0 0 0 4px rgba(192,154,92,.12)}.declaration-school-choice{position:relative;z-index:10}.declaration-school-choice.is-open{z-index:40}.declaration-school-button{min-height:48px;width:100%;padding:0 16px;border:1px solid rgba(23,23,23,.1);border-radius:999px;background:rgba(247,244,238,.74);color:#171717;font:inherit;font-size:14px;font-weight:700;outline:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;transition:border-color .2s ease,background .2s ease,box-shadow .2s ease,transform .18s ease}.declaration-school-button::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s ease;flex:0 0 9px;margin-top:-4px}.declaration-school-choice.is-open .declaration-school-button::after{transform:rotate(225deg);margin-top:4px}.declaration-school-button:hover,.declaration-school-button:focus-visible,.declaration-school-choice.is-open .declaration-school-button{border-color:rgba(192,154,92,.58);background:#fff;box-shadow:0 0 0 4px rgba(192,154,92,.12)}.declaration-school-menu{position:absolute;z-index:30;top:calc(100% + 8px);left:0;right:0;max-height:260px;padding:6px;overflow-y:auto;border:1px solid rgba(23,23,23,.1);border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 18px 44px rgba(42,32,20,.16);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;gap:4px;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-6px) scale(.98);transform-origin:top;transition:opacity .18s ease,visibility .18s ease,transform .2s cubic-bezier(.22,1,.36,1)}.declaration-school-choice.is-open .declaration-school-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1)}.declaration-school-option{min-height:38px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:rgba(23,23,23,.72);font:inherit;font-size:13px;font-weight:700;text-align:left;cursor:pointer;transition:background .18s ease,color .18s ease,transform .18s ease}.declaration-school-option:hover,.declaration-school-option:focus-visible{background:rgba(192,154,92,.1);color:#171717;outline:none}.declaration-school-option.is-active{background:rgba(192,154,92,.16);color:#171717}.declaration-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.declaration-card{padding:22px;border:1px solid rgba(23,23,23,.1);border-radius:24px;background:rgba(255,255,255,.78);box-shadow:0 20px 54px rgba(42,32,20,.1);display:grid;gap:14px}.declaration-card-head{display:grid;gap:6px}.declaration-school{color:rgba(192,154,92,.92);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.declaration-card h2{color:#171717;font-size:22px;line-height:1.16}.declaration-card ul{padding-left:18px;display:grid;gap:8px}.declaration-card li,.declaration-empty,.declaration-source{color:rgba(23,23,23,.64);font-size:14px;line-height:1.65}.declaration-source{margin-top:18px}.declaration-source a{color:#171717;font-weight:800}.declaration-empty{grid-column:1/-1;padding:22px;border:1px dashed rgba(23,23,23,.16);border-radius:22px;background:rgba(255,255,255,.56);text-align:center}@media(max-width:820px){.declaration-header,.declaration-tools,.declaration-grid{grid-template-columns:1fr}.declaration-page{padding-top:104px}.declaration-header{gap:14px}}
  </style>
</head>
<body>
  <div id="site-header-root"></div>
  <script src="site-header.js"></script>

  <main class="declaration-page">
    <div class="declaration-inner">
      <section class="declaration-header">
        <div>
          <p class="declaration-kicker">Academic planning</p>
          <h1>Major declaration process</h1>
        </div>
        <p>Declaration requirements summarized from the AUC 2025-2026 Academic Catalog. Always confirm final eligibility with the official catalog and your advisor.</p>
      </section>

      <section class="declaration-tools" aria-label="Declaration filters">
        <input id="declaration-search" type="search" placeholder="Search majors, courses, grades, or schools">
        <div class="declaration-school-choice" id="declaration-school-choice">
          <button class="declaration-school-button" id="declaration-school-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="declaration-school-menu">All schools</button>
          <div class="declaration-school-menu" id="declaration-school-menu" role="listbox" aria-label="Filter by school"></div>
        </div>
      </section>

      <section class="declaration-grid" id="declaration-grid" aria-live="polite"></section>
      <p class="declaration-source">Source: <a href="https://catalog.aucegypt.edu/index.php?catoid=44" target="_blank" rel="noopener">AUC 2025-2026 Academic Catalog</a>.</p>
    </div>
  </main>

  <script>
    const sharedSsePolicy = ["Students may be admitted to the major at the gate or enter AUC as undeclared.","Students must declare a major before completing 60 credit hours.","At-gate and from-within eligibility criteria are published through the official catalog links for Fall 2026 and Spring 2027 declaration.","Admission depends on the program's student capacity."];
    const declarationPrograms = [
      {school:"Business",name:"Accounting (B.A.C.)",requirements:["Complete at least 27 credits before applying.","Required courses: ACCT 2001 with minimum B; ACCT 2002 with minimum B; ECON 2011 or ECON 2021; MACT 2222.","Weighted GPA: 60% overall GPA at declaration + 40% average GPA in ACCT 2001 and ACCT 2002.","Admission is competitive and may use weighted GPA, relevant factors, personal statements, and/or interviews.","Accounting majors cannot minor in Business Administration."]},
      {school:"Business",name:"Economics (B.A.)",requirements:["Complete at least 27 credits including ECON 2011, ECON 2021, and ECON 2061.","Earn an average of B or higher in ECON 2011 and ECON 2021, with at least B- in each.","Earn at least B in ECON 2061, or at least B in MACT 1121 as the equivalent.","For a second attempt, the higher grade is used; third attempts and beyond do not count for declaration.","Declaration score: 50% Economics GPA + 50% overall GPA."]},
      {school:"Business",name:"Management of Information and Communication Technology (MICT)",requirements:["Complete at least 27 credits before applying.","Required courses: CSCE 1001, MACT 2222, and MOIS 2101.","Admission is competitive.","Ranking uses 50% overall GPA + 50% average GPA in CSCE 1001, MACT 2222, and MOIS 2101."]},
      {school:"Business",name:"Business and Entrepreneurship (B.B.E.)",requirements:["Apply in the third semester after completing at least 27 credits.","Required courses: ACCT 2001, BADM 2001, ECON 2011 or ECON 2021, and MACT 2222.","Selection uses a 50% major GPA + 50% overall GPA declaration score.","The major GPA requires at least 12 credits of business-major-related courses and includes completed business major and collateral courses.","Personal statements and/or interviews may be used."]},
      {school:"Business",name:"Business in Finance (B.B.F.)",requirements:["Apply in the third semester after completing at least 27 credits.","Required courses: ACCT 2001, BADM 2001, ECON 2011 or ECON 2021, and MACT 2222.","Selection uses an equal weighted score between overall GPA and major GPA.","Major GPA includes completed business major and collateral courses.","Personal statements and/or interviews may be used."]},
      {school:"Business",name:"Business in Marketing (B.B.M.)",requirements:["Apply in the third semester after completing at least 27 credits.","Required courses: ACCT 2001, BADM 2001, ECON 2011 or ECON 2021, and MACT 2222.","Declaration GPA: 50% major GPA + 50% overall GPA.","Major GPA requires at least 12 credits of business-major-related courses.","Personal statements and/or interviews may be used."]},
      {school:"Global Affairs and Public Policy",name:"Integrated Marketing Communication (B.A.)",requirements:["Complete 24 credits of university coursework.","Complete RHET 1020 with B or better.","Complete JRMC 2200 with B or better.","Pass the English Proficiency Test with at least 75%.","Admission is competitive and eligible students are ranked by cumulative GPA.","IMC and MMCJ cannot be combined as majors."]},
      {school:"Global Affairs and Public Policy",name:"Multimedia Communication and Journalism (B.A.)",requirements:["Complete 24 credits of university coursework.","Complete RHET 1020 with B or better.","Complete JRMC 2200 with B or better.","Pass the English Proficiency Test with at least 75%.","Admission is competitive and eligible students are ranked by cumulative GPA.","MMCJ and IMC cannot be combined as majors."]},
      {school:"Global Affairs and Public Policy",name:"Middle East Studies (B.A.)",requirements:["Minimum GPA of 2.7 is required to declare the major.","Minimum GPA of 2.7 is also required to maintain the major."]},
      {school:"Humanities and Social Sciences",name:"Arabic Studies (B.A.)",requirements:["Earn B or higher in one ARIC course before declaring."]},
      {school:"Humanities and Social Sciences",name:"English and Comparative Literature (B.A.)",requirements:["Earn at least C in one ECLT course.","Register for the required program of the major."]},
      {school:"Humanities and Social Sciences",name:"History (B.A.)",requirements:["Pass HIST 1000 before declaring."]},
      {school:"Humanities and Social Sciences",name:"Philosophy (B.A.)",requirements:["Earn at least C in one PHIL course before declaring."]},
      {school:"Humanities and Social Sciences",name:"Political Science (B.A.)",requirements:["Minimum overall GPA of 2.7.","B average in POLS 1001 or POLS 2003 and POLS 2104 or POLS 2405, with at least C+ in each course used for declaration.","If transferred credits replace POLS 1001, earn a B+ average in POLS 2104 and POLS 2405, with at least B in each.","Earn at least B in RHET 1020.","If POLS 1001 is not taken in the freshman year, students intending to major in Political Science must take POLS 2003 after freshman year."]},
      {school:"Humanities and Social Sciences",name:"Psychology (B.A.)",requirements:["Complete PSYC 1000 with B or higher.","Successfully complete or be currently enrolled in PSYC 2000.","Admission is competitive and uses discipline-relevant factors, including PSYC 1000, PSYC 2000, and GPA."]},
      {school:"Humanities and Social Sciences",name:"Anthropology (B.A.)",requirements:["Earn at least B in ANTH 2101.","Minimum overall GPA of 2.3 at declaration.","Complete a successful interview with the unit head."]},
      {school:"Humanities and Social Sciences",name:"Egyptology (B.A.)",requirements:["Earn at least B- in an Egyptology course such as EGPT 2020.","Submit a writing sample to Egyptology faculty.","Complete a personal interview before declaration.","The writing sample should show language ability suitable for Egyptology work."]},
      {school:"Humanities and Social Sciences",name:"Sociology (B.A.)",requirements:["Pass SOC 2101 with at least B.","Continue in the major by maintaining at least 2.5 GPA in concentration requirements.","Take SOC 4107 in the final full academic year."]},
      {school:"Arts",name:"Film (B.A.)",requirements:["Earn at least B in FILM 2120.","Earn at least B in FILM 2121 or FILM 2123.","Complete a portfolio-based interview.","If the first interview is not passed, a second interview is allowed after completing a third introductory required course from FILM 2121 or FILM 2123 with at least B.","The second interview decision is final."]},
      {school:"Arts",name:"Graphic Design (B.A.)",requirements:["Earn at least C+ in DSGN 2200 and DSGN 2113.","Complete a portfolio interview after those two courses.","Admission depends on space and portfolio promise as determined by the department.","If the interview is not passed, a second interview is allowed after DSGN 2201 and DSGN 2115.","After a second rejection, the student cannot declare Graphic Design as a major but can register for Graphic Design minors."]},
      {school:"Arts",name:"Music (B.A.)",requirements:["Complete MUSC 2200 and MUSC 2300 to declare Music.","After admission to the major, Music Technology students submit a portfolio.","After admission to the major, Music Performance students complete an audition and interview."]},
      {school:"Arts",name:"Theatre (B.A.)",requirements:["The 2025-2026 catalog extract does not list a separate Theatre declaration policy.","Confirm declaration steps with the Department of the Arts or your academic advisor."]},
      {school:"Arts",name:"Visual Arts (B.A.)",requirements:["Complete ARTV 2200 and ARTV 2113.","Complete two additional Visual Arts studio courses.","Final recommendation is made after an interview and portfolio review by Visual Arts faculty.","Students may apply to the major at most two times.","The declaration process takes place twice each year."]}
    ];
    ["Architecture (B.Arch.)","Biology (B.Sc.)","Chemistry (B.S.)","Computer Engineering (B.S.)","Computer Science (B.S.)","Construction Engineering (B.S.)","Electronics and Communications Engineering (B.S.)","Actuarial Science (B.S.)","Data Science (B.Sc.)","Mathematics (B.S.)","Mechanical Engineering (B.S.)","Petroleum Engineering (B.S.)","Physics (B.S.)"].forEach(function(name){declarationPrograms.push({school:"Sciences and Engineering",name:name,requirements:sharedSsePolicy});});
    const grid=document.getElementById("declaration-grid");const searchInput=document.getElementById("declaration-search");const schoolChoice=document.getElementById("declaration-school-choice");const schoolButton=document.getElementById("declaration-school-button");const schoolMenu=document.getElementById("declaration-school-menu");let selectedSchool="all";
    const schools=[...new Set(declarationPrograms.map(function(program){return program.school;}))].sort();function addSchoolOption(value,label,isActive){const option=document.createElement("button");option.className="declaration-school-option"+(isActive?" is-active":"");option.type="button";option.setAttribute("role","option");option.setAttribute("aria-selected",String(Boolean(isActive)));option.dataset.schoolValue=value;option.textContent=label;option.addEventListener("click",function(){setSchool(value,label);});schoolMenu.appendChild(option);}addSchoolOption("all","All schools",true);schools.forEach(function(school){addSchoolOption(school,school,false);});
    function clean(value){return String(value||"").toLowerCase();}
    function escapeHTML(value){return String(value||"").replace(/[&<>"']/g,function(char){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char];});}
    function closeSchoolMenu(){schoolChoice.classList.remove("is-open");schoolButton.setAttribute("aria-expanded","false");}
    function setSchool(value,label){selectedSchool=value;schoolButton.textContent=label;schoolMenu.querySelectorAll(".declaration-school-option").forEach(function(option){const active=option.dataset.schoolValue===value;option.classList.toggle("is-active",active);option.setAttribute("aria-selected",String(active));});closeSchoolMenu();renderDeclarations();}
    function renderDeclarations(){const query=clean(searchInput.value);const school=selectedSchool;const filtered=declarationPrograms.filter(function(program){const haystack=clean([program.school,program.name].concat(program.requirements).join(" "));return (school==="all"||program.school===school)&&(!query||haystack.includes(query));});grid.innerHTML=filtered.length?filtered.map(function(program){return `<article class="declaration-card"><div class="declaration-card-head"><span class="declaration-school">${escapeHTML(program.school)}</span><h2>${escapeHTML(program.name)}</h2></div><ul>${program.requirements.map(function(item){return `<li>${escapeHTML(item)}</li>`;}).join("")}</ul></article>`;}).join(""):`<p class="declaration-empty">No declaration requirements match this search.</p>`;}
    schoolButton.addEventListener("click",function(){const open=!schoolChoice.classList.contains("is-open");schoolChoice.classList.toggle("is-open",open);schoolButton.setAttribute("aria-expanded",String(open));});document.addEventListener("click",function(event){if(!schoolChoice.contains(event.target)){closeSchoolMenu();}});document.addEventListener("keydown",function(event){if(event.key==="Escape"){closeSchoolMenu();}});searchInput.addEventListener("input",renderDeclarations);renderDeclarations();
  </script>
</body>
</html>
