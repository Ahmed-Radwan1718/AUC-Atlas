<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <base href="/">

  <title>Page Not Found | AUC Atlas</title>

  <meta
    name="description"
    content="The page you were looking for could not be found on AUC Atlas."
  >
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #171717;
    }

    .error-page {
      min-height: 100vh;
      padding: 126px 0 86px;
      background:
        linear-gradient(
          180deg,
          rgba(192, 154, 92, 0.14),
          rgba(247, 244, 238, 0) 360px
        ),
        #f7f4ee;
    }

    .error-inner {
      width: min(1680px, calc(100% - 32px));
      margin: 0 auto;
    }

    .error-card {
      min-height: 440px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 28px;
      align-items: stretch;
    }

    .error-content {
      grid-column: 2;
      grid-row: 1;
      min-height: 440px;
      padding: clamp(34px, 5vw, 64px);
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 24px 70px rgba(42, 32, 20, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .error-kicker {
      margin-bottom: 16px;
      color: rgba(192, 154, 92, 0.84);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .error-content h1 {
      max-width: 640px;
      color: #171717;
      font-size: clamp(26px, 3vw, 40px);
      font-weight: 700;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .error-copy {
      max-width: 640px;
      margin-top: 18px;
      color: rgba(23, 23, 23, 0.66);
      font-size: 17px;
      font-weight: 400;
      line-height: 1.7;
    }

    .error-path {
      max-width: 100%;
      margin-top: 24px;
      padding: 13px 16px;
      border: 1px solid rgba(23, 23, 23, 0.08);
      border-radius: 16px;
      background: rgba(247, 244, 238, 0.74);
      color: rgba(23, 23, 23, 0.56);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.55;
    }

    .error-path code {
      color: rgba(126, 90, 34, 0.96);
      font-family: Arial, sans-serif;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .error-actions {
      margin-top: 30px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .error-button {
      min-height: 50px;
      padding: 0 21px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 999px;
      color: #171717;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-decoration: none;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .error-button-primary {
      border-color: rgba(192, 154, 92, 0.88);
      background: rgba(192, 154, 92, 0.88);
      color: #ffffff;
    }

    .error-button-secondary {
      background: rgba(255, 255, 255, 0.62);
    }

    .error-button:hover,
    .error-button:focus-visible {
      outline: none;
      border-color: #171717;
      background: #171717;
      color: #ffffff;
      box-shadow: 0 14px 34px rgba(42, 32, 20, 0.16);
      transform: translateY(-2px);
    }

    .error-visual {
      position: relative;
      grid-column: 1;
      grid-row: 1;
      min-height: 440px;
      overflow: hidden;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 26px;
      background:
        radial-gradient(
          circle at 50% 46%,
          rgba(192, 154, 92, 0.2),
          rgba(192, 154, 92, 0.04) 42%,
          transparent 68%
        ),
        rgba(255, 255, 255, 0.72);
      box-shadow: 0 22px 55px rgba(42, 32, 20, 0.1);
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .error-number {
      position: relative;
      z-index: 3;
      color: #171717;
      font-size: clamp(82px, 9vw, 126px);
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: -0.09em;
      user-select: none;
    }

    .error-number span {
      color: rgba(192, 154, 92, 0.94);
    }

    .error-orbit {
      position: absolute;
      z-index: 1;
      width: min(74%, 390px);
      aspect-ratio: 1;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 50%;
      animation: errorOrbitRotate 18s linear infinite;
    }

    .error-orbit::before,
    .error-orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(192, 154, 92, 0.96);
      box-shadow: 0 10px 24px rgba(42, 32, 20, 0.16);
    }

    .error-orbit::before {
      top: 8%;
      left: 17%;
      width: 14px;
      height: 14px;
    }

    .error-orbit::after {
      right: 3%;
      bottom: 28%;
      width: 9px;
      height: 9px;
    }

    .error-orbit-secondary {
      position: absolute;
      z-index: 0;
      width: min(52%, 275px);
      aspect-ratio: 1;
      border: 1px dashed rgba(192, 154, 92, 0.38);
      border-radius: 50%;
      animation: errorOrbitRotateReverse 14s linear infinite;
    }

    .error-marker {
      position: absolute;
      z-index: 4;
      bottom: 22%;
      left: 50%;
      width: 54px;
      height: 54px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      border-radius: 18px;
      background:
        url("logo.svg") center / 28px no-repeat,
        rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 44px rgba(42, 32, 20, 0.16);
      transform: translateX(-50%) rotate(-7deg);
      animation: errorMarkerFloat 3.6s ease-in-out infinite;
    }

    .error-grid {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.45;
      background-image:
        linear-gradient(
          rgba(23, 23, 23, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(23, 23, 23, 0.035) 1px,
          transparent 1px
        );
      background-size: 34px 34px;
      mask-image:
        radial-gradient(
          circle at center,
          black,
          transparent 76%
        );
      -webkit-mask-image:
        radial-gradient(
          circle at center,
          black,
          transparent 76%
        );
    }

    @keyframes errorOrbitRotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes errorOrbitRotateReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes errorMarkerFloat {
      0%,
      100% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(-7deg);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-10px)
          rotate(4deg);
      }
    }

    @media (max-width: 900px) {
      .error-page {
        padding-top: 104px;
      }

      .error-card {
        min-height: 0;
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .error-content {
        grid-column: 1;
        grid-row: 1;
        min-height: 0;
      }

      .error-visual {
        grid-column: 1;
        grid-row: 2;
        min-height: 320px;
      }
    }

    @media (max-width: 640px) {
      .error-page {
        padding: 94px 0 60px;
      }

      .error-card {
        gap: 16px;
      }

      .error-content {
        padding: 30px 22px 34px;
        border-radius: 22px;
      }

      .error-copy {
        font-size: 15px;
      }

      .error-actions {
        width: 100%;
      }

      .error-button {
        width: 100%;
      }

      .error-visual {
        min-height: 260px;
        border-radius: 22px;
      }

      .error-number {
        font-size: 100px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .error-orbit,
      .error-orbit-secondary,
      .error-marker {
        animation: none;
      }

      .error-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div id="site-header-root"></div>
  <script src="site-header.js"></script>

  <main class="error-page">
    <div class="error-inner">
      <section class="error-card" aria-labelledby="error-title">
        <div class="error-content">
          <p class="error-kicker">Page not found</p>

          <h1 id="error-title">
            This page went off course.
          </h1>

          <p class="error-copy">
            The address may be incorrect, the page may have moved,
            or the content may no longer be available.
          </p>

          <p class="error-path">
            Requested address:
            <code id="missing-page-path">Unknown page</code>
          </p>

          <div class="error-actions">
            <a class="error-button error-button-primary" href="/">
              Back to home
            </a>

            <a class="error-button error-button-secondary" href="/courses">
              Browse courses
            </a>

            <a class="error-button error-button-secondary" href="/professors">
              Find professors
            </a>
          </div>
        </div>

        <div class="error-visual" aria-hidden="true">
          <div class="error-grid"></div>

          <div class="error-number">
            4<span>0</span>4
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      const missingPagePath =
        document.getElementById("missing-page-path");

      if (!missingPagePath) {
        return;
      }

      const requestedAddress =
        window.location.pathname +
        window.location.search;

      missingPagePath.textContent =
        requestedAddress || "/";
    })();
  </script>
</body>
</html>
