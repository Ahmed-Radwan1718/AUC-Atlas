<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | AUC Atlas</title>
  <meta name="description" content="Reset your AUC Atlas password." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div id="site-header-root"></div>
  <script src="siteheader.js"></script>

  <main class="auth-page">
    <section class="auth-layout">
      <div class="auth-copy">
        <p class="kicker">Account recovery</p>
        <h1>Reset password</h1>
        <p>Enter your account email and Firebase will send a password reset link through the server route.</p>
      </div>

      <div class="auth-panel">
        <h2>Password reset</h2>
        <p class="auth-panel-intro">Use the email address connected to your AUC Atlas account.</p>

        <form class="auth-form" id="forgot-password-form">
          <div class="auth-field">
            <label for="reset-email">Email address</label>
            <input type="email" id="reset-email" autocomplete="email" required>
          </div>

          <button class="auth-button" type="submit" id="reset-submit">Send reset link</button>
          <p class="auth-message" id="reset-message" aria-live="polite"></p>
        </form>

        <div class="auth-panel-footer">
          <span>Remembered it?</span>
          <a href="login.html">Log in</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer-root"></div>
  <script src="footer.js"></script>
  <script src="auth.js"></script>
</body>
</html>
