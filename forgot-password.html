<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Forgot Password - AUC Atlas</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #171717;
    }

    .auth-page {
      min-height: 100vh;
      padding-top: 104px;
      background:
        linear-gradient(180deg, rgba(192, 154, 92, 0.14), rgba(247, 244, 238, 0) 360px),
        #f7f4ee;
    }

    .auth-section {
      min-height: calc(100vh - 104px);
      padding: 92px 44px 104px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-section-inner { width: 100%; max-width: 500px; margin: 0 auto; }
    .auth-section-header { margin-bottom: 34px; text-align: left; }

    .auth-section-eyebrow {
      margin-bottom: 16px;
      color: rgba(192, 154, 92, 0.84);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .auth-section-title {
      max-width: 620px;
      margin-bottom: 22px;
      color: #171717;
      font-size: 52px;
      font-weight: bold;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .auth-section-intro {
      max-width: 560px;
      color: rgba(23, 23, 23, 0.66);
      font-size: 17px;
      line-height: 1.8;
    }

    .auth-panel {
      padding: 30px;
      border-radius: 26px;
      border: 1px solid rgba(23, 23, 23, 0.1);
      background: rgba(255, 255, 255, 0.74);
      box-shadow: 0 22px 55px rgba(42, 32, 20, 0.12);
    }

    .auth-form { display: grid; gap: 18px; }
    .auth-field { display: grid; gap: 10px; }

    .auth-field label {
      color: rgba(23, 23, 23, 0.58);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .auth-field input {
      width: 100%;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(23, 23, 23, 0.12);
      background: rgba(255, 255, 255, 0.82);
      color: #171717;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .auth-field input:focus {
      background: white;
      border-color: rgba(192, 154, 92, 0.84);
      box-shadow: 0 0 0 4px rgba(192, 154, 92, 0.13);
    }

    .auth-button {
      width: 100%;
      min-height: 52px;
      margin-top: 4px;
      border: 1px solid rgba(192, 154, 92, 0.84);
      border-radius: 999px;
      background: rgba(192, 154, 92, 0.84);
      color: white;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .auth-button:hover {
      background: rgba(171, 132, 70, 0.92);
      border-color: rgba(171, 132, 70, 0.92);
    }

    .auth-message {
      min-height: 22px;
      color: rgba(23, 23, 23, 0.62);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }

    .auth-message.error { color: #9d3b3b; }

    .auth-panel-footer {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(23, 23, 23, 0.09);
      color: rgba(23, 23, 23, 0.58);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .auth-panel-footer + .auth-panel-footer {
      margin-top: 0;
      padding-top: 12px;
      border-top: 0;
    }

    .auth-panel-footer a,
    .auth-panel-footer a:visited {
      color: rgba(192, 154, 92, 0.95);
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 900px) {
      .auth-page { padding-top: 88px; }
      .auth-section { min-height: calc(100vh - 88px); padding: 54px 20px 72px; }
      .auth-section-title { font-size: 34px; }
      .auth-section-intro { font-size: 15px; }
      .auth-panel { padding: 22px; border-radius: 22px; }
      .auth-panel-footer { justify-content: center; text-align: center; }
    }
  </style>
</head>

<body>
  <div id="site-header-root"></div>
  <script src="site-header.js"></script>

  <main class="auth-page">
    <section class="auth-section">
      <div class="auth-section-inner">
        <div class="auth-section-header">
          <p class="auth-section-eyebrow">Account Recovery</p>
          <h1 class="auth-section-title">Forgot Password</h1>
          <p class="auth-section-intro">
            Enter your account email address and we will send you a password reset link.
          </p>
        </div>

        <div class="auth-panel">
          <form class="auth-form" id="forgot-password-form">
            <div class="auth-field">
              <label for="reset-email">Email Address</label>
              <input type="email" id="reset-email" autocomplete="email">
            </div>

            <button class="auth-button" type="submit" id="reset-submit">
              Send Reset Link
            </button>

            <p class="auth-message" id="reset-message" aria-live="polite"></p>
          </form>

          <div class="auth-panel-footer">
            <span>Remembered your password?</span>
            <a href="login.html">Log in</a>
          </div>

          <div class="auth-panel-footer">
            <span>Do not have an account?</span>
            <a href="signup.html">Create one</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const forgotPasswordForm = document.getElementById("forgot-password-form");
    const resetMessage = document.getElementById("reset-message");

    function showNonFunctionalMessage() {
      resetMessage.textContent = "Password reset is not connected yet.";
      resetMessage.className = "auth-message error";
    }

    forgotPasswordForm.addEventListener("submit", function (event) {
      event.preventDefault();
      showNonFunctionalMessage();
    });
  </script>
</body>
</html>
