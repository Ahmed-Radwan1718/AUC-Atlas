<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | AUC Atlas</title>
  <meta name="description" content="Reset your AUC Atlas password." />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-page {
      padding: 128px 0 90px;
    }

    .auth-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(340px, 0.5fr);
      gap: 34px;
      align-items: start;
    }

    .auth-copy h1 {
      max-width: 720px;
      margin: 0 0 18px;
      font-size: clamp(2.2rem, 4vw, 4rem);
      font-weight: 700;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .auth-copy p:last-child {
      max-width: 620px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .auth-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .auth-panel h2 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.12;
    }

    .auth-panel-intro {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }

    .auth-panel-footer {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-panel-footer a {
      color: var(--gold);
      font-weight: 800;
      text-decoration: none;
    }

    .auth-entry-page {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      margin: 0;
      padding: 104px 0 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(245, 246, 242, 0.94)),
        var(--bg);
    }

    .auth-entry-page .auth-layout {
      width: min(500px, calc(100% - 40px));
      min-height: calc(100vh - 104px);
      margin: 0 auto;
      padding: 92px 0 104px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 32px;
    }

    .auth-entry-page .auth-copy .kicker {
      margin-bottom: 14px;
      color: var(--gold);
    }

    .auth-entry-page .auth-copy h1 {
      max-width: none;
      margin: 0 0 18px;
      color: var(--ink);
      font-size: 48px;
      font-weight: 700;
      line-height: 1.06;
    }

    .auth-entry-page .auth-copy p:last-child {
      max-width: none;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
    }

    .auth-entry-page .auth-panel {
      padding: 30px;
      border-radius: 26px;
      border: 1px solid rgba(29, 31, 31, 0.08);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 24px 70px rgba(29, 31, 31, 0.11);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .auth-entry-page .auth-panel > h2,
    .auth-entry-page .auth-panel > .auth-panel-intro {
      display: none;
    }

    .auth-entry-page .auth-form {
      gap: 18px;
    }

    .auth-entry-page .auth-field {
      gap: 10px;
    }

    .auth-entry-page .auth-field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .auth-entry-page .auth-field input {
      min-height: 52px;
      padding: 0 18px;
      border-radius: 22px;
      border-color: var(--line);
      background: rgba(250, 250, 247, 0.9);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
    }

    .auth-entry-page .auth-field input:focus {
      border-color: var(--gold);
      background: white;
      box-shadow: 0 0 0 4px rgba(192, 154, 92, 0.14);
    }

    .auth-entry-page .auth-button {
      width: 100%;
      min-height: 52px;
      margin-top: 4px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      font-size: 13px;
      font-weight: 800;
    }

    .auth-entry-page .auth-button:hover {
      border-color: var(--gold);
      background: var(--gold);
    }

    .auth-entry-page .auth-message {
      color: var(--muted);
    }

    .auth-entry-page .auth-message.success {
      color: var(--green);
    }

    .auth-entry-page .auth-message.error {
      color: var(--gold);
    }

    .auth-entry-page .auth-panel-footer {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      align-items: center;
      font-size: 14px;
      font-weight: 400;
    }

    .auth-entry-page .auth-panel-footer + .auth-panel-footer {
      margin-top: 0;
      padding-top: 12px;
      border-top: 0;
    }

    .auth-entry-page .auth-panel-footer a,
    .auth-entry-page .auth-panel-footer a:visited {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 0;
      text-transform: none;
    }

    @media (max-width: 860px) {
      .auth-layout {
        grid-template-columns: 1fr;
      }

      .auth-page {
        padding-top: 112px;
      }

      .auth-entry-page {
        padding-top: 88px;
      }

      .auth-entry-page .auth-layout {
        width: min(100% - 40px, 500px);
        min-height: calc(100vh - 88px);
        padding: 54px 0 72px;
      }

      .auth-entry-page .auth-copy h1 {
        font-size: 34px;
      }

      .auth-entry-page .auth-copy p:last-child {
        font-size: 15px;
      }

      .auth-entry-page .auth-panel {
        padding: 22px;
        border-radius: 22px;
      }

      .auth-entry-page .auth-panel-footer {
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div id="site-header-root"></div>
  <script src="siteheader.js"></script>

  <main class="auth-page auth-entry-page">
    <section class="auth-layout">
      <div class="auth-copy">
        <p class="kicker">Account recovery</p>
        <h1>Reset password</h1>
        <p>Enter your account email and Firebase will send a password reset link through the server route.</p>
      </div>

      <div class="auth-panel">
        <h2>Password reset</h2>
        <p class="auth-panel-intro">Use the email address connected to your AUC Atlas account.</p>

        <form class="auth-form" id="forgot-password-form">
          <div class="auth-field">
            <label for="reset-email">Email address</label>
            <input type="email" id="reset-email" autocomplete="email" required>
          </div>

          <button class="auth-button" type="submit" id="reset-submit">Send reset link</button>
          <p class="auth-message" id="reset-message" aria-live="polite"></p>
        </form>

        <div class="auth-panel-footer">
          <span>Remembered it?</span>
          <a href="login.html">Log in</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
