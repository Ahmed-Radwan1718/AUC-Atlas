name: One-shot professor image update 15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-professor-images-temp-15.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update exact professor records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('data/professor-data.js')
          lines = path.read_text().splitlines(keepends=True)
          updates = {
            "hassanein-amer": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793731412/b290248f-744c-43f3-9a1c-7c48b90027ff.png"
            },
            "hatem-tallima": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793731567/400cf43d-65c1-40d4-8b96-14cfacfc57cd.png"
            },
            "heba-kotb": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793731611/d4074f57-eb98-425d-99d9-2f8660b137bc.png"
            },
            "hoda-el-kolaly": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793731782/164e7853-e786-4306-8f99-9faa2d523c2e.png",
              "department": "Management",
              "displayDepartment": "MGMT",
              "filterDepartment": "Business"
            },
            "ian-morrison": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793731862/a968cff7-9d84-474f-9baa-9c59ab783667.png"
            },
            "ibrahim-elnur": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793731924/215e3966-c820-4c60-b0e6-45af3170226e.png"
            }
          }
          for professor_id, fields in updates.items():
              marker = f'id: "{professor_id}"'
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one match for {professor_id}, found {len(matches)}')
              i = matches[0]
              line = lines[i]
              for field, value in fields.items():
                  pattern = rf'(?<![A-Za-z]){re.escape(field)}: "[^"]*"'
                  line, count = re.subn(pattern, lambda m: f'{field}: "{value}"', line)
                  if count != 1:
                      raise SystemExit(f'{professor_id} field {field}: {count} matches')
              lines[i] = line
          path.write_text(''.join(lines))
          PY
          node --check data/professor-data.js

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/professor-data.js .github/workflows/update-professor-images-temp-15.yml
          git commit -m 'Update six professor photos and management department'
          git push
