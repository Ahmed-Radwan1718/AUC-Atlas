name: One-shot professor image update 10

on:
  push:
    paths:
      - '.github/workflows/update-professor-images-temp-10.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update exact professor records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('data/professor-data.js')
          lines = path.read_text().splitlines(keepends=True)
          updates = {
            "ahmad-saqfalhait": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793729230/1e233fae-dfb8-471b-b560-2ea009993df6.png"
            },
            "mustafa-arafa": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793558739/800ea61f-86a8-4493-b325-7f7f11c9f16b.png"
            },
            "ahmed-moustafa": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793729479/3ddd11ab-73aa-4aa5-99b4-fa46f760c345.png",
              "email": "amoustafa@aucegypt.edu"
            },
            "ahmed-rafea": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793729565/3f3fb875-b3ca-46bb-a750-4db77c6e02e9.png",
              "email": "rafea@aucegypt.edu",
              "department": "Computer Science and Engineering",
              "displayDepartment": "CSCE",
              "filterDepartment": "Computer Science"
            }
          }
          for professor_id, fields in updates.items():
              marker = f'id: "{professor_id}"'
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one match for {professor_id}, found {len(matches)}')
              i = matches[0]
              line = lines[i]
              for field, value in fields.items():
                  pattern = rf'(?<![A-Za-z]){re.escape(field)}: "[^"]*"'
                  line, count = re.subn(pattern, lambda m: f'{field}: "{value}"', line)
                  if count != 1:
                      raise SystemExit(f'{professor_id} field {field}: {count} matches')
              lines[i] = line
          path.write_text(''.join(lines))
          PY
          node --check data/professor-data.js

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/professor-data.js .github/workflows/update-professor-images-temp-10.yml
          git commit -m 'Update four professor photos and contact details'
          git push
