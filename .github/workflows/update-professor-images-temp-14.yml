name: One-shot professor image update 14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-professor-images-temp-14.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update exact professor records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('data/professor-data.js')
          lines = path.read_text().splitlines(keepends=True)
          updates = {
            "fayrouz-sakr-ashour": {
              "name": "Fayrouz Sakr-Ashour",
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730927/c18d2a65-8c11-4181-af30-26f81dc931f6.png",
              "email": "fayrouz.ashour@aucegypt.edu"
            },
            "habib-maki": {
              "name": "Maki Habib",
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730878/7062d2fa-26db-43a0-beee-ca97d9307b56.png",
              "email": "maki@aucegypt.edu",
              "department": "Mechanical Engineering",
              "displayDepartment": "MENG",
              "filterDepartment": "Engineering"
            },
            "hakim-meshriki": {
              "name": "Hakim Meshreki",
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730992/c1229096-bcf2-412e-92ba-b3ebfca5f2f1.png",
              "email": "hmeshreki@aucegypt.edu",
              "department": "Management",
              "displayDepartment": "MGMT",
              "filterDepartment": "Business"
            },
            "hanadi-salem": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793731177/761ba0bb-ff18-4743-b209-e955243a791a.png",
              "email": "hgsalem@aucegypt.edu",
              "department": "Mechanical Engineering",
              "displayDepartment": "MENG",
              "filterDepartment": "Engineering"
            },
            "hanan-sabea": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793731232/bdf4b188-c1dc-4f3f-90aa-58456ca46d05.png",
              "email": "hsabea@aucegypt.edu"
            }
          }
          for professor_id, fields in updates.items():
              marker = f'id: "{professor_id}"'
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one match for {professor_id}, found {len(matches)}')
              i = matches[0]
              line = lines[i]
              for field, value in fields.items():
                  pattern = rf'(?<![A-Za-z]){re.escape(field)}: "[^"]*"'
                  line, count = re.subn(pattern, lambda m: f'{field}: "{value}"', line)
                  if count != 1:
                      raise SystemExit(f'{professor_id} field {field}: {count} matches')
              lines[i] = line
          path.write_text(''.join(lines))
          PY
          node --check data/professor-data.js

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/professor-data.js .github/workflows/update-professor-images-temp-14.yml
          git commit -m 'Update five professor photos and profile details'
          git push
