name: One-shot professor image update 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-professor-images:
    if: github.event.head_commit.message == 'Add one-shot workflow for three professor photos'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update professor image URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('data/professor-data.js')
          text = path.read_text()
          replacements = {
              'https://res.cloudinary.com/hpsuzs6q/image/upload/v1786199876/Ahmed_Abou-Auf_citwhy.png': 'https://res.cloudinary.com/dhtamisqn/image/upload/v1793717022/smkstnjpsxidtpyqavtq.png',
              'https://res.cloudinary.com/hpsuzs6q/image/upload/v1786235263/Ahmed_ElBanbi_ar5do5.png': 'https://res.cloudinary.com/dhtamisqn/image/upload/v1793717418/a78149c3-6355-4404-b5fb-2bfb50a5368f.png',
              'https://res.cloudinary.com/hpsuzs6q/image/upload/v1786235505/Ahmed_Elbayoumi_ebblcb.png': 'https://res.cloudinary.com/dhtamisqn/image/upload/v1793717547/908d60f4-cfe3-4031-bd1d-a59d72374616.png',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old}, found {count}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-2.yml
          git config user.name "Ahmed-Radwan1718"
          git config user.email "ahmedradwan21@gmail.com"
          git add data/professor-data.js .github/workflows/update-professor-images-temp-2.yml
          git commit -m "Update Ahmed professor photos"
          git push
