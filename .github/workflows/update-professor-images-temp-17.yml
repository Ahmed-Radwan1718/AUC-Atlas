name: One-shot professor image update 17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-professor-images-temp-17.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update exact professor records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('data/professor-data.js')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          updates = {
            "islam-tharwat": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793732232/9b9481ab-48d0-424d-ac7a-da7dd8d6b70b.png"
            },
            "jasmin-fouad": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793732351/e9d1a3d5-dc79-42bc-afdd-d3cd642174f7.png",
              "email": "jfouad@aucegypt.edu",
              "department": "Management",
              "displayDepartment": "MGMT",
              "filterDepartment": "Business"
            },
            "jochen-braun": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793732497/5d9114da-2546-40be-b12b-89934b90e152.png"
            },
            "karim-addas": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793732574/7ca4de48-ec64-4af2-b3e9-208dcf6493bd.png"
            }
          }
          for professor_id, fields in updates.items():
              marker = f'id: "{professor_id}"'
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one match for {professor_id}, found {len(matches)}')
              i = matches[0]
              line = lines[i]
              for field, value in fields.items():
                  pattern = rf'(?<![A-Za-z]){re.escape(field)}: "[^"]*"'
                  line, count = re.subn(pattern, lambda m: f'{field}: "{value}"', line)
                  if count != 1:
                      raise SystemExit(f'{professor_id} field {field}: {count} matches')
              lines[i] = line
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          node --check data/professor-data.js

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-17.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/professor-data.js .github/workflows/update-professor-images-temp-17.yml
          git commit -m 'Update four professor photos and Jasmin Fouad profile'
          git push
