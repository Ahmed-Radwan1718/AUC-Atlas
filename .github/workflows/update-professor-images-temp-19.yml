name: One-shot professor image update 19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-professor-images-temp-19.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update exact professor records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('data/professor-data.js')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          updates = {
            "lameese-eldesouky": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793733186/bb1880b9-50a2-4ef1-864c-1a0338e775dc.png"
            },
            "maha-bali": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793733358/8a7da883-aad0-4e39-8332-16d11333828a.png"
            },
            "maha-mourad": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793733426/33e5427b-00ce-4c50-bc03-7201f6547bc3.png",
              "email": "m_mourad@aucegypt.edu",
              "department": "Management",
              "displayDepartment": "MGMT",
              "filterDepartment": "Business"
            }
          }
          for professor_id, fields in updates.items():
              marker = f'id: "{professor_id}"'
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one match for {professor_id}, found {len(matches)}')
              i = matches[0]
              line = lines[i]
              for field, value in fields.items():
                  pattern = rf'(?<![A-Za-z]){re.escape(field)}: "[^"]*"'
                  line, count = re.subn(pattern, lambda m: f'{field}: "{value}"', line)
                  if count != 1:
                      raise SystemExit(f'{professor_id} field {field}: {count} matches')
              lines[i] = line
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          node --check data/professor-data.js

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-19.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/professor-data.js .github/workflows/update-professor-images-temp-19.yml
          git commit -m 'Update three professor photos and Maha Mourad profile'
          git push
