name: One-shot professor image update 7

on:
  push:
    paths:
      - '.github/workflows/update-professor-images-temp-7.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace two professor image URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('data/professor-data.js')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'https://res.cloudinary.com/hpsuzs6q/image/upload/v1785764402/Catarina_Belo_jlc7xl.png': 'https://res.cloudinary.com/dhtamisqn/image/upload/v1793718680/ecc6a59f-eee9-4d18-a61c-f1be0bb3becb.png',
              'https://www.aucegypt.edu/sites/default/files/2024-02/chelsea_green.jpg': 'https://res.cloudinary.com/dhtamisqn/image/upload/v1793718716/7e973fd9-60dd-4e32-8807-b72722f402f1.png',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-professor-images-temp-7.yml
          git add data/professor-data.js
          git commit -m "Update Catarina Belo and Chelsea Green photos"
          git push
