name: One-shot professor image update 11

on:
  push:
    paths:
      - '.github/workflows/update-professor-images-temp-11.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update exact professor records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('data/professor-data.js')
          lines = path.read_text().splitlines(keepends=True)
          updates = {
            "amr-shaarawi": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793729990/40288fc1-f3ba-4e1f-98a1-381df41b2a8e.png",
              "email": "shaarawi@aucegypt.edu",
              "department": "Physics",
              "displayDepartment": "PHYS",
              "filterDepartment": "Sciences"
            },
            "andreas-kakarougkas": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730132/40e5103b-afad-4016-94d0-c117aacad711.png",
              "email": "a.kakarougkas@aucegypt.edu",
              "department": "Biology",
              "displayDepartment": "BIOL",
              "filterDepartment": "Sciences"
            },
            "ashraf-el-fiqi": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730076/a7cdb6ee-1b0d-4ec6-a697-8ef30300743a.png",
              "email": "elfiqi@aucegypt.edu",
              "department": "Physics",
              "displayDepartment": "PHYS",
              "filterDepartment": "Sciences"
            },
            "ayman-ismail": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730182/eab80d96-d68f-44d6-8ddc-b234713594ff.png",
              "email": "aymanism@aucegypt.edu",
              "department": "Management",
              "displayDepartment": "MGMT",
              "filterDepartment": "Business"
            }
          }
          for professor_id, fields in updates.items():
              marker = f'id: "{professor_id}"'
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one match for {professor_id}, found {len(matches)}')
              i = matches[0]
              line = lines[i]
              for field, value in fields.items():
                  pattern = rf'(?<![A-Za-z]){re.escape(field)}: "[^"]*"'
                  line, count = re.subn(pattern, lambda m: f'{field}: "{value}"', line)
                  if count != 1:
                      raise SystemExit(f'{professor_id} field {field}: {count} matches')
              lines[i] = line
          path.write_text(''.join(lines))
          PY
          node --check data/professor-data.js

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/professor-data.js .github/workflows/update-professor-images-temp-11.yml
          git commit -m 'Update four professor photos and contact details'
          git push
