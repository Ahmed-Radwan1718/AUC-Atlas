name: One-time exact file icon migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Stage exact legacy file icon migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy exact legacy file icons and localize references
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/Ahmed-Radwan1718/AUC-Atlas/main"
          mkdir -p public

          for file in pdf.png doc.png xls.png ppt.png png.png jpg.png; do
            curl --fail --silent --show-error --location "$base/$file" --output "public/$file"
          done

          check_blob() {
            file="$1"
            expected="$2"
            actual="$(git hash-object "public/$file")"
            if [ "$actual" != "$expected" ]; then
              echo "Blob mismatch for $file: expected $expected, got $actual" >&2
              exit 1
            fi
          }

          check_blob pdf.png 5196ca4687953f37eacf7ccc2ab0aed13ed1ce13
          check_blob doc.png 2f30604be5d5ea445bc7129049c33ed8df18cfc7
          check_blob xls.png 69f450eb0e086a9d9b6e547bc84c1ae7739a186e
          check_blob ppt.png 05b9031e45595499811cd8d01a6ceff226855958
          check_blob png.png c6babf18e963f3f78af49be24bd05b4907e7b1da
          check_blob jpg.png f8074f6eecb963982851a3890aa254f8a45dddce

          python - <<'PY'
          from pathlib import Path

          courses = Path("components/courses/CoursesDirectory.tsx")
          courses_text = courses.read_text(encoding="utf-8")
          courses_old = 'return map[extension] ? `${LEGACY_ORIGIN}/${map[extension]}` : "";'
          courses_new = 'return map[extension] ? `/${map[extension]}` : "";'
          if courses_text.count(courses_old) != 1:
              raise SystemExit("Unexpected CoursesDirectory file-icon reference count")
          courses.write_text(courses_text.replace(courses_old, courses_new), encoding="utf-8")

          account = Path("components/account/AccountDashboard.tsx")
          account_text = account.read_text(encoding="utf-8")
          account_old = 'return icons[extension] ? `${ASSET_BASE}/${icons[extension]}` : "";'
          account_new = 'return icons[extension] ? `/${icons[extension]}` : "";'
          if account_text.count(account_old) != 1:
              raise SystemExit("Unexpected AccountDashboard file-icon reference count")
          account.write_text(account_text.replace(account_old, account_new), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pdf.png public/doc.png public/xls.png public/ppt.png public/png.png public/jpg.png \
            components/courses/CoursesDirectory.tsx components/account/AccountDashboard.tsx
          git commit -m "Localize exact course material file icons"
          git push origin HEAD:main
