name: One-shot professor image update 16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-professor-images-temp-16.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update exact professor records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('data/professor-data.js')
          lines = path.read_text().splitlines(keepends=True)
          updates = {
            "ibrahim-karkouti": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793731977/e184ede7-658e-4704-bb38-a2c9e1765115.png"
            },
            "hossam-sharara": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793732019/105262d0-4c46-4c9a-bf2b-e237a11824ec.png",
              "email": "hossam.sharara@aucegypt.edu",
              "department": "Computer Science and Engineering",
              "displayDepartment": "CSCE",
              "filterDepartment": "Computer Science"
            },
            "isabel-muller": {
              "name": "Isabel Müller",
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793732120/f094c3e0-6c2e-4775-99c4-459990310e78.png"
            }
          }
          for professor_id, fields in updates.items():
              marker = f'id: "{professor_id}"'
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one match for {professor_id}, found {len(matches)}')
              i = matches[0]
              line = lines[i]
              for field, value in fields.items():
                  pattern = rf'(?<![A-Za-z]){re.escape(field)}: "[^"]*"'
                  line, count = re.subn(pattern, lambda m: f'{field}: "{value}"', line)
                  if count != 1:
                      raise SystemExit(f'{professor_id} field {field}: {count} matches')
              lines[i] = line
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          node --check data/professor-data.js

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-16.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/professor-data.js .github/workflows/update-professor-images-temp-16.yml
          git commit -m 'Update three professor images and details'
          git push
