name: One-shot professor image update 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-professor-images-temp-5.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update professor image URL
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('data/professor-data.js')
          text = path.read_text(encoding='utf-8')
          updates = {
              'Angie Zaher': 'https://res.cloudinary.com/dhtamisqn/image/upload/v1793718170/8c471e1b-9306-4225-b3d3-70e704ef3a20.png',
          }

          for name, url in updates.items():
              pattern = rf'(name: "{re.escape(name)}"[^\n]*?image: ")[^"]*(")'
              text, count = re.subn(pattern, rf'\g<1>{url}\g<2>', text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {name}, found {count}')

          path.write_text(text, encoding='utf-8')

      - name: Commit update and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-professor-images-temp-5.yml
          git add data/professor-data.js .github/workflows/update-professor-images-temp-5.yml
          git commit -m "Update Angie Zaher professor photo"
          git push
