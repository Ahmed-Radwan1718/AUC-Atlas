name: One-shot professor image update 13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-professor-images-temp-13.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update exact professor records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('data/professor-data.js')
          lines = path.read_text().splitlines(keepends=True)
          updates = {
            "brenda-segone": {
              "name": "Brenda M. Segone",
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730599/5eee419a-5ad5-4fed-a86c-e0b1af79e652.png",
              "department": "Arts",
              "displayDepartment": "ARTS",
              "filterDepartment": "Humanities"
            },
            "daria-mizza": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730567/0a7bac9f-06ae-4fba-98b6-a1dfdf27b5ba.png"
            },
            "dina-heshmat": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730743/9487dd54-2f66-474b-91d8-0e6d11852902.png",
              "email": "dina.heshmat@aucegypt.edu"
            }
          }
          for professor_id, fields in updates.items():
              marker = f'id: "{professor_id}"'
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one match for {professor_id}, found {len(matches)}')
              i = matches[0]
              line = lines[i]
              for field, value in fields.items():
                  pattern = rf'(?<![A-Za-z]){re.escape(field)}: "[^"]*"'
                  line, count = re.subn(pattern, lambda m: f'{field}: "{value}"', line)
                  if count != 1:
                      raise SystemExit(f'{professor_id} field {field}: {count} matches')
              lines[i] = line
          path.write_text(''.join(lines))
          PY
          node --check data/professor-data.js

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/professor-data.js .github/workflows/update-professor-images-temp-13.yml
          git commit -m 'Update Brenda Segone, Daria Mizza and Dina Heshmat records'
          git push
