name: One-shot professor image update 12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-professor-images-temp-12.yml'

permissions:
  contents: write

jobs:
  update-professor-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update exact professor records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('data/professor-data.js')
          lines = path.read_text().splitlines(keepends=True)
          updates = {
            "ashraf-nassef": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730371/4c8f6981-af76-428d-8b07-08052f308ec0.png",
              "email": "nassef@aucegypt.edu",
              "department": "Mechanical Engineering",
              "displayDepartment": "MENG",
              "filterDepartment": "Engineering"
            },
            "ibrahim-abotaleb": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730417/0dcf17e2-5e8d-480c-aa5e-b2c9f84cf626.png",
              "email": "ibrahimsalah@aucegypt.edu",
              "department": "Construction Engineering",
              "displayDepartment": "CENG",
              "filterDepartment": "Engineering"
            },
            "cherif-salama": {
              "image": "https://res.cloudinary.com/dhtamisqn/image/upload/v1793730447/807bc24b-f417-443d-abc7-cd701d0865d6.png",
              "email": "cherif.salama@aucegypt.edu",
              "department": "Computer Science and Engineering",
              "displayDepartment": "CSCE",
              "filterDepartment": "Computer Science"
            }
          }
          for professor_id, fields in updates.items():
              marker = f'id: "{professor_id}"'
              matches = [i for i, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one match for {professor_id}, found {len(matches)}')
              i = matches[0]
              line = lines[i]
              for field, value in fields.items():
                  pattern = rf'(?<![A-Za-z]){re.escape(field)}: "[^"]*"'
                  line, count = re.subn(pattern, lambda m: f'{field}: "{value}"', line)
                  if count != 1:
                      raise SystemExit(f'{professor_id} field {field}: {count} matches')
              lines[i] = line
          path.write_text(''.join(lines))
          PY
          node --check data/professor-data.js

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/update-professor-images-temp-12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/professor-data.js .github/workflows/update-professor-images-temp-12.yml
          git commit -m 'Update three professor photos and department details'
          git push
